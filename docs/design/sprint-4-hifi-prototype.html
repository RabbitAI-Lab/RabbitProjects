    totalW 按跨度（69 天）而非天数（70 天含末日）声明容器宽，列合计超容器触发
    flex-shrink 等比压缩（每列 ~35.49px < 36px），而条定位按严格天数×列宽，每过
    一天累积 ~0.51px。修复：宽度按天数计数 + .g-col flex:0 0 auto 兜底；三粒度
    像素级复测 delta=0.00（周粒度参照点差一天为预期），全量自检 67 断言复跑通过。
  · 冻结后勘误 2（2026-09-06，用户走查发现）：视图条右端「视图菜单 ⋯」tooltip 朝上
    弹出被 .pmain{overflow:hidden} 裁切顶缘——挂 tip-up 类改朝下；顺带修正文件树
    「目录操作 ⋯」的无效属性 data-tip-class="tip-up"（选择器认类不认属性）为真类。
  · 冻结后勘误 3（2026-09-06，用户走查发现）：依赖连线起点悬空不接任务条——x1 公式
    误用「终点偏移 + 条宽」（右缘上多加一遍跨度，blocks 4 天线悬空 144px、跨度越大
    越远）；改为与 barHTML 同构「起点偏移 + 条宽」，四线端点实测 gap 全 0。
  · 下游基准：本文件冻结后即为 Sprint-4 前端实现的视觉/交互验收基准；UI 表面

<style>
/* ═════════ 设计 token · 与 sprint-0/1/2/3 冻结基线一致 ═════════ */
:root{
  --brand-50:#eef4ff;--brand-100:#dbe7fe;--brand-500:#3f76ff;--brand-600:#2f5fe0;
  --state-unstarted:#9ca3af;--state-started:#3b82f6;--state-completed:#10b981;--state-cancelled:#6b7280;
  --danger:#ef4444;--ok:#059669;--warn:#f59e0b;--amber-bg:#fffbeb;--amber-line:#fde68a;--amber-ink:#b45309;
  --bg:#fafafa;--surface:#ffffff;--surface-2:#f5f5f5;--surface-3:#ececec;
  --line:#e5e5e5;--line-strong:#d4d4d4;
  --ink:#262626;--ink-2:#525252;--ink-3:#8c8c8c;--ink-4:#a3a3a3;
  --radius-card:.5rem;--radius-md:6px;--radius-lg:8px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);--shadow-md:0 4px 12px rgba(0,0,0,.08);--shadow-lg:0 12px 32px rgba(0,0,0,.14);
  --font-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --header-h:48px;--ease-spring:cubic-bezier(.2,.9,.3,1.1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-ui);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
svg{flex-shrink:0}
:focus-visible{outline:2px solid var(--brand-500);outline-offset:1px;border-radius:4px}
[hidden]{display:none!important}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ═════════ 基础控件（基线沿用） ═════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:var(--radius-md);font-weight:500;font-size:13px;transition:background .12s,border-color .12s,opacity .12s;white-space:nowrap}
.btn-primary{background:var(--brand-500);color:#fff}
.btn-primary:hover{background:var(--brand-600)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:var(--surface);border:1px solid var(--line-strong);color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-ghost:disabled{opacity:.5;cursor:not-allowed}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-sm{height:28px;padding:0 10px;font-size:12px}
.icon-btn{width:30px;height:30px;border-radius:var(--radius-md);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-3)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.input{width:100%;height:36px;border:1px solid var(--line-strong);border-radius:var(--radius-md);padding:0 10px;background:var(--surface);transition:border-color .12s,box-shadow .12s}
.input:focus{outline:none;border-color:var(--brand-500);box-shadow:0 0 0 3px var(--brand-50)}
.input.invalid{border-color:var(--danger)}
textarea.input{height:auto;padding:8px 10px;resize:vertical;line-height:1.6}
.label{display:block;font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:6px}
.hint{font-size:12px;color:var(--ink-3)}
.err-text{font-size:12px;color:var(--danger);margin-top:4px}
.badge-id{font-family:var(--font-mono);font-size:11px;padding:1px 6px;background:var(--surface-2);border-radius:4px;color:var(--ink-2);white-space:nowrap}
.avatar{width:28px;height:28px;border-radius:50%;color:#fff;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.avatar-sm{width:20px;height:20px;font-size:10px}
a{color:var(--brand-600);text-decoration:none}
a:hover{text-decoration:underline}
.link-btn{color:var(--brand-600);font-size:13px}
.link-btn:hover{text-decoration:underline}
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#262626;color:#fff;font-size:12px;font-weight:400;padding:4px 9px;border-radius:6px;white-space:nowrap;z-index:300;pointer-events:none;text-decoration:none}
[data-tip].tip-up:hover::after{bottom:auto;top:calc(100% + 6px)}

/* ═════════ 弹层 / 下拉 / Toast（基线沿用） ═════════ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.32);backdrop-filter:blur(2px);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s ease}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow-lg);width:480px;max-width:100%;max-height:88vh;overflow:auto;padding:24px;animation:pop .18s var(--ease-spring)}
.modal.w400{width:400px}.modal.w520{width:520px}.modal.w640{width:640px}.modal.w920{width:920px}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-title{font-size:16px;font-weight:600}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.menu{position:absolute;min-width:160px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:4px;z-index:60;animation:pop .12s var(--ease-spring)}
.menu-item{display:flex;width:100%;align-items:center;gap:8px;min-height:32px;padding:4px 12px;border-radius:var(--radius-md);font-size:13px;color:var(--ink-2);text-align:left}
.menu-item:hover{background:var(--surface-2)}
.menu-item.danger{color:#dc2626}
.menu-item.disabled{color:var(--ink-4);cursor:not-allowed}
.menu-item.disabled:hover{background:none}
.menu-sep{height:1px;background:var(--line);margin:4px 0}
.mrow{display:flex;width:100%;align-items:center;gap:8px;min-height:30px;padding:4px 12px;border-radius:var(--radius-md);font-size:13px;color:var(--ink-2);text-align:left}
.mrow:hover{background:var(--surface-2)}
.mrow .cb{width:15px;height:15px;accent-color:var(--brand-500);flex-shrink:0}
.mrow.active{color:var(--ink);font-weight:500}
.skel{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:skel 1.2s infinite;border-radius:var(--radius-md)}
.toast-wrap{position:fixed;top:16px;right:16px;z-index:220;display:flex;flex-direction:column;gap:8px;width:380px}
.toast{border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:10px 14px;font-size:13px;display:flex;align-items:flex-start;gap:8px;animation:slide-in .2s var(--ease-spring);color:#fff}
.toast .tx{flex:1;min-width:0}
.toast-info{background:#2563eb}.toast-warning{background:#d97706}.toast-error{background:#b91c1c}.toast-ok{background:#059669}

/* ═════════ 应用壳（基线沿用） ═════════ */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;flex-shrink:0}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.shell{display:flex;flex:1;min-height:0}
.psidebar{width:220px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:2px;padding:12px;flex-shrink:0}
.p-id{display:flex;align-items:center;gap:9px;padding:6px 10px 12px}
.p-id .nm{font-size:14px;font-weight:600}
.side-item{height:34px;padding:0 10px;border-radius:var(--radius-md);display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2);width:100%;text-align:left}
.side-item:hover{background:var(--surface-2)}
.side-item.active{background:var(--brand-50);color:var(--brand-600);font-weight:500}
.side-label{font-size:11px;font-weight:600;color:var(--ink-4);text-transform:uppercase;letter-spacing:.05em;padding:10px 10px 4px}
.pmain{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:60px 0;color:var(--ink-3);text-align:center}
.empty-title{font-size:15px;font-weight:600;color:var(--ink-2)}
.empty-sub{font-size:13px;color:var(--ink-3)}
.empty .btn{margin-top:8px}

/* ═════════ 视图条（BOARD-003 框架 · layout=gantt 态，O1） ═════════ */
.viewswitch{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--surface);flex-shrink:0;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:2px;gap:2px}
.seg-btn{height:28px;padding:0 10px;border-radius:6px;font-size:12.5px;color:var(--ink-3);display:inline-flex;align-items:center;gap:5px}
.seg-btn:hover{color:var(--ink-2)}
.seg-btn.active{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:var(--shadow-sm)}
.layoutlink{height:32px;padding:0 12px;border-radius:6px;font-size:13px;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px}
.layoutlink:hover{background:var(--surface-2);color:var(--ink-2)}
.layoutlink.active{color:var(--brand-600);background:var(--brand-50);font-weight:500}

/* ═════════ 甘特控制条 + 延期概览（O1） ═════════ */
.gctl{display:flex;align-items:center;gap:8px;padding:8px 20px;border-bottom:1px solid var(--line);background:var(--surface);flex-shrink:0}
.gctl .right{margin-left:auto;display:flex;align-items:center;gap:6px}
.overduebar{display:flex;align-items:center;gap:8px;padding:7px 20px;background:var(--amber-bg);border-bottom:1px solid var(--amber-line);color:var(--amber-ink);font-size:13px;flex-shrink:0}
.overduebar .who{background:var(--surface);border:1px solid var(--amber-line);border-radius:99px;padding:0 8px;font-size:12px}

/* ═════════ 甘特图表区（G001 §3.1/§3.2/§3.3） ═════════ */
.gantt-wrap{flex:1;min-height:0;display:flex;overflow:hidden;background:var(--surface)}
.g-left{width:320px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--surface);position:relative}
.g-left-head{height:40px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 12px;font-size:13px;font-weight:500;color:var(--ink-2);flex-shrink:0}
.g-left-body{flex:1;overflow:hidden;position:relative}
.grow{height:36px;display:flex;align-items:center;gap:6px;padding-right:8px;font-size:13px;cursor:default;position:relative}
.grow:hover{background:var(--surface-2)}
.grow.selected{background:var(--brand-50)}
.grow .caret{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-3);flex-shrink:0;border-radius:4px}
.grow .caret:hover{background:var(--surface-3)}
.grow .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.grow .estimate{font-size:11px;color:var(--ink-4);font-family:var(--font-mono)}
.g-resizer{width:5px;cursor:col-resize;background:transparent;position:absolute;top:0;right:-3px;height:100%;z-index:5}
.g-resizer:hover,.g-resizer.on{background:var(--brand-100)}
.g-right{flex:1;min-width:0;position:relative;overflow:hidden;display:flex;flex-direction:column}
.g-thead{height:40px;border-bottom:1px solid var(--line);overflow:hidden;position:relative;flex-shrink:0;background:var(--surface)}
.g-body{flex:1;overflow:hidden;position:relative;cursor:grab}
.g-body.panning{cursor:grabbing}

const RANGE0=d2(2026,8,17), RANGE1=d2(2026,10,25);
const HOLIDAYS={"2026-09-25":"中秋"};
const GRAN={day:{ppd:36,label:"日"},week:{ppd:13,label:"周"},month:{ppd:9,label:"月"}};

function visibleRows(){
 const out=[];
 for(const it of ISSUES){
  if(it.parent&&!isAncestorOpen(it))continue;
  out.push(it);
 }
 return out;
}
function isAncestorOpen(it){
 let p=it.parent;
 while(p){const pn=ISSUES.find(x=>x.id===p);if(!pn||S.collapsed.has(pn.id))return false;p=pn.parent}
 return true;
}
function ganttColumnsHTML(){
 const cols=[];let t=new Date(RANGE0);
 if(S.gran==="day"){
  while(t<=RANGE1){const iso=fmtISO(t),hol=HOLIDAYS[iso],wd=t.getDay();
   cols.push(`<div class="g-col${wd===0||wd===6?" wknd":""}${hol?" hol":""}" style="width:${GRAN.day.ppd}px" title="${hol||""}">${t.getDate()}${hol?`<span class="sub">${hol}</span>`:""}</div>`);
   t=new Date(t.getTime()+DAY);}
 }else if(S.gran==="week"){
  while(t<=RANGE1){const end=new Date(Math.min(t.getTime()+6*DAY,RANGE1));const w=days(t,end)+1;
   cols.push(`<div class="g-col" style="width:${w*GRAN.week.ppd}px">${fmtD(t)} – ${fmtD(end)}</div>`);
   t=new Date(end.getTime()+DAY);}
 }else{
  while(t<=RANGE1){const eom=new Date(t.getFullYear(),t.getMonth()+1,0);const end=eom>RANGE1?RANGE1:eom;const w=days(t,end)+1;
   cols.push(`<div class="g-col" style="width:${w*GRAN.month.ppd}px">${t.getFullYear()} 年 ${t.getMonth()+1} 月</div>`);
   t=new Date(end.getTime()+DAY);}
 }
 return cols.join("");
}

 }

  if(HOLIDAYS[iso])h+=`<div class="g-cell-hol" style="left:${dX(t)}px;width:${GRAN.day.ppd}px"></div>`;

  t=new Date(t.getTime()+DAY)}
 return h;
}
function rowTop(i){return i*36}
function barHTML(it,i){
 const x=dX(it.start??it.end??RANGE0), w=Math.max(days(it.start??it.end,it.end??it.start)+1,1)*GRAN[S.gran].ppd;
 const cls=["gbar",it.agg?"agg":"st-"+it.state];
 if(it.overdue)cls.push("overdue");
 if(it.openStart)cls.push("open-start");
 if(it.openEnd)cls.push("open-end");
 if(it.start&&it.end&&it.start<=TODAY&&it.end>=TODAY)cls.push("cross-today");
 const fillPct=it.agg?it.progress:it.state==="completed"?100:it.progress;
 const txt=w>=80?`<span class="txt">${esc(it.id)} ${esc(it.title)}</span>`:"";
 const warn=it.overdue?`<span class="warn-ico">⚠</span>`:"";
 const aria=`${it.id} ${it.title}，${it.start?fmtD(it.start):"未设置开始"}至${it.end?fmtD(it.end):"未设置截止"}，进度 ${it.progress}%，${it.state==="completed"?"已完成":it.state==="cancelled"?"已取消":"进行中"}`;
 return `<div class="${cls.join(" ")}" data-bar="${it.id}" data-row="${i}" role="button" tabindex="0" aria-label="${esc(aria)}"
   style="left:${x}px;width:${w}px;top:${rowTop(i)+8}px">
   <div class="fill" style="width:${fillPct}%"></div>${txt}${warn}
   <div class="rz l" data-rz="l" data-bar="${it.id}"></div><div class="rz r" data-rz="r" data-bar="${it.id}"></div>
 </div>`;
}
function relLinesHTML(rows){
 const idx={};rows.forEach((r,i)=>idx[r.id]=i);
 let out="";
 for(const rel of RELS){
  const a=idx[rel.from],b=idx[rel.to];
  if(a==null||b==null)continue;
  const A=ISSUES.find(x=>x.id===rel.from),B=ISSUES.find(x=>x.id===rel.to);
  if(!A||!B)continue;
  // 起点挂 A 条右缘——几何与 barHTML 同构（起点偏移 + 条宽）；开放端条按已有边算
  const aw=Math.max(days(A.start??A.end,A.end??A.start)+1,1)*GRAN[S.gran].ppd;
  const x1=dX(A.start??A.end??RANGE0)+aw;
  const y1=rowTop(a)+18;
  const x2=dX(B.start??B.end??RANGE0),y2=rowTop(b)+18;
  const mx=(x1+x2)/2;
  const d=`M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
  let dot="";
  if(rel.type==="blocks"){
   dot=`<circle class="dot-end" cx="${x2}" cy="${y2}" r="3" fill="#3f76ff"/><path d="M ${x2-5} ${y2-4} l 5 4 l -5 4" fill="none" stroke="#3f76ff" stroke-width="1.5"/>`;
   if(rel.conflict||isRelConflict(A,B))dot+=`<circle class="conflict-dot${S.conflictPulse===rel?" pulse":""}" data-cdot="1" cx="${mx}" cy="${(y1+y2)/2}" r="4"/>`;
  }else if(rel.type==="duplicates"){
   dot=`<rect x="${x2-4}" y="${y2-4}" width="8" height="8" transform="rotate(45 ${x2} ${y2})" fill="none" stroke="#9ca3af"/>`;
  }else{
   dot=`<circle cx="${x1}" cy="${y1}" r="2.5" fill="#9ca3af"/><circle cx="${x2}" cy="${y2}" r="2.5" fill="#9ca3af"/>`;
  }
  const hl=S.hlRel===rel?' class="hl"':"";
  out+=`<path d="${d}" class="rel-${rel.type}${hl?" hl":""}" data-rel="${rel.from}|${rel.to}"/>${dot}`;
 }
 return out;
}
function isRelConflict(A,B){ // B 起期早于 A 终期（开放端按已有边算）
 const aEnd=A.end,aB=B.start;
 return !!(aEnd&&aB&&aB<aEnd);
}

function applyGanttPointer(){

 body.addEventListener("mousedown",e=>{

 });
 body.addEventListener("wheel",e=>{
  if(e.ctrlKey){e.preventDefault();S.pan=clampPan(S.pan+e.deltaY);syncGanttTransform();return}
  if(Math.abs(e.deltaX)>Math.abs(e.deltaY)){e.preventDefault();S.pan=clampPan(S.pan+e.deltaX);syncGanttTransform()}
 },{passive:false});
 // 左栏栏宽拖拽（240~480）
 const rz=$("[data-resizer]");
 if(rz){

 }

  });

function ensureBadge(){if(!badgeEl){badgeEl=document.createElement("div");badgeEl.className="drag-badge";document.body.appendChild(badgeEl)}badgeEl.style.display="block";return badgeEl}
function hideBadge(){if(badgeEl)badgeEl.style.display="none"}
/* 阈值激活：mousedown 只登记候选，移动超 4px 才升级为拖拽（视觉+占位）——
   保证纯单击（打开详情抽屉）不被 mouseup 的 render 吞掉 click 事件 */
let pendingDrag=null;
function startDrag(id,mode,e){
 if(S.role==="VIEWER"){toast("访客只读：拖拽改期需 CONTRIBUTOR+（PATCH 403）","warning");return}
 const it=ISSUES.find(x=>x.id===id);if(!it||(!it.start&&!it.end))return;
 pendingDrag={id,mode,x0:e.clientX,it,s0:it.start?new Date(it.start):null,e0:it.end?new Date(it.end):null};
 e.preventDefault();
}
function activateDrag(){
 const p=pendingDrag;pendingDrag=null;
 dragCtx={...p,conflict:false,clamped:false,moved:true};
 justDragged=true;
 const bar=$(`.gbar[data-bar="${p.id}"]`);bar?.classList.add("dragging");
 const ghost=bar?.cloneNode(true);if(ghost){ghost.classList.add("ghosted");ghost.classList.remove("dragging");ghost.style.opacity="";bar?.parentNode?.insertBefore(ghost,bar)}
 dragCtx.ghost=ghost;dragCtx.bar=bar;
}
function globalDragMove(e){
 if(!dragCtx){
  if(pendingDrag&&Math.abs(e.clientX-pendingDrag.x0)>4)activateDrag();
  else return;
 }
 if(Math.abs(e.clientX-dragCtx.x0)>4){dragCtx.moved=true;justDragged=true}
 const ppd=GRAN[S.gran].ppd;
 const dDays=Math.round((e.clientX-dragCtx.x0)/ppd);
 let ns=dragCtx.s0?new Date(dragCtx.s0.getTime()+dDays*DAY):null;
 let ne=dragCtx.e0?new Date(dragCtx.e0.getTime()+(dragCtx.mode==="move"?dDays:0)):null;
 if(dragCtx.mode==="l")ns=dragCtx.s0?new Date(dragCtx.s0.getTime()+dDays*DAY):null;
 if(dragCtx.mode==="r")ne=dragCtx.e0?new Date(dragCtx.e0.getTime()+dDays*DAY):null;
 // 钳制：start ≤ target（chk_issue_start_before_target）
 dragCtx.clamped=false;
 if(ns&&ne&&ns>ne){
  dragCtx.clamped=true;
  if(dragCtx.mode==="move"){const span=days(dragCtx.s0,dragCtx.e0)*DAY;ns=new Date(ne.getTime()-span)}
  else if(dragCtx.mode==="l")ns=new Date(ne.getTime());
  else ne=new Date(ns.getTime());
 }
 // 依赖冲突：仅判与被拖任务相关的 blocks 连线（被阻塞方起期早于前置终期，或反向）
 dragCtx.conflict=false;
 for(const r of RELS){
  if(r.type!=="blocks")continue;
  if(r.from!==dragCtx.id&&r.to!==dragCtx.id)continue;
  const A=ISSUES.find(x=>x.id===r.from),B=ISSUES.find(x=>x.id===r.to);
  const aEnd=(r.from===dragCtx.id)?ne:A?.end, bStart=(r.to===dragCtx.id)?ns:B?.start;
  if(aEnd&&bStart&&bStart<aEnd)dragCtx.conflict=true;
 }
 $$(".conflict-dot").forEach(d=>d.classList.toggle("pulse",dragCtx.conflict));
 if(dragCtx.bar){
  const x=ns?dX(ns):dX(ne),xe=ne?dX(ne)+GRAN[S.gran].ppd:dX(ns)+GRAN[S.gran].ppd;
  dragCtx.bar.style.left=x+"px";dragCtx.bar.style.width=Math.max(xe-x,GRAN[S.gran].ppd)+"px";
 }
 const b=ensureBadge();
 let txt="";
 if(dragCtx.mode==="move")txt=`Δ ${dDays>=0?"+":""}${dDays}d`;
 else{const span=ns&&ne?days(ns,ne)+1:0;txt=`工期 ${days(dragCtx.s0,dragCtx.e0)+1}d → ${span}d`}
 if(dragCtx.clamped){b.classList.add("bad");txt+="（已钳制）";dragCtx.bar?.classList.add("clamped")}
 else b.classList.remove("bad");
 if(dragCtx.conflict)txt+=" ⚠ 依赖冲突";
 b.textContent=txt;b.style.left=(e.clientX+14)+"px";b.style.top=(e.clientY-30)+"px";
}
function globalDragEnd(e){
 $(".g-body")?.classList.remove("panning");
 if(panState){panState=null;return}
 if(!dragCtx){pendingDrag=null;return} // 纯单击：不渲染，让 click 事件正常派发
 const ctx=dragCtx;dragCtx=null;hideBadge();
 ctx.bar?.classList.remove("dragging","clamped");
 ctx.ghost?.remove();
 $$(".conflict-dot").forEach(d=>d.classList.remove("pulse"));
 if(!ctx.moved){render();return}
 const ppd=GRAN[S.gran].ppd;
 const dDays=Math.round((e.clientX-ctx.x0)/ppd);
 const apply=()=>{
  if(ctx.mode==="move"||ctx.mode==="l"){if(ctx.it.start)ctx.it.start=new Date(ctx.it.start.getTime()+dDays*DAY)}
  if(ctx.mode==="move"||ctx.mode==="r"){if(ctx.it.end)ctx.it.end=new Date(ctx.it.end.getTime()+dDays*DAY)}
  if(ctx.it.start&&ctx.it.end&&ctx.it.start>ctx.it.end)[ctx.it.start,ctx.it.end]=[ctx.it.end,ctx.it.start];
  render();
  toast(`PATCH ${ctx.it.id} {start_date:${fmtISO(ctx.it.start)}, target_date:${fmtISO(ctx.it.end)}} → 200（乐观更新就位）`,"ok",3000);
 };
 if(ctx.conflict){
  confirmModal({title:"仍按此排期？",body:`新排期使 <b>${ctx.it.id}</b> 早于其前置任务的完成日。<br>P2 连线只读不自动顺延——确认后将保存并保留连线红点提示。`,ok:"仍按此排期",act:"drag-apply",data:{}});
  S._pendingDrag=ctx;S._pendingDrag.dDays=dDays;
 }else if(Math.abs(dDays)>0)apply();
 else render();
}
addEventListener("mousemove",e=>{if(panState){S.pan=clampPan(panState.pan-(e.clientX-panState.x));syncGanttTransform()}globalDragMove(e)});
addEventListener("mouseup",globalDragEnd);
ACT["drag-apply"]=el=>{
 const ctx=S._pendingDrag;S._pendingDrag=null;
 if(!ctx)return;
 if(ctx.mode==="move"||ctx.mode==="l"){if(ctx.it.start)ctx.it.start=new Date(ctx.it.start.getTime()+ctx.dDays*DAY)}
 if(ctx.mode==="move"||ctx.mode==="r"){if(ctx.it.end)ctx.it.end=new Date(ctx.it.end.getTime()+ctx.dDays*DAY)}
 closeLayer();render();
 toast(`PATCH ${ctx.it.id} → 200（冲突保留，连线红点持续提示）`,"ok");
};
function startUnschedDrag(id,e){
 const u=UNSCHED.find(x=>x.id===id);if(!u)return;
 const b=ensureBadge();b.classList.remove("bad");
 const mv=ev=>{
  const body=$("[data-gbody]");if(!body)return;
  const r=body.getBoundingClientRect();
  const overGantt=ev.clientX>r.left&&ev.clientX<r.right&&ev.clientY>r.top&&ev.clientY<r.bottom;
  const x=ev.clientX-r.left+S.pan;
  const d=xD(Math.max(0,x));
  b.textContent=overGantt?`排期至 ${fmtD(d)}（3 天）`:"拖入时间轴排期";
  b.style.left=(ev.clientX+14)+"px";b.style.top=(ev.clientY-30)+"px";
  b.dataset.over=overGantt?"1":"";b.dataset.date=fmtISO(d);
 };
 const up=ev=>{
  removeEventListener("mousemove",mv);removeEventListener("mouseup",up);hideBadge();
  if(b.dataset.over!=="1")return;
  const d=new Date(b.dataset.date+"T00:00:00");
  const i=UNSCHED.findIndex(x=>x.id===id);UNSCHED.splice(i,1);
  ISSUES.push({id:u.id,title:u.title,parent:null,start:d,end:new Date(d.getTime()+2*DAY),progress:0,state:"unstarted",owner:u.owner,est:0,spent:0});
  render();
  toast(`POST 排期 ${u.id}：默认工期 3 天（${fmtD(d)} – ${fmtD(new Date(d.getTime()+2*DAY))}）· 未排期计数 ${UNSCHED.length}`,"ok",3200);
 };
 addEventListener("mousemove",mv);addEventListener("mouseup",up);
 e.preventDefault();
}

  if(!tr.matches(":hover"))return;
  const c=document.createElement("div");c.id="hovercard";
  c.style.cssText=`position:fixed;z-index:80;width:180px;height:130px;border-radius:8px;box-shadow:var(--shadow-lg);background:linear-gradient(135deg,#c7d7fe,#eef4ff 55%,#fde68a);pointer-events:none`;
  const r=tr.getBoundingClientRect();
  c.style.left=Math.min(r.right+12,innerWidth-200)+"px";c.style.top=(r.top-6)+"px";
  document.body.appendChild(c);
 },200);
});

/* ═════════════════════════════ 键盘 ═════════════════════════════ */
let kbTimer=null;
addEventListener("keydown",e=>{
 const tag=document.activeElement?.tagName;
 // space 密码门回车提交（输入框聚焦时也生效）
 if(S.route.startsWith("#/s/")&&S.spaceState==="pwd"&&!S.spaceLocked&&e.key==="Enter"){ACT["sp-go"]();return}
 if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;
 if(e.key==="Escape"){if(S.taskDrawer||S.prev){ACT["prev-close"]()}else if(S.modal){ACT["modal-close"]()}return}
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="e"){e.preventDefault();ACT.gexport();return}
 const inGantt=S.route.startsWith("#/p/rbt/gantt");
 if(!inGantt)return;
 const rows=visibleRows();
 const idx=rows.findIndex(r=>r.id===S.selRow);
 if(e.key==="t"||e.key==="T"){clampPanTo(TODAY);toast("T · 回到今天","info",1200)}
 else if(e.key==="1"||e.key==="2"||e.key==="3"){const c=viewportCenterDate();S.gran=["day","week","month"][+e.key-1];clampPanTo(c);render()}
 else if(e.key==="ArrowUp"||e.key==="ArrowDown"){
  if(e.shiftKey&&idx>=0){ // 键盘改期（G002 §3.4 · 300ms 合并）
   const it=rows[idx];const dd=e.key==="ArrowDown"?1:-1;
   if(it.start)it.start=new Date(it.start.getTime()+dd*DAY);
   if(it.end)it.end=new Date(it.end.getTime()+dd*DAY);
   render();
   clearTimeout(kbTimer);kbTimer=setTimeout(()=>toast(`键盘改期合并提交：PATCH ${it.id}（+${dd}d ×N → 1 次请求）`,"ok",2400),300);
  }else{
   const ni=e.key==="ArrowDown"?Math.min(idx+1,rows.length-1):Math.max(idx-1,0);
   S.selRow=rows[ni<0?0:ni]?.id;render();
  }
  e.preventDefault();
 }
 else if(e.key==="ArrowLeft"||e.key==="ArrowRight"){
  if(e.altKey&&e.shiftKey&&idx>=0){const it=rows[idx];const dd=e.key==="ArrowRight"?1:-1;if(it.end)it.end=new Date(it.end.getTime()+dd*DAY);render();e.preventDefault();return}
  if(e.altKey&&idx>=0){const it=rows[idx];const dd=e.key==="ArrowRight"?1:-1;if(it.start)it.start=new Date(it.start.getTime()+dd*DAY);render();e.preventDefault();return}
  S.pan=clampPan(S.pan+(e.key==="ArrowRight"?1:-1)*GRAN[S.gran].ppd);syncGanttTransform();
 }
 else if(e.key==="Home"){S.pan=0;syncGanttTransform()}
 else if(e.key==="End"){S.pan=clampPan(1e9);syncGanttTransform()}
 else if(e.key==="Enter"&&S.selRow){openTaskDrawer(S.selRow)}
});

function render(){

 if(S.route.startsWith("#/s/")){renderSpace();renderDock();return}

 renderStub();renderDock();
}
addEventListener("hashchange",render);
document.addEventListener("click",e=>{
 // data-stop：弹层内空白点击不冒泡到 overlay 的关闭动作（弹层内按钮不受影响）
 const stop=e.target.closest("[data-stop]");
 const b=e.target.closest("[data-act]");
 if(!b)return;
 if(stop&&!stop.contains(b))return;
 const act=ACT[b.dataset.act];
 if(act){e.preventDefault();act(b,e)}
});
