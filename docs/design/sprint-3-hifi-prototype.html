    （每行标 BOARD-00X §3.x / COLLAB-00X §3.x / TASK-011 §3.x 出处，ADR-0010 ①）。

跨文档冲突裁决（评审重点 · 冻结后回写规格）
  R1｜布局分段器位置：BOARD-003 §3.1 画在工具条最左（四段器→Tabs→⚙显示），
      TASK-011 §3.2 画在视图条右侧。裁决：以 BOARD-003 为准（IssueView 唯一事实源，
      概览 §4 表）——分段器最左；TASK-011 §3.2 右侧画法登记笔误。
  R2｜视图 URL 参数名：BOARD-003 §3.5 写 ?view=<id>，TASK-011 §3.2 写 ?view_id=，
      分组/列表端点参数为 view_id（BOARD-003 §4.2 / TASK-011 §4.2）。裁决：前端 URL
      统一 ?view_id=（与 API 同名）；BOARD-003 §3.5 待回改登记。
  R3｜视图图标：TASK-011 §3.2 mockup 出现 📋🚀（不在预设集内，且「我的待办」预置
      图标为 👤）。裁决：八枚预设 ✨📦🐛👤📅🧪🔥🚒 + 内置五视图预置图标
      （✨🐛👤📅🧪，BOARD-003 §3.4/§4.1.2）为准；TASK-011 mockup 图标为示意笔误。
  R4｜「全部」固定首项：TASK-011 §3.2「全部 = 前端固定入口（不入库）」与
      BOARD-003 §3.6「Tabs 首项为前端固定入口（filters={} 非种子）」口径一致，
      登记确认无冲突（同 sprint-2 R5 模式）。
  R5｜批量工具条动作入口与 BOARD-003 看板拖拽并存：BOARD-004 §2.3「与 pdnd 拖拽
      互斥」——多选拖拽期间不触发框选；本迭代批量动作仅工具条入口（无批量拖拽，
      BOARD-004 §7.2-② 原文），登记确认。

原型自定开放点（规格未规定，原型先行定义，评审时可改）
  O1｜presence 消费位：COLLAB-004 §3.1 mockup 未明示头像列挂在全局 topbar 还是
      项目视图工具条。定义：项目 view-bar 右端（presence 是项目房间语义）。
  O2｜筛选面板入口：BOARD-003 §3.1 工具条仅有搜索 + 维度下拉，TASK-011 §3.1 仅
      画面板本体。定义：filterbar「⊞ 筛选」按钮 + 已激活条件 chips 直达。
  O3｜表格布局差异：规格仅规定列配置区在 list/table 显示。定义：表格 = 紧凑行高 +
      斑马纹 + 全列配置生效（原型以同一数据渲染两态）。
  O4｜远端事件演出触发：实际由 WS 事件驱动；原型以 dock 演示按钮模拟（含
      「本地拖拽中远端变更不打断」的对照演出）。
  O5｜动态流侧栏图标：规格写「图标 activity」，lucide 无此名，取 pulse。

<style>
/* ═════════ 设计 token · 与 sprint-0/1/2 冻结基线一致 ═════════ */
:root{
  --brand-50:#eef4ff;--brand-100:#dbe7fe;--brand-500:#3f76ff;--brand-600:#2f5fe0;
  --state-unstarted:#9ca3af;--state-started:#3b82f6;--state-completed:#10b981;--state-cancelled:#6b7280;
  --danger:#ef4444;--ok:#059669;--warn:#f59e0b;--amber-bg:#fffbeb;--amber-line:#fde68a;--amber-ink:#b45309;
  --bg:#fafafa;--surface:#ffffff;--surface-2:#f5f5f5;--surface-3:#ececec;
  --line:#e5e5e5;--line-strong:#d4d4d4;
  --ink:#262626;--ink-2:#525252;--ink-3:#8c8c8c;--ink-4:#a3a3a3;
  --radius-card:.5rem;--radius-md:6px;--radius-lg:8px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);--shadow-md:0 4px 12px rgba(0,0,0,.08);--shadow-lg:0 12px 32px rgba(0,0,0,.14);
  --font-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --header-h:48px;--ease-spring:cubic-bezier(.2,.9,.3,1.1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-ui);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
svg{flex-shrink:0}
:focus-visible{outline:2px solid var(--brand-500);outline-offset:1px;border-radius:4px}
[hidden]{display:none!important}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ═════════ 基础控件（基线沿用） ═════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:var(--radius-md);font-weight:500;font-size:13px;transition:background .12s,border-color .12s,opacity .12s;white-space:nowrap}
.btn-primary{background:var(--brand-500);color:#fff}
.btn-primary:hover{background:var(--brand-600)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:var(--surface);border:1px solid var(--line-strong);color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-ghost:disabled{opacity:.5;cursor:not-allowed}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-danger:disabled{opacity:.45;cursor:not-allowed}
.btn-sm{height:28px;padding:0 10px;font-size:12px}
.icon-btn{width:30px;height:30px;border-radius:var(--radius-md);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-3)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.input{width:100%;height:36px;border:1px solid var(--line-strong);border-radius:var(--radius-md);padding:0 10px;background:var(--surface);transition:border-color .12s,box-shadow .12s}
.input:focus{outline:none;border-color:var(--brand-500);box-shadow:0 0 0 3px var(--brand-50)}
.input.invalid{border-color:var(--danger)}
textarea.input{height:auto;padding:8px 10px;resize:vertical;line-height:1.6}
.label{display:block;font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:6px}
.hint{font-size:12px;color:var(--ink-3)}
.err-text{font-size:12px;color:var(--danger);margin-top:4px}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.badge-id{font-family:var(--font-mono);font-size:11px;padding:1px 6px;background:var(--surface-2);border-radius:4px;color:var(--ink-2);white-space:nowrap}
.avatar{width:28px;height:28px;border-radius:50%;color:#fff;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.avatar-sm{width:20px;height:20px;font-size:10px}
.avatar-md{width:24px;height:24px;font-size:11px}
a{color:var(--brand-600);text-decoration:none}
a:hover{text-decoration:underline}
.link-btn{color:var(--brand-600);font-size:13px}
.link-btn:hover{text-decoration:underline}
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#262626;color:#fff;font-size:12px;font-weight:400;padding:4px 9px;border-radius:6px;white-space:nowrap;z-index:300;pointer-events:none;text-decoration:none}
[data-tip].tip-up:hover::after{bottom:auto;top:calc(100% + 6px)}

/* ═════════ 弹层 / 下拉 / 确认层（基线沿用） ═════════ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.32);backdrop-filter:blur(2px);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s ease}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow-lg);width:480px;max-width:100%;max-height:88vh;overflow:auto;padding:24px;animation:pop .18s var(--ease-spring)}
.modal.w400{width:400px}.modal.w520{width:520px}.modal.w560{width:560px}.modal.w640{width:640px}.modal.w720{width:720px}.modal.w920{width:920px}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-title{font-size:16px;font-weight:600}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.menu{position:absolute;min-width:150px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:4px;z-index:60;animation:pop .12s var(--ease-spring)}
.menu-item{display:flex;width:100%;align-items:center;gap:8px;min-height:32px;padding:4px 12px;border-radius:var(--radius-md);font-size:13px;color:var(--ink-2);text-align:left}
.menu-item:hover{background:var(--surface-2)}
.menu-item.danger{color:#dc2626}
.menu-item.disabled{color:var(--ink-4);cursor:not-allowed}
.menu-item.disabled:hover{background:none}
.menu-sep{height:1px;background:var(--line);margin:4px 0}
.menu-cap{font-size:11px;color:var(--ink-4);padding:6px 12px 3px}
.mrow{display:flex;width:100%;align-items:center;gap:8px;min-height:30px;padding:4px 12px;border-radius:var(--radius-md);font-size:13px;color:var(--ink-2);text-align:left}
.mrow:hover{background:var(--surface-2)}
.mrow .cb{width:15px;height:15px;accent-color:var(--brand-500);flex-shrink:0}
.mrow.active{color:var(--ink);font-weight:500}
.dd{position:relative}
.skel{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:skel 1.2s infinite;border-radius:var(--radius-md)}

/* ═════════ Toast（基线沿用） ═════════ */
.toast-wrap{position:fixed;top:16px;right:16px;z-index:220;display:flex;flex-direction:column;gap:8px;width:360px}
.toast{border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:10px 14px;font-size:13px;display:flex;align-items:flex-start;gap:8px;animation:slide-in .2s var(--ease-spring);color:#fff;position:relative}
.toast .tx{flex:1;min-width:0}
.toast .tclose{color:rgba(255,255,255,.7);width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;flex-shrink:0}
.toast .tclose:hover{color:#fff;background:rgba(255,255,255,.15)}
.toast-info{background:#2563eb}.toast-warning{background:#d97706}.toast-error{background:#b91c1c}.toast-ok{background:#059669}
.toast-action{margin-left:4px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:5px;padding:1px 8px;font-size:12px}
.toast-action:hover{background:rgba(255,255,255,.28)}
.toast-action[disabled]{opacity:.55;cursor:default}
.toast-count{font-variant-numeric:tabular-nums;margin-left:4px}

/* ═════════ 应用壳（基线沿用） ═════════ */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;flex-shrink:0}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.shell{display:flex;flex:1;min-height:0}
.psidebar{width:220px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:2px;padding:12px;flex-shrink:0}
.p-id{display:flex;align-items:center;gap:9px;padding:6px 10px 12px}
.p-id .nm{font-size:14px;font-weight:600}
.side-item{height:34px;padding:0 10px;border-radius:var(--radius-md);display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2);width:100%;text-align:left}
.side-item:hover{background:var(--surface-2)}
.side-item.active{background:var(--brand-50);color:var(--brand-600);font-weight:500}
.side-label{font-size:11px;font-weight:600;color:var(--ink-4);text-transform:uppercase;letter-spacing:.05em;padding:10px 10px 4px}
.pmain{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.view-bar{display:flex;align-items:center;gap:8px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface);flex-shrink:0}
.view-title{font-size:15px;font-weight:600}
.view-count{font-size:13px;color:var(--ink-3)}
.view-bar .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:60px 0;color:var(--ink-3);text-align:center}
.empty svg{color:#d4d4d4}
.empty-title{font-size:15px;font-weight:600;color:var(--ink-2)}
.empty-sub{font-size:13px;color:var(--ink-3)}
.empty .btn{margin-top:8px}

/* ═════════ 筛选工具条（基线沿用 + 高级筛选入口 O2） ═════════ */
.filterbar{display:flex;align-items:center;gap:8px;padding:8px 20px;background:rgba(255,255,255,.95);backdrop-filter:blur(4px);border-bottom:1px solid var(--line);flex-shrink:0;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.fbtn{height:32px;padding:0 10px;border:1px solid var(--line-strong);border-radius:var(--radius-md);font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;background:var(--surface)}
.fbtn:hover{background:var(--surface-2)}
.fbtn.has{border-color:var(--brand-500);color:var(--brand-600);background:var(--brand-50)}
.fbtn.warn-has{border-color:var(--warn);color:var(--amber-ink);background:var(--amber-bg)}
.fbtn .n{font-size:11px;background:var(--brand-500);color:#fff;border-radius:99px;padding:0 6px}
.searchbox{height:32px;border:1px solid var(--line-strong);border-radius:var(--radius-md);display:inline-flex;align-items:center;gap:6px;padding:0 10px;background:var(--surface);color:var(--ink-3);min-width:200px}
.searchbox input{border:none;outline:none;background:transparent;font-size:13px;color:var(--ink);flex:1}
.chiprow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 20px;border-bottom:1px solid var(--line);flex-shrink:0;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:99px;padding:2px 10px;font-size:12px;color:var(--ink-2)}
.chip:hover{background:var(--surface-3)}
.chip .cx{display:inline-flex;width:16px;height:16px;align-items:center;justify-content:center;border-radius:50%;color:var(--ink-3)}
.kchip{display:inline-flex;align-items:center;gap:4px;background:var(--brand-50);color:var(--brand-600);border-radius:99px;padding:2px 10px;font-size:12px}
.kchip .cx{cursor:pointer;border-radius:50%;width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center}
.kchip .cx:hover{background:var(--brand-100)}
.total-cnt{margin-left:auto;color:var(--ink-4);font-size:12px}

/* ═════════ 视图切换器工具条（B003 §3.1 · Sprint-3 升级） ═════════ */
.viewswitch{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--surface);flex-shrink:0;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:2px;gap:2px}
.seg-btn{height:28px;padding:0 10px;border-radius:6px;font-size:12.5px;color:var(--ink-3);display:inline-flex;align-items:center;gap:5px}
.seg-btn:hover{color:var(--ink-2)}
.seg-btn.active{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:var(--shadow-sm)}
.seg-btn.disabled{color:var(--ink-4);cursor:not-allowed}
.vtabs{display:flex;align-items:center;gap:2px;min-width:0;flex-wrap:nowrap;overflow:hidden}
.vtab{height:32px;padding:0 10px;border-radius:6px;font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;border-bottom:2px solid transparent;position:relative}
.vtab:hover{background:var(--surface-2)}
.vtab.active{color:var(--ink);font-weight:600;border-bottom-color:var(--brand-500)}
.vtab .vlock{font-size:11px;color:var(--ink-4)}
.vtab .vstar{font-size:12px;color:var(--warn);margin-left:1px}
.vtab .star-off{color:var(--ink-4);opacity:0}
.vtab:hover .star-off{opacity:.7}
.vtab.cur-label{cursor:default}
.vtabs-more{height:28px;padding:0 8px;border-radius:6px;font-size:12.5px;color:var(--ink-3);display:inline-flex;align-items:center;gap:4px}
.vtabs-more:hover{background:var(--surface-2);color:var(--ink-2)}
.dirty-bar{display:flex;align-items:center;gap:10px;background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber-ink);border-radius:8px;padding:5px 8px 5px 12px;font-size:12.5px;animation:fade .15s ease}
.dirty-bar .btn-sm{height:26px}
.guide-pop{position:relative;background:var(--surface);border:1px solid var(--brand-100);box-shadow:var(--shadow-md);border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--ink-2);display:inline-flex;gap:10px;align-items:center;animation:pop .2s var(--ease-spring)}
.guide-pop::before{content:"";position:absolute;top:-6px;left:24px;width:10px;height:10px;background:inherit;border-left:1px solid var(--brand-100);border-top:1px solid var(--brand-100);transform:rotate(45deg)}

/* ═════════ 分组看板（C.29 基线 + 五维列头/__none__/空列折叠 B003 §3.2） ═════════ */
.board{flex:1;display:flex;gap:16px;overflow-x:auto;overflow-y:hidden;padding:16px 20px;min-height:0;scroll-snap-type:x proximity}
.bcol{width:280px;min-width:280px;display:flex;flex-direction:column;background:var(--surface-2);border-radius:var(--radius-lg);max-height:100%;scroll-snap-align:start}
.bcol-head{height:40px;display:flex;align-items:center;gap:8px;padding:0 12px;flex-shrink:0}
.bcol-head.dashed{border-bottom:none}
.bcol-head.dashed .bcol-name{color:var(--ink-3)}
.bcol-name{font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.bcol-count{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-4);margin-left:auto;background:var(--surface-3);border-radius:99px;padding:0 8px;transition:background .3s}
.bcol-count.bump{background:var(--brand-100);color:var(--brand-600)}
.bcol-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 8px 8px;display:flex;flex-direction:column;gap:8px;min-height:56px}
.bcol-empty{border:1.5px dashed var(--line-strong);border-radius:var(--radius-md);color:var(--ink-4);font-size:12px;text-align:center;padding:18px 8px;margin-top:8px}
.bcol.collapsed{background:transparent;width:fit-content;min-width:0}
.bcol.collapsed .bcol-head{border:1.5px dashed var(--line-strong);border-radius:99px;padding:0 14px;background:var(--surface-2)}
.bcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:9px 12px;box-shadow:var(--shadow-sm);cursor:grab;transition:box-shadow .15s,border-color .15s,opacity .15s,transform .3s var(--ease-spring)}
.bcard::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--bar,var(--state-unstarted))}
.bcard:hover{box-shadow:var(--shadow-md);border-color:var(--line-strong)}
.bcard.dragging{opacity:.4;transform:scale(.98)}
.bcard.bounce-back{animation:bounceback .3s var(--ease-spring)}
.bcard.selected{border-color:var(--brand-500);box-shadow:0 0 0 2px var(--brand-100),var(--shadow-md)}
.bcard.selected::after{content:"";position:absolute;inset:0;border-radius:var(--radius-md);box-shadow:inset 0 0 0 2px var(--brand-500);pointer-events:none}
.cardcb{position:absolute;top:6px;left:6px;width:18px;height:18px;accent-color:var(--brand-500);z-index:2;opacity:0;transition:opacity .12s}
.bcard.selected .cardcb,.bcard:hover .cardcb,.bulk-on .cardcb{opacity:1}
.bcard-title{font-size:13px;color:var(--ink);line-height:1.45;display:flex;gap:5px;align-items:flex-start;padding-left:4px}
.bcard-meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--ink-3);flex-wrap:wrap;padding-left:4px}
.bcard-av{position:absolute;right:8px;bottom:8px}
.bcard.remote-in{animation:fadein .3s ease}
.bcol.dropdeny{outline:2px solid var(--danger);outline-offset:-2px}
.dropghost{border:1.5px dashed var(--brand-500);border-radius:var(--radius-md);opacity:.5}
.addcard-row{border:1.5px dashed var(--line-strong);border-radius:var(--radius-md);color:var(--ink-4);font-size:12.5px;text-align:center;padding:7px 0;margin-top:2px;flex-shrink:0;background:transparent}
.addcard-row:hover{border-color:var(--brand-500);color:var(--brand-600);background:var(--brand-50)}

/* ═════════ 任务列表（基线 itable + 多选列 B004 §3.1） ═════════ */
.twrap{flex:1;overflow-y:auto;padding:14px 20px 90px;display:flex;flex-direction:column;position:relative}
.itable{width:100%;border-collapse:collapse}
.itable th{font-size:11px;font-weight:600;color:var(--ink-4);text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.itable th.sortable{cursor:pointer;user-select:none}
.itable th.sortable:hover{color:var(--ink-2)}
.itable td{font-size:13px;padding:7px 10px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
.itable tbody tr{cursor:pointer}
.itable tbody tr:hover td,.itable tbody tr:focus-visible td{background:var(--bg)}
.itable tbody tr:hover .title-cell{color:var(--brand-600);text-decoration:underline;text-decoration-color:var(--ink-4)}
.cell-key{font-family:var(--font-mono);font-size:12px;color:var(--ink-3);white-space:nowrap;display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.cell-key .tbar{width:3px;height:14px;border-radius:2px;display:inline-block}
.cell-title{color:var(--ink)}
.rowcb{width:15px;height:15px;accent-color:var(--brand-500);cursor:pointer;vertical-align:middle}
th .rowcb{accent-color:var(--ink-3)}
.itable tbody tr.selected td{background:var(--brand-50)}
.itable tbody tr.selected:hover td{background:#dbe7fe}
.cbcell{width:34px;padding-right:0}
.lbl-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:0 7px;border-radius:4px;color:#fff;white-space:nowrap;height:18px}
.lbl-tag.gray{background:var(--surface-3);color:var(--ink-3)}
.pri-cell{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.state-badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.avstack{display:inline-flex;align-items:center}
.avstack .avatar{border:2px solid var(--surface);margin-left:-6px}
.avstack .avatar:first-child{margin-left:0}
.avstack .more-n{width:20px;height:20px;border-radius:50%;background:var(--surface-3);color:var(--ink-3);font-size:10px;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--surface);margin-left:-6px}
.unassign-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-3);background:var(--surface-2);border-radius:99px;padding:1px 9px}
.due-cell{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.due-cell.overdue{color:var(--danger);font-weight:600}
.itable.zebra tbody tr:nth-child(even) td{background:#fbfbfb}
.itable.zebra tbody tr:hover td{background:var(--bg)}
.marquee{position:fixed;border:1.5px dashed var(--brand-500);background:rgba(63,118,255,.08);z-index:50;pointer-events:none;border-radius:2px}

/* ═════════ 批量工具条（B004 §3.1） ═════════ */
.bulk-bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:80;background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;box-shadow:var(--shadow-lg);padding:0 8px 0 16px;height:52px;display:flex;align-items:center;gap:8px;animation:bulk-in .16s var(--ease-spring)}
.bulk-bar.busy{opacity:.75;pointer-events:none}
.bulk-bar.busy .blk-act{animation:pulse 1.1s infinite}
.bulk-count{font-size:13px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.bulk-act{height:32px;padding:0 10px;border-radius:8px;font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.bulk-act:hover{background:var(--surface-2);color:var(--ink)}
.bulk-act.danger{color:var(--danger)}
.bulk-act.danger:hover{background:#fef2f2}
.bulk-act.disabled{color:var(--ink-4);cursor:not-allowed}
.bulk-act.disabled:hover{background:none}
.bulk-sep{width:1px;height:22px;background:var(--line)}
.bulk-x{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-3)}
.bulk-x:hover{background:var(--surface-2);color:var(--ink)}
.bulk-pop{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);z-index:85;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);width:400px;max-width:calc(100vw - 24px);padding:16px;animation:pop .15s var(--ease-spring)}
.mode-row{display:flex;gap:8px;margin-bottom:12px}
.mode-opt{flex:1;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--ink-2);text-align:left;display:flex;flex-direction:column;gap:2px}
.mode-opt .mt{font-weight:600;font-size:13px;display:flex;align-items:center;gap:5px}
.mode-opt:hover{border-color:var(--brand-500)}
.mode-opt.sel{border-color:var(--brand-500);background:var(--brand-50);color:var(--brand-600)}
.mode-opt.sel .mt{color:var(--brand-600)}
.sel-list{border:1px solid var(--line);border-radius:8px;max-height:180px;overflow-y:auto}
.sel-row{display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:13px;cursor:pointer}
.sel-row:hover{background:var(--bg)}
.sel-row .cb{width:15px;height:15px;accent-color:var(--brand-500)}
.sel-row .st{margin-left:auto;font-size:11px;color:var(--ink-4)}
.confirm-count-input{width:90px;height:36px;border:1px solid var(--line-strong);border-radius:var(--radius-md);text-align:center;font-size:15px;font-variant-numeric:tabular-nums}
.confirm-count-input.ok{border-color:var(--ok);color:var(--ok);font-weight:600}
.cascade-stats{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:10px 14px;font-size:13px;color:#b91c1c;margin:10px 0}
.fail-item{border:1px solid #fecaca;border-radius:8px;padding:8px 12px;margin-top:8px;font-size:13px;cursor:pointer}
.fail-item:hover{background:#fef2f2}
.fail-item .fk{font-family:var(--font-mono);font-size:12px;color:var(--ink-3)}
.fail-item .fr{color:var(--danger);font-size:12px;margin-top:2px}
.trunc-strip{position:sticky;top:0;z-index:30;display:flex;gap:8px;align-items:center;background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber-ink);border-radius:8px;padding:6px 12px;font-size:12.5px;margin:0 0 8px}

/* ═════════ 任务详情抽屉（基线沿用） ═════════ */
.drawer-scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:70;animation:fade .15s ease}
.drawer{position:fixed;top:0;right:0;bottom:0;width:720px;max-width:100vw;background:var(--surface);box-shadow:var(--shadow-lg);z-index:71;display:flex;flex-direction:column;animation:slidein .2s var(--ease-spring)}
.drawer.wide{width:min(960px,calc(100vw - 48px))}
.drawer.narrow{width:340px}
.drawer.mid{width:660px}
.drawer-head{display:flex;align-items:flex-start;gap:10px;padding:16px 20px 10px;border-bottom:1px solid var(--line);flex-shrink:0}
.drawer-body{flex:1;overflow-y:auto;padding:4px 20px 20px}
.dkey{font-family:var(--font-mono);font-size:12px;color:var(--ink-3);cursor:pointer;white-space:nowrap}
.dtitle{font-size:17px;font-weight:600;width:100%;border:1px solid transparent;border-radius:6px;padding:2px 6px;margin-left:-6px}
.dtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 20px;flex-shrink:0}
.dtab{height:38px;padding:0 12px;font-size:13px;color:var(--ink-2);border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px}
.dtab.active{color:var(--brand-600);font-weight:500;border-bottom-color:var(--brand-500)}
.dtab .n{font-size:11px;background:var(--surface-2);color:var(--ink-3);border-radius:99px;padding:0 6px}
.prop-row{display:grid;grid-template-columns:80px 1fr;align-items:center;gap:10px;min-height:34px;padding:2px 0}
.prop-label{font-size:13px;color:var(--ink-3)}

/* ═════════ 评论线程化（C002 §3.1） ═════════ */
.cmt-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-2);padding:12px 0 8px}
.cmt-count{font-size:12px;color:var(--ink-3);font-weight:400}
.tcmt{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #f2f2f2}
.tcmt:last-of-type{border-bottom:none}
.tcmt-main{flex:1;min-width:0}
.tcmt-top{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3)}
.tcmt-top .who{font-weight:600;color:var(--ink)}
.tcmt-top .when{font-variant-numeric:tabular-nums}
.tcmt-top .acts{margin-left:auto;display:flex;gap:2px;opacity:0;transition:opacity .12s}
.tcmt:hover .tcmt-top .acts{opacity:1}
.tcmt-body{font-size:13.5px;color:var(--ink);margin-top:4px;line-height:1.65;word-break:break-word}
.tcmt-body .mention{color:var(--brand-600);background:var(--brand-50);border-radius:4px;padding:0 4px;font-weight:500}
.tcmt-body.deleted-placeholder{color:var(--ink-3);background:var(--surface-2);border-radius:8px;padding:8px 12px;font-size:13px}
.replies{margin:10px 0 0 32px;padding-left:14px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:10px}
.reply{display:flex;gap:8px;background:var(--surface-2);border-radius:10px;padding:8px 12px}
.reply .rmain{flex:1;min-width:0}
.reply .rtop{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.reply .rtop .who{font-weight:600;color:var(--ink-2)}
.reply-badge{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;color:var(--brand-600);background:var(--brand-50);border-radius:4px;padding:0 5px}
.reply .rbody{font-size:13px;color:var(--ink);margin-top:2px;line-height:1.6}
.rmeta-line{display:flex;align-items:center;gap:10px;margin-top:4px;font-size:11.5px;color:var(--ink-4)}
.rmeta-line .rbtn{color:var(--ink-3);display:inline-flex;align-items:center;gap:3px}
.rmeta-line .rbtn:hover{color:var(--brand-600)}
.fold-replies{margin:8px 0 0 32px;padding-left:14px;font-size:12.5px;color:var(--brand-600);display:inline-flex;align-items:center;gap:5px}
.fold-replies:hover{text-decoration:underline}
.rxbar{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.rchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-size:12px;color:var(--ink-2);background:var(--surface);transition:opacity .2s,background .12s,border-color .12s}
.rchip:hover{border-color:var(--brand-500)}
.rchip.mine{background:var(--brand-50);border-color:var(--brand-500);color:var(--brand-600);font-weight:600}
.rchip.fade-out{opacity:0}
.rchip .rc-n{font-variant-numeric:tabular-nums;font-size:11px}
.rx-plus{width:26px;height:22px;border-radius:99px;border:1px dashed var(--line-strong);color:var(--ink-3);display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.rx-plus:hover{border-color:var(--brand-500);color:var(--brand-600)}
.emoji-pop{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:10px;z-index:95;width:264px;animation:pop .12s var(--ease-spring)}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.emoji-cell{height:28px;border-radius:6px;font-size:16px;display:flex;align-items:center;justify-content:center}
.emoji-cell:hover{background:var(--surface-2)}
.emoji-cell.off{opacity:.25;pointer-events:none}
.emoji-more{font-size:11.5px;color:var(--brand-600);margin-top:6px;width:100%;text-align:center}
.who-pop{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);padding:10px 12px;z-index:96;font-size:12.5px;min-width:170px;animation:pop .12s var(--ease-spring)}
.who-pop .wrow{display:flex;gap:6px;align-items:center;padding:2px 0;color:var(--ink-2)}
.who-pop .wmore{color:var(--ink-4);font-size:11.5px;margin-top:4px}
.imggrid{display:grid;gap:6px;margin-top:8px}
.imggrid.c2{grid-template-columns:repeat(2,96px)}
.imggrid.c3{grid-template-columns:repeat(3,96px)}
.imgcell{width:96px;height:96px;border-radius:8px;overflow:hidden;position:relative;background:linear-gradient(135deg,#dbe7fe 25%,#ececec 50%,#dbe7fe 75%);cursor:zoom-in;border:1px solid var(--line)}
.imgcell:hover .zoom-hint{opacity:1}
.zoom-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25);color:#fff;opacity:0;transition:opacity .12s;font-size:18px}
.gif-badge{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;border-radius:4px;padding:0 5px}
.imgcell.dead{display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;color:var(--ink-4);font-size:11px;cursor:not-allowed;background:var(--surface-2)}
.uploading-node{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--ink-2);background:var(--surface-2);margin-top:6px}
.upbar{flex:1;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.upbar-fill{height:100%;background:var(--brand-500);border-radius:3px;transition:width .3s}
.composer{border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);margin-top:12px}
.composer:focus-within{border-color:var(--brand-500);box-shadow:0 0 0 3px var(--brand-50)}
.replyctx{display:flex;align-items:center;gap:8px;background:var(--brand-50);border-bottom:1px solid var(--brand-100);border-radius:10px 10px 0 0;padding:6px 12px;font-size:12.5px;color:var(--brand-600)}
.composer-tools{display:flex;align-items:center;gap:2px;padding:4px 8px;border-top:1px solid #f2f2f2}
.ctool{width:28px;height:28px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-3)}
.ctool:hover{background:var(--surface-2);color:var(--ink)}
.composer textarea{width:100%;border:none;outline:none;resize:vertical;min-height:64px;padding:10px 12px 4px;font-size:13.5px;line-height:1.6;background:transparent}
.composer-foot{display:flex;align-items:center;padding:4px 12px 8px;font-size:11.5px;color:var(--ink-4)}
.composer-foot .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.merge-hint{font-size:11.5px;color:var(--ink-4);padding-left:2px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:120;display:flex;align-items:center;justify-content:center;animation:fade .15s ease}
.lightbox-stage{max-width:84vw;max-height:80vh;border-radius:8px;background:linear-gradient(135deg,#dbe7fe 25%,#ececec 50%,#dbe7fe 75%);display:flex;align-items:center;justify-content:center;position:relative}
.lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center}
.lightbox-nav:hover{background:rgba(255,255,255,.25)}
.lightbox-close{position:absolute;top:18px;right:18px;color:#fff;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center}
.lightbox-meta{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.85);font-size:12.5px;background:rgba(0,0,0,.4);border-radius:99px;padding:4px 14px}

.fgroup-del{margin-left:auto;width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-4)}

.frow{display:flex;align-items:center;gap:8px;padding:4px 0;flex-wrap:wrap}
.frow-del{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-4);flex-shrink:0}

.icon-pick{display:inline-flex;gap:6px;flex-wrap:wrap}

.dup-warn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--amber-ink);background:var(--amber-bg);border:1px solid var(--amber-line);border-radius:6px;padding:4px 10px;margin-top:6px}

.streamwrap{flex:1;overflow-y:auto;padding:0 20px 40px;max-width:860px;width:100%;margin:0 auto}

.dock{position:fixed;left:12px;bottom:12px;z-index:200;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow-lg);width:264px;font-size:12px}

.dock-sep{height:1px;background:var(--line);margin:6px -12px}

  .replies{margin-left:16px}
  .bulk-bar{width:calc(100vw - 16px);flex-wrap:wrap;height:auto;padding:8px 12px;row-gap:4px}
}

/* ═════════ 全局弹层管理 ═════════ */
function closeAllPops(){$('#pop-root').innerHTML=''}
function popAt(anchor,html){
  closeAllPops();
  const r=anchor.getBoundingClientRect();
  const el=document.createElement('div');el.innerHTML=html;
  $('#pop-root').appendChild(el.firstChild);
  const p=$('#pop-root').firstChild;
  const pw=p.offsetWidth,ph=p.offsetHeight;
  let x=Math.min(Math.max(8,r.left),innerWidth-pw-8),y=r.bottom+6;
  if(y+ph>innerHeight-8)y=r.top-ph-6;
  p.style.left=x+'px';p.style.top=y+'px';
  return p;
}
function menuAt(anchor,items){
  const p=popAt(anchor,'<div class="menu" role="menu">'+items.map((it,idx)=>
    it.sep?'<div class="menu-sep"></div>':
    '<button class="menu-item '+(it.danger?'danger':'')+(it.disabled?' disabled':'')+'" data-action="'+(it.action||'noop')+'" data-idx="'+idx+'" role="menuitem">'+(it.icon?icon(it.icon,14):'')+' '+esc(it.label)+'</button>').join('')+'</div>');
  p._items=items;return p;
}
/* ═════════ 视图求值（演示级：内置视图 filters + 占位符解析） ═════════ */
function evalCondition(i,c){
  const v=c.value;
  switch(c.field){
    case 'issue_type':{const map={'__requirement__':'story','__bug__':'bug','__test__':'test'};return v.some(x=>i.type===map[x])}
    case 'assignees':return v.some(x=>x==='@me'?i.as.includes(ME):i.as.includes(x));
    case 'state.group':return v.includes(i.state);
    case 'target_date':{if(c.operator==='between'&&v[0]==='this_week')return i.due&&i.due>='2026-08-31'&&i.due<='2026-09-06';return true}
    default:return true;
  }
}
function filteredIssues(){
  const v=viewById(S.viewId);
  let list=liveIssues();
  if(v&&!v.fixed&&v.filters&&v.filters.conditions)list=list.filter(i=>v.filters.conditions.every(c=>evalCondition(i,c)));
  if(S.demo.emptyBoard)list=[];
  return list;
}
function resolvedChip(c){/* 视图条件 chip 文案（占位符「活」解析展示 · T011 BR-05） */
  const f=fieldByKey(c.field);const nm=f?f.name:c.field;
  let val=c.value.map(x=>({'@me':'@'+ME,'__requirement__':'需求','__bug__':'缺陷','__test__':'测试','this_week':'本周','unstarted':'待办','started':'进行中','completed':'已完成','cancelled':'已取消'}[x]||x)).join(' · ');
  return nm+' '+((OP_NAMES[c.operator]||c.operator))+' '+val;
}

/* ═════════ 分组列（配置生成 · 禁 SELECT DISTINCT · 空组恒在 · __none__ 最末） ═════════ */
function boardColumns(){
  const dims={
    state_id:()=>Object.entries(STATES).map(([k,v])=>({key:k,name:v.name,color:v.color,none:false,match:i=>i.state===k})),
    priority:()=>PRI_ORDER.map(k=>({key:k,name:PRIS[k].n,color:PRIS[k].c,none:false,match:i=>i.pri===k})),
    assignee_id:()=>[...MEMBERS.filter(m=>m.role==='CONTRIBUTOR').map(m=>({key:m.name,name:m.name,avatar:m.name,none:false,match:i=>i.as.includes(m.name)})),{key:'__none__',name:'未指派',none:true,match:i=>i.as.length===0}],
    label_id:()=>[...Object.entries(LABELS).map(([k,v])=>({key:k,name:v.n,color:v.c,none:false,match:i=>i.labels.includes(k)})),{key:'__none__',name:'无标签',none:true,match:i=>i.labels.length===0}],
    cf_severity:()=>[...CF_FIELDS.cf_severity.options.map(o=>({key:o.v,name:o.v,color:o.c,none:false,match:i=>(i.cf||{}).cf_severity===o.v})),{key:'__none__',name:'未填值',none:true,cfnone:true,match:i=>!(i.cf||{}).cf_severity}]
  };
  return dims[S.groupBy]().map(c=>({...c,issues:filteredIssues().filter(c.match)}));
}

function cardHtml(i){
  const st=STATES[i.state];const sel=S.selection.includes(i.id);

  if(cf.labels&&i.labels&&i.labels.length)meta.push('<span style="display:inline-flex;gap:3px">'+i.labels.slice(0,2).map(l=>'<span class="lbl-tag" style="background:'+LABELS[l].c+'">'+esc(LABELS[l].n)+'</span>').join('')+'</span>');
  if(cf.sub_issues&&i.sub)meta.push('<span class="mono" style="display:inline-flex;align-items:center;gap:4px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9" stroke-dasharray="40 17"/></svg>'+i.sub[0]+'/'+i.sub[1]+'</span>');
  if(cf.attachments&&i.att)meta.push(icon('paperclip',12)+' '+i.att);
  if(cf.estimate&&i.est)meta.push(icon('timer',12)+' '+(i.est/60)+'h');
  if(cf.target_date&&i.due){const od=i.due<todayISO()&&(i.state==='unstarted'||i.state==='started');meta.push('<span style="color:'+(od?'var(--danger)':'var(--ink-3)')+';font-weight:'+(od?'600':'400')+'">'+icon('calendar',12)+' '+i.due.slice(5)+'</span>')}
  if(cf.cf_severity&&(i.cf||{}).cf_severity){const o=CF_FIELDS.cf_severity.options.find(o=>o.v===i.cf.cf_severity);if(o)meta.push('<span style="display:inline-flex;align-items:center;gap:4px"><span class="cfbar" style="background:'+o.c+';width:8px;height:8px;border-radius:2px"></span>'+o.v+'</span>')}
  return '<div class="bcard'+(sel?' selected':'')+'" draggable="'+(canEdit()?'true':'false')+'" data-sel-id="'+i.id+'" data-open="'+i.id+'" style="--bar:'+st.color+'" role="option" aria-selected="'+sel+'" aria-label="'+esc(i.name)+'，'+st.name+'">'+
    (canEdit()?'<input type="checkbox" class="cardcb" data-cb="'+i.id+'" '+(sel?'checked':'')+' aria-label="选择 '+esc(i.name)+'">':'')+
    (i.blocked?'<span class="bcard-blocked-badge" title="被阻塞（前置任务未完成）">⛔</span>':'')+
    '<div class="bcard-title"><span class="badge-id">'+typeById(i.type).abbr+'-'+i.seq+'</span><span>'+esc(i.name)+'</span></div>'+
    (meta.length?'<div class="bcard-meta">'+meta.map(m=>'<span style="display:inline-flex;align-items:center;gap:3px">'+m+'</span>').join('')+'</div>':'')+
    (i.as.length?'<span class="bcard-av avstack">'+i.as.slice(0,3).map(a=>avatarEl(a,'avatar avatar-sm')).join('')+(i.as.length>3?'<span class="more-n">+'+(i.as.length-3)+'</span>':'')+'</span>':'<span class="bcard-av unassign-ghost">'+icon('user',14)+'</span>')+
  '</div>';
}

document.addEventListener('dragstart',e=>{
  const card=e.target.closest('.bcard');if(!card)return;
  S.dragging={id:card.dataset.selId};card.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
});
document.addEventListener('dragend',e=>{
  const card=e.target.closest('.bcard');if(card)card.classList.remove('dragging');
  $$('.bcol').forEach(c=>c.classList.remove('dropdeny'));
  S.dragging=null;
});
document.addEventListener('dragover',e=>{
  const body=e.target.closest('.bcol-body');if(!body||!S.dragging)return;
  e.preventDefault();e.dataTransfer.dropEffect='move';
});
document.addEventListener('drop',e=>{
  const body=e.target.closest('.bcol-body');if(!body||!S.dragging)return;
  e.preventDefault();handleDrop(body.dataset.drop);
});
function denyDrop(col,reason){toast('🚫 不能拖入「'+col.name+'」列 —— '+reason,'warning',{ms:3000});const colEl=$('[data-col="'+col.key+'"]');if(colEl){colEl.classList.add('dropdeny');setTimeout(()=>colEl.classList.remove('dropdeny'),600)}}
function handleDrop(colKey){
  const it=issueById(S.dragging&&S.dragging.id);if(!it)return;
  if(!canEdit()){toast('当前角色无编辑权限','warning');return}
  const col=boardColumns().find(c=>c.key===colKey);if(!col)return;
  const dim=S.groupBy;
  if(dim==='state_id'){
    if(colKey==='completed'&&it.blocked){bounceBack(it.id);toast('⛔ 流转被拦截：前置任务未完成（TASK-005 守卫 · 409）','warning',{ms:3200});return}
    it.state=colKey;pushActivityLocal(it,'状态',STATES[colKey].name);afterDataChange(it);
  }else if(dim==='priority'){
    it.pri=colKey;pushActivityLocal(it,'优先级',PRIS[colKey].n);afterDataChange(it);
  }else if(dim==='assignee_id'){
    if(colKey==='__none__'){denyDrop(col,'未指派列可拖出不可拖入（BR-14）');bounceBack(it.id);return}
    if(it.as.length>1){openReplaceConfirm('执行人',it.as,[colKey],()=>{it.as=[colKey];afterDataChange(it)});}
    else{it.as=[colKey];afterDataChange(it)}
  }else if(dim==='label_id'){
    if(colKey==='__none__'){denyDrop(col,'无标签列可拖出不可拖入（BR-14）');bounceBack(it.id);return}
    if((it.labels||[]).length>1){openReplaceConfirm('标签',it.labels,[colKey],()=>{it.labels=[colKey];afterDataChange(it)});}
    else{it.labels=[colKey];afterDataChange(it)}
  }else if(dim==='cf_severity'){
    if(colKey==='__none__'){delete it.cf.cf_severity;toast('已清空「严重等级」（拖入未填值 = 删键）','ok')}
    else{it.cf=it.cf||{};it.cf.cf_severity=colKey}
    afterDataChange(it);
  }
}
function bounceBack(id){const c=$('[data-sel-id="'+id+'"].bcard');if(c){c.classList.add('bounce-back');setTimeout(()=>c.classList.remove('bounce-back'),350)}}
function afterDataChange(it){
  S.dirty=false;/* 数据写 ≠ 视图修改：黄条只在筛选/分组/显示变更时出现 */
  render();
  speak('已更新 '+it.name);
  logRemoteEvent(it);
}

function toggleSel(id,idx,ev){
  if(!canEdit()){toast('当前角色无多选权限','warning');return}
  const list=filteredIssues();
  if(ev&&ev.shiftKey&&S.lastClickIdx!=null){
    const [a,b]=[S.lastClickIdx,idx].sort((x,y)=>x-y);
    const range=list.slice(a,b+1).map(i=>i.id);
    S.selection=[...new Set([...S.selection,...range])];
  }else{
    S.selection=S.selection.includes(id)?S.selection.filter(x=>x!==id):[...S.selection,id];
    S.lastClickIdx=idx;
  }
  S.selection=S.selection.slice(0,100);
  render();
}
ACT['sel-all']=()=>{

/* 框选：空白处按下拖出虚线矩形，触及即选（与卡片拖拽互斥：起点不在卡片上） */
function bindMarquee(){
  let mq=null,start=null,base=null;
  document.addEventListener('pointerdown',e=>{
    const zone=e.target.closest('.board,.twrap');if(!zone||e.button!==0)return;
    if(e.target.closest('[data-sel-id],button,input,a,thead,th'))return;
    if(!canEdit())return;
    start={x:e.clientX,y:e.clientY};base=e.shiftKey?[...S.selection]:[];
    mq=document.createElement('div');mq.className='marquee';mq.style.display='none';document.body.appendChild(mq);
  });
  document.addEventListener('pointermove',e=>{
    if(!start)return;
    const x=Math.min(start.x,e.clientX),y=Math.min(start.y,e.clientY),w=Math.abs(e.clientX-start.x),h=Math.abs(e.clientY-start.y);
    if(w*h<36){return}
    mq.style.display='block';Object.assign(mq.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});
    const r={l:x,t:y,r:x+w,b:y+h};
    $$('.marquee-temp').forEach(el=>{el.classList.remove('marquee-temp','selected');el.setAttribute('aria-selected','false')});
    $$('[data-sel-id]').forEach(el=>{
      const b=el.getBoundingClientRect();
      if(b.right>r.l&&b.left<r.r&&b.bottom>r.t&&b.top<r.b){el.classList.add('marquee-temp','selected');el.setAttribute('aria-selected','true')}
    });
  });
  document.addEventListener('pointerup',()=>{
    if(!start)return;
    const ids=$$('.marquee-temp').map(el=>el.dataset.selId);
    mq&&mq.remove();mq=null;start=null;
    if(ids.length){S.selection=[...new Set([...base,...ids])].slice(0,100);render();speak('框选 '+ids.length+' 项')}
    else{$$('.marquee-temp').forEach(el=>el.classList.remove('marquee-temp','selected'))}
  });
}
document.addEventListener('keydown',e=>{

    if($('.lightbox')){closeLightbox();return}
    if($('#modal-root').innerHTML){closeModal();return}

    if(S.selection.length){ACT['clear-sel']();return}

    if(['list','table','board'].includes(S.route)){e.preventDefault();ACT['sel-all']()}
  }
});

function bulkPopover(kind){

  const isA=kind==='assign';
  const opts=isA?MEMBERS.filter(m=>m.role==='CONTRIBUTOR').map(m=>({v:m.name,sub:m.online?'● 在线':'离线'})):Object.entries(LABELS).map(([k,v])=>({v:v.n,color:v.c}));

    '<div class="mode-row" role="radiogroup" aria-label="集合模式">'+
      [['replace','替换为','全量替换（PUT）'],['add','添加到','并集'],['remove','从中移除','差集']].map((m,i)=>
      '<button class="mode-opt '+(i===0?'sel':'')+'" data-mode="'+m[0]+'" role="radio" aria-checked="'+(i===0)+'"><span class="mt">'+(i===0?'◉':'○')+esc(m[1])+'</span><span style="font-size:11.5px;color:var(--ink-3)">'+m[2]+'</span></button>').join('')+'</div>'+
    '<div class="searchbox" style="min-width:0">'+icon('search',13)+'<input placeholder="搜索'+(isA?'成员':'标签')+'…"></div>'+
    '<div class="sel-list" style="margin-top:6px">'+opts.map(o=>'<label class="sel-row"><input type="checkbox" class="cb" data-v="'+esc(o.v)+'">'+(o.color?'<span class="dot" style="background:'+o.color+'"></span>':'')+avatarEl(isA?o.v:'','avatar avatar-sm')+' '+esc(o.v)+'<span class="st">'+(o.sub||'')+'</span></label>').join('')+'</div>'+
    '<div class="chiprow" style="padding:8px 0 4px;border-bottom:none" id="bulk-picked"><span class="hint">未选择</span></div>'+
    '<div style="margin-top:8px"><span class="label">备注（可选，将随动态记录 · ≤500 字）</span><textarea class="input" id="bulk-note" placeholder="'+(isA?'联调阶段统一对接人…':'本轮修复统一打标…')+'"></textarea></div>'+
    '<div class="modal-foot" style="margin-top:14px"><button class="btn btn-ghost" data-action="bulk-pop-close">取消</button><button class="btn btn-primary" data-action="bulk-pop-apply">应用到 '+sel.length+' 项</button></div>';
  $('#pop-root').appendChild(pop);
  pop._picked=new Set();pop._mode='replace';pop._kind=kind;
  pop.querySelectorAll('.mode-opt').forEach(b=>b.onclick=()=>{pop.querySelectorAll('.mode-opt').forEach(x=>{x.classList.remove('sel');x.querySelector('.mt').textContent=x.querySelector('.mt').textContent.replace('◉','○')});b.classList.add('sel');b.querySelector('.mt').textContent=b.querySelector('.mt').textContent.replace('○','◉');pop._mode=b.dataset.mode});
  pop.querySelectorAll('input[data-v]').forEach(cb=>cb.onchange=()=>{
    cb.checked?pop._picked.add(cb.dataset.v):pop._picked.delete(cb.dataset.v);
    $('#bulk-picked').innerHTML=pop._picked.size?[...pop._picked].map(v=>'<span class="kchip">'+esc(v)+'<span class="cx" data-v="'+esc(v)+'" role="button">✕</span></span>').join(''):'<span class="hint">未选择</span>';

  });
}

ACT['bulk-pop-apply']=()=>{
  const pop=$('.bulk-pop');if(!pop)return;
  const picked=[...pop._picked];if(!picked.length){toast('请先选择至少 1 个'+(pop._kind==='assign'?'成员':'标签'),'warning');return}
  const note=$('#bulk-note')?$('#bulk-note').value.trim():'';
  const sel=selectedIssues();const mode=pop._mode;
  closeBulkPop();
  bulkBusy(()=>{
    sel.forEach(i=>{
      if(pop._kind==='assign'){
        if(mode==='replace')i.as=[...picked];
        else if(mode==='add')i.as=[...new Set([...i.as,...picked])];
        else i.as=i.as.filter(a=>!picked.includes(a));
      }else{
        i.labels=i.labels||[];
        if(mode==='replace')i.labels=[...picked];
        else if(mode==='add')i.labels=[...new Set([...i.labels,...picked])];
        else i.labels=i.labels.filter(a=>!picked.includes(a));
      }
    });
    const modeN={replace:'替换为',add:'添加',remove:'移除'}[mode];
    pushBatchRow(ME,'批量更新了 '+sel.length+' 个任务',sel.length,(pop._kind==='assign'?'执行人':'标签')+' '+modeN+' '+picked.join('、')+(note?'（备注：'+note+'）':''));

    rs.filter(r=>r.n>0).map(r=>'<button class="rchip'+(r.me?' mine':'')+'" data-action="toggle-rx" data-own="'+owner.id+'" data-e="'+r.e+'" aria-pressed="'+(r.me?'true':'false')+'" aria-label="'+r.e+'，'+r.n+' 人'+(r.me?'，含你':'')+'">'+r.e+' <span class="rc-n">'+r.n+'</span></button>').join('')+

function findComment(cid){
  for(const c of COMMENTS){
    if(c.id===cid)return c;
    for(const r of (c.replies||[]))if(r.id===cid)return r;
  }
  return null;
}
function toggleReaction(cid,e){
  const c=findComment(cid);if(!c||!canComment())return;
  c.reactions=c.reactions||[];
  let r=c.reactions.find(x=>x.e===e);
  if(!r){r={e,n:0,me:false,users:[]};c.reactions.push(r)}
  if(r.me){r.me=false;r.n=Math.max(0,r.n-1);r.users=r.users.filter(u=>u!==ME)}
  else{r.me=true;r.n++;r.users.push(ME)}
  refreshDrawer();
}

/* ═════════ 筛选面板（T011 §3.1 · 布尔树 · 配额 · 命中数 · 视图段） ═════════ */
let FT=null,__nid=1;
const nid=()=>'n'+(__nid++);
function countConds(t){if(!t)return 0;return t.conditions.reduce((s,c)=>s+(c.op?countConds(c):1),0)}
function treeDepth(t){if(!t)return 0;return 1+Math.max(0,...t.conditions.filter(c=>c.op).map(treeDepth),0)}
function cloneTree(t){return JSON.parse(JSON.stringify(t))}
function loadMockTree(){/* T011 §3.1 mockup 示例树（3 层 7 条件） */
  return {id:nid(),op:'AND',conditions:[
    {id:nid(),field:'state.group',operator:'in',value:['unstarted','started']},
    {id:nid(),op:'OR',conditions:[
      {id:nid(),field:'cf_severity',operator:'in',value:['致命','严重']},
      {id:nid(),field:'cf_versions',operator:'contains_any',value:['v2.2.1']},
      {id:nid(),op:'AND',conditions:[
        {id:nid(),field:'cf_regression',operator:'eq',value:['是']},
        {id:nid(),field:'cf_review_date',operator:'between',value:['2026-09-01','2026-09-30']}]}]},
    {id:nid(),field:'assignees',operator:'in',value:['@me']},
    {id:nid(),field:'cf_rca',operator:'is_empty',value:[]}]};
}
function findGroup(t,id){if(t.id===id)return t;for(const c of t.conditions){if(c.op){const r=findGroup(c,id);if(r)return r}}return null}
function removeNode(t,id){t.conditions=t.conditions.filter(c=>c.id!==id);for(const c of t.conditions)if(c.op)removeNode(c,id)}
function opLabel(op){return '满足 '+(op==='AND'?'全部':'任一')+'（'+op+'）'}
function condValueHtml(c){
  const f=fieldByKey(c.field);if(!f)return '';
  if(c.operator==='is_empty'||c.operator==='is_not_empty')return '<span class="hint">（无需值）</span>';
  const chips=c.value.map(v=>'<span class="chip">'+esc({'@me':'@'+ME,'today':'今天','this_week':'本周'}[v]||v)+'<span class="cx" data-action="fval-x" data-id="'+c.id+'" data-v="'+esc(v)+'">'+icon('x',10)+'</span></span>').join('');
  if(['select','multi_select','member','member_multi','state'].includes(f.type)){
    return '<span class="fval">'+chips+'<button class="fctl" data-action="fval-open" data-id="'+c.id+'">+ 值 ▾</button></span>';
  }
  if(f.type==='date'){
    if(c.operator==='between')return '<span class="fval"><input type="date" class="datechip" value="'+(c.value[0]||'')+'" data-action="fdate" data-id="'+c.id+'" data-i="0"> — <input type="date" class="datechip" value="'+(c.value[1]||'')+'" data-action="fdate" data-id="'+c.id+'" data-i="1"></span>';
    return '<span class="fval"><input type="date" class="datechip" value="'+(c.value[0]||'')+'" data-action="fdate" data-id="'+c.id+'" data-i="0"></span>';
  }
  if(f.type==='checkbox')return '<span class="fval"><button class="quickchip'+(c.value[0]==='是'?' sel':'')+'" data-action="fbool" data-id="'+c.id+'" data-v="是">是</button><button class="quickchip'+(c.value[0]==='否'?' sel':'')+'" data-action="fbool" data-id="'+c.id+'" data-v="否">否</button></span>';
  return '<span class="fval"><input class="input" style="height:32px;width:170px" value="'+esc(c.value[0]||'')+'" data-action="ftext" data-id="'+c.id+'"></span>';
}
function groupHtml(g,depth){
  const canAddG=treeDepth(FT)<3&&countConds(FT)<20;
  const canAddC=countConds(FT)<20;
  return '<div class="fgroup" role="group" aria-label="条件组：'+opLabel(g.op)+'，共 '+g.conditions.length+' 项">'+
    '<div class="fgroup-head"><button class="fgroup-op" data-action="fop" data-id="'+g.id+'">'+opLabel(g.op)+' ▾</button>'+
      '<button class="fgroup-add'+(canAddC?'':' disabled')+'" data-action="fadd-cond" data-id="'+g.id+'">+ 条件</button>'+
      '<button class="fgroup-add'+(canAddG?'':' disabled')+'" data-action="fadd-group" data-id="'+g.id+'" '+(canAddG?'':'data-tip="层级已达 3 层上限"')+'>+ 组</button>'+
      (depth>1?'<button class="fgroup-del" data-action="fdel" data-id="'+g.id+'" aria-label="删除组">'+icon('x',13)+'</button>':'')+'</div>'+
    g.conditions.map(c=>c.op?groupHtml(c,depth+1):
      '<div class="frow" data-cond="'+c.id+'">'+
        '<button class="fctl field" data-action="ffield" data-id="'+c.id+'"><span class="fdot" style="background:'+(fieldByKey(c.field)||{}).c+'"></span>'+esc((fieldByKey(c.field)||{}).name||c.field)+((fieldByKey(c.field)||{}).cf?' <span class="hint">自定义</span>':'')+'</button>'+
        '<button class="fctl" data-action="foper" data-id="'+c.id+'"><span class="op">'+esc(OP_NAMES[c.operator]||c.operator)+'</span> ▾</button>'+
        condValueHtml(c)+
        '<button class="frow-del" data-action="fdel" data-id="'+c.id+'" aria-label="删除条件">'+icon('x',13)+'</button>'+
      '</div>').join('')+
  '</div>';
}
function renderFilterPanel(){
  const v=viewById(S.viewId);
  const hit=FT?Math.max(1,47-countConds(FT)*3-treeDepth(FT)*2):filteredIssues().length;
  $('#drawer-root').innerHTML='<div class="drawer-scrim" data-scrim></div><div class="drawer mid" role="dialog" aria-label="筛选面板" style="width:640px">'+
    '<div class="fpanel-head"><span class="fpanel-title">'+icon('filterIco',16)+' 筛选</span><div class="fpanel-tools">'+
      '<button class="link-btn" data-action="frecent">最近 ▾</button><button class="link-btn" data-action="fclear-all">清空全部</button><button class="btn btn-primary btn-sm" data-action="save-as">保存视图</button></div></div>'+
    (v&&!v.fixed?'<div class="viewseg">视图：'+(v.icon||'')+' '+esc(v.name)+'（'+(v.system?'内置 · 只读':'个人')+'）<span class="ro-chips">'+((v.filters.conditions)||[]).map(c=>'<span class="kchip">'+esc(resolvedChip(c))+'</span>').join('')+'</span><span style="margin-left:auto;display:flex;gap:6px"><button class="btn btn-ghost btn-sm" data-action="fmerge-save">另存</button><button class="btn btn-ghost btn-sm" data-action="fdetach">脱离</button></span></div>':'')+
    '<div class="quickchips" aria-label="快捷条件">'+[['@我','assignees','in',['@me']],['未指派','assignees','is_empty',[]],['今天到期','target_date','eq',['today']],['已逾期','target_date','overdue',[]],['本周','target_date','between',['this_week']]].map(q=>'<button class="quickchip" data-action="fquick" data-f="'+q[1]+'" data-o="'+q[2]+'" data-v="'+esc(q[3].join('|'))+'">'+q[0]+'</button>').join('')+'</div>'+
    '<div class="fpanel-body">'+groupHtml(FT,1)+'</div>'+
    '<div class="fpanel-foot"><span class="hitcount" aria-live="polite">ⓘ 命中 <span class="n" id="ft-hit">'+hit+'</span> 个任务</span>'+
      '<span class="fquota'+(countConds(FT)>=20?' red':'')+'">条件 '+countConds(FT)+'/20 · 层级 '+treeDepth(FT)+'/3</span>'+
      '<span style="margin-left:auto;display:flex;gap:8px"><button class="btn btn-ghost" data-action="drawer-close">取消</button><button class="btn btn-primary" data-action="fapply">应用</button></span></div>'+
  '</div>';
}
function openFilterPanel(withMock){
  FT=withMock?loadMockTree():(S.filterTree?cloneTree(S.filterTree):{id:nid(),op:'AND',conditions:[]});
  renderFilterPanel();
}
ACT['filter-open']=()=>openFilterPanel(false);
ACT['fop']=el=>{S._fopTarget=el.dataset.id;menuAt(el,[{label:'满足 全部（AND）',action:'fop-set',arg:'AND'},{label:'满足 任一（OR）',action:'fop-set',arg:'OR'}])};

ACT['fadd-cond']=el=>{const g=findGroup(FT,el.dataset.id);if(!g||countConds(FT)>=20)return;g.conditions.push({id:nid(),field:'state.group',operator:'in',value:['unstarted']});renderFilterPanel()};
ACT['fadd-group']=el=>{const g=findGroup(FT,el.dataset.id);if(!g||treeDepth(FT)>=3){toast('层级已达 3 层上限（400 · api-conventions §5.3）','warning');return}g.conditions.push({id:nid(),op:'OR',conditions:[]});renderFilterPanel()};
ACT['fdel']=el=>{if(el.dataset.id===FT.id)return;removeNode(FT,el.dataset.id);renderFilterPanel()};
ACT['ffield']=el=>{
  const cid=el.dataset.id;
  menuAt(el,FIELD_CATALOG.map(f=>({label:f.name+(f.cf?'（自定义）':''),action:'ffield-set',arg:f.key})));
  ACT['ffield-set']=e=>{const key=e.closest('.menu')._items[+e.dataset.idx].arg;const f=fieldByKey(key);
    const cond=(function find(t){for(const c of t.conditions){if(c.id===cid)return c;if(c.op){const r=find(c);if(r)return r}}})(FT);
    if(cond){cond.field=key;cond.operator=(OPS_BY_TYPE[f.type]||['eq'])[0];cond.value=[]}
    closeAllPops();renderFilterPanel()};
};
function findCond(cid){return function find(t){for(const c of t.conditions){if(c.id===cid)return c;if(c.op){const r=find(c);if(r)return r}}return null}(FT)}
ACT['foper']=el=>{
  const cond=findCond(el.dataset.id);
  if(!cond)return;
  const f=fieldByKey(cond.field)||{type:'text'};
  menuAt(el,(OPS_BY_TYPE[f.type]||[]).map(o=>({label:OP_NAMES[o]||o,action:'foper-set',arg:o})));
  ACT['foper-set']=e=>{cond.operator=e.closest('.menu')._items[+e.dataset.idx].arg;cond.value=[];closeAllPops();renderFilterPanel()};
};
ACT['fval-open']=el=>{
  const cid=el.dataset.id;
  const cond=function find(t){for(const c of t.conditions){if(c.id===cid)return c;if(c.op){const r=find(c);if(r)return r}}return null}(FT);
  if(!cond)return;
  const f=fieldByKey(cond.field)||{};
  const opts=f.type==='member'?['@me',...MEMBERS.filter(m=>m.role==='CONTRIBUTOR').map(m=>m.name)]:
    f.key==='issue_type'?['__requirement__','__bug__','__test__']:
    f.key==='state'||f.key==='state.group'?Object.keys(STATES):
    f.key==='priority'?PRI_ORDER:
    (CF_FIELDS[f.key]||{}).options?CF_FIELDS[f.key].options.map(o=>o.v):Object.keys(LABELS);
  menuAt(el,opts.map(o=>({label:{'@me':'@'+ME,'__requirement__':'需求','__bug__':'缺陷','__test__':'测试',unstarted:'待办',started:'进行中',completed:'已完成',cancelled:'已取消'}[o]||o,action:'fval-set',arg:o})));
  ACT['fval-set']=e=>{
    const val=e.closest('.menu')._items[+e.dataset.idx].arg;
    if(cond.value.includes(val))cond.value=cond.value.filter(x=>x!==val);else cond.value.push(val);

};
ACT['fval-x']=el=>{const cond=findCond(el.dataset.id);if(cond){cond.value=cond.value.filter(v=>v!==el.dataset.v);renderFilterPanel()}};
ACT['fbool']=el=>{const cond=findCond(el.dataset.id);if(cond){cond.value=[el.dataset.v];renderFilterPanel()}};

ACT['fquick']=el=>{
  if(countConds(FT)>=20){toast('条件数已达 20 上限','warning');return}
  FT.conditions.push({id:nid(),field:el.dataset.f,operator:el.dataset.o,value:el.dataset.v?el.dataset.v.split('|'):[]});
  renderFilterPanel();
};
ACT['fclear-all']=()=>{FT={id:nid(),op:'AND',conditions:[]};renderFilterPanel()};
ACT['fdetach']=()=>{S.viewId='__all__';toast('已脱离视图，条件转为纯临时层','info');closeDrawer();render()};
ACT['fmerge-save']=()=>closeDrawer()||openModal(saveViewModalHtml());
ACT['frecent']=el=>menuAt(el,(S.recentFilters.length?S.recentFilters:[{s:'状态 ∈ 待办 · 负责人 = @我'},{s:'严重等级 ∈ 致命（本周新增）'}]).map((r,i)=>({label:r.s||r,action:'fload-recent',arg:i})));

ACT['fapply']=()=>{
  if(countConds(FT)===0){S.filterTree=null}
  else{
    S.filterTree=cloneTree(FT);
    S.recentFilters=[{s:'自定义树 · '+countConds(FT)+' 条件（'+treeDepth(FT)+' 层）'},...S.recentFilters].slice(0,5);
  }
  closeDrawer();render();
  toast(S.filterTree?'已应用 · 临时 filters 入 URL（?filters=…）· 命中数以 meta.total_count 为准':'已清空临时条件','ok');
};

/* ═════════ 保存 / 另存为弹层（B003 §3.4） ═════════ */
function saveViewModalHtml(){
  const cur=viewById(S.viewId);
  const defName=cur.fixed?'未命名视图':cur.name+' (副本)';
  return '<div class="modal w440"><div class="modal-head"><div class="modal-title">保存视图</div><button class="icon-btn" data-action="modal-close">✕</button></div>'+
    '<div><span class="label">名称（≤128 · 项目内重名允许，靠 id 区分）</span><input class="input" id="sv-name" value="'+esc(defName)+'" maxlength="128">'+
    '<div id="sv-warn"></div></div>'+
    '<div style="margin-top:14px"><span class="label">图标（8 枚预设）</span><div class="icon-pick" id="sv-icons">'+ICON_POOL.map((e,i)=>'<button class="icon-opt'+(i===6?' sel':'')+'" data-e="'+e+'" aria-label="'+e+'">'+e+'</button>').join('')+'</div></div>'+
    '<div style="margin-top:14px"><span class="label">布局</span><div class="seg" id="sv-layout">'+['list','kanban','table','gantt'].map((l,i)=>'<button class="seg-btn'+(S.layout===l?' active':'')+(l==='gantt'?' disabled':'')+'" data-l="'+l+'">'+({list:'列表',kanban:'看板',table:'表格',gantt:'甘特'}[l])+'</button>').join('')+'</div></div>'+
    '<div class="notice-strip">'+icon('sparkles',14)+' 将保存当前筛选、分组与显示配置（P2 仅个人视图 · 共享归 P3 BOARD-005）</div>'+
    '<div class="modal-foot"><button class="btn btn-ghost" data-action="modal-close">取消</button><button class="btn btn-primary" data-action="sv-ok">创建视图</button></div></div>';
}
ACT['sv-ok']=()=>{
  const name=($('#sv-name').value||'未命名视图').trim();
  const icon=$('#sv-icons .sel')?.dataset.e||'✨';
  const layout=$('#sv-layout .active')?.dataset.l||S.layout;
  const nv={id:'v'+Date.now(),name,icon,personal:true,layout,filters:S.filterTree?cloneTree(S.filterTree):(viewById(S.viewId).filters||{}),display:{group_by:S.groupBy}};
  if(VIEWS.some(v=>v.name===name))toast('已存在同名视图——允许创建（靠 id 区分 · BR-09）','warning',{ms:2600});
  VIEWS.push(nv);S.viewId=nv.id;S.dirty=false;closeModal();render();
  toast('视图「'+name+'」已创建并选中（URL ?view_id=… 可分享直达）','ok');
};
document.addEventListener('click',e=>{
  const ic=e.target.closest('.icon-opt');if(ic){ic.parentElement.querySelectorAll('.icon-opt').forEach(x=>x.classList.remove('sel'));ic.classList.add('sel')}
  const sg=e.target.closest('#sv-layout .seg-btn:not(.disabled)');if(sg){sg.parentElement.querySelectorAll('.seg-btn').forEach(x=>x.classList.remove('active'));sg.classList.add('active')}
});

/* ═════════ presence / 连接详情（C004 §3.1） ═════════ */
ACT['presence']=el=>{
  const online=MEMBERS.filter(m=>m.online);
  popAt(el,'<div class="member-card"><div class="mc-head">'+avatarEl('李四','avatar')+'<div><div class="mc-name">李四</div><div class="hint">在线 · 正在看板</div></div></div>'+
    '<div class="mc-view">'+icon('eye',13)+' 正在看板（presence.joined · 25s 心跳内）</div>'+
    '<div class="mc-view" style="color:var(--ink-4)">王五 · 离线（5 分钟缓存位）</div>'+
    '<div class="hint" style="margin-top:6px">项目房间 '+online.length+' 人在线</div></div>');
};
ACT['conn']=el=>{
  const rows=[['状态',{on:'已连接',warn:'重连中',off:'已降级轮询'}[S.conn]],['房间','project:rbt-01'],['延迟','46 ms'],['重连',S.conn==='on'?'0 次':S.reconn+' 次']];
  popAt(el,'<div class="conn-pop">'+rows.map(r=>'<div class="cp-row"><span>'+r[0]+'</span><b>'+esc(r[1])+'</b></div>').join('')+
    '<div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-ghost btn-sm" data-action="reconn-now">重连</button><button class="btn btn-ghost btn-sm" data-action="conn-cycle">切换状态（演示）</button></div></div>');
};
ACT['conn-cycle']=()=>{setConn(S.conn==='on'?'warn':S.conn==='warn'?'off':'on')};
function setConn(s){S.conn=s;S.reconn=s==='warn'?(S.reconn||0)+1:1;if(s==='off')S.bannerDismissed=false;render();toast({on:'实时已连接（WS live · 房间 project:rbt-01）',warn:'正在重连（指数退避 1s→2s→…30s 封顶）',off:'实时同步暂停 · 已降级为 30s 轮询（功能零损失）'}[s],s==='off'?'warning':'info')}

/* ═════════ 远端事件演出（C004 §3.2/§3.3 · O4 dock 模拟） ═════════ */
function simulateRemoteMove(){
  const i=issueById('i129');if(!i)return;
  if(S.dragging){/* 本地拖拽保护：仅更新数据不重排 DOM */
    i.state=i.state==='completed'?'started':'completed';
    toast('本地拖拽中：远端 board.moved 仅更新数据，不打断 DOM（松手后合并）','info',{ms:3200});return;
  }
  const to=i.state==='completed'?'started':'completed';
  i.state=to;render();
  const card=$('[data-sel-id="i129"]');
  if(card){card.classList.add('remote-in')}
  const cnt=$('[data-count="'+to+'"]');
  if(cnt){cnt.classList.add('bump');setTimeout(()=>cnt.classList.remove('bump'),600)}
  speak('李四 将 RBT-129 移至 '+STATES[to].name);
  toast('issue.state.changed（李四）· 远端卡片 300ms 淡入 · 自己的操作不回显（BR-08）','info',{ms:3000});
}
function simulateNotif(){
  S.notif++;S.notifBounce=true;render();
  setTimeout(()=>{S.notifBounce=false;render()},600);
  toast('notification.created · 铃铛徽标 +1（user 房间）','info');
}
function simulateNewActivity(){
  if(S.route!=='activity'){toast('请先进入「动态」页再演示（dock 场景直达）','warning');return}
  const today=STREAM[0];
  today.rows.unshift({t:'14:5'+Math.floor(Math.random()*9),kind:'activity',actor:'李四',text:'<b>RBT-129</b> 状态 <s>进行中</s> → <b>已完成</b>',chip:'RBT-129'});
  render();
  const slot=$('#newdyn-slot');
  if(slot){slot.innerHTML='<button class="newdyn-bar" data-action="newdyn-refresh" aria-live="polite">↑ 1 条新动态</button>';
    setTimeout(()=>{if(slot.firstChild)slot.innerHTML=''},4000);}
}
ACT['newdyn-refresh']=()=>{$('#newdyn-slot').innerHTML='';render();toast('已拉取增量（stream_cursor 水位 · 幂等补偿）','ok')};

/* ═════════ DOCK 演示面板 ═════════ */
let dockOpen=true;
function renderDock(){
  let d=$('#dock');if(d)d.remove();
  if(!dockOpen){document.body.insertAdjacentHTML('beforeend','<button id="dock" class="btn btn-ghost btn-sm" style="position:fixed;left:12px;bottom:12px;z-index:200">🧪 Sprint-3 演示面板</button>');$('#dock').onclick=()=>{dockOpen=true;renderDock()};return}
  const item=(act,label,on)=>'<button class="dock-item'+(on?' on':'')+'" data-action="'+act+'">'+label+'</button>';
  document.body.insertAdjacentHTML('beforeend','<div class="dock" id="dock"><div class="dock-head" data-action="dock-toggle">🧪 Sprint-3 演示面板 <span style="margin-left:auto">▾</span></div><div class="dock-body">'+
    '<div class="dock-cap">场景直达</div>'+
    item('d-board','看板 · 优先级分组（拖卡跨列）',S.route==='board'&&S.groupBy==='priority')+
    item('d-board-assignee','看板 · 按负责人（__none__ 拦截）',S.route==='board'&&S.groupBy==='assignee_id')+
    item('nav" data-h="#/p/rbt/list','列表 · 多选/框选/⌘A')+
    item('nav" data-h="#/p/rbt/table','表格布局（列配置）')+
    item('nav" data-h="#/p/rbt/activity','动态流页')+
    item('d-drawer','RBT-132 详情 · 评论线程')+
    item('d-filter','筛选面板（3 层 7 条件示例树）')+
    item('d-disp','显示配置 Drawer')+
    '<div class="dock-sep"></div><div class="dock-cap">实时演出（COLLAB-004）</div>'+
    '<div style="display:flex;gap:4px">'+item('demo-conn-on','● 已连',S.conn==='on')+item('demo-conn-warn','● 重连中',S.conn==='warn')+item('demo-conn-off','● 降级',S.conn==='off')+'</div>'+
    item('demo-remote','李四拖卡 → 远端同步（<1s）')+
    item('demo-notif','铃铛 +1（notification.created）')+
    item('demo-activity','动态流新动态划入 / 浮条')+
    '<div class="dock-sep"></div><div class="dock-cap">状态演出</div>'+
    item('demo-guide','首次进入引导气泡',S.demo.guide)+
    item('demo-empty','看板空结果态',S.demo.emptyBoard)+
    item('demo-degraded','分组字段停用 → 降级黄条',S.demo.degraded)+
    item('demo-trunc','⌘A 全选截断黄条（>100）')+
    item('demo-upload','评论图片上传中节点',S.demo.uploading)+
    '<div class="dock-sep"></div><div class="dock-cap">角色视角（批量权限 B004 BE-14）</div>'+
    Object.entries(PROJ_ROLES).map(([k,v])=>item('set-role" data-role="'+k,(k==='CONTRIBUTOR'?'👤 ':k==='COMMENTER'?'💬 ':'👁 ')+v+'（'+(k==='CONTRIBUTOR'?ME:k==='COMMENTER'?'赵六':'孙七')+'）',S.role===k)).join('')+
    '<div class="dock-sep"></div>'+item('demo-reset','↺ 重置原型（刷新）')+
  '</div></div>');
}
ACT['dock-toggle']=()=>{dockOpen=false;renderDock()};
ACT['d-board']=()=>{S.groupBy='priority';if(S.route!=='board'){nav('#/p/rbt/board')}else render()};
ACT['d-board-assignee']=()=>{S.groupBy='assignee_id';if(S.route!=='board'){nav('#/p/rbt/board')}else render()};
ACT['d-drawer']=()=>{closeDrawer();openDrawer('i132')};
ACT['d-filter']=()=>{closeDrawer();openFilterPanel(true)};
ACT['d-disp']=()=>{closeDrawer();renderDispDrawer()};
ACT['demo-conn-on']=()=>setConn('on');
ACT['demo-conn-warn']=()=>setConn('warn');
ACT['demo-conn-off']=()=>setConn('off');
ACT['demo-remote']=()=>simulateRemoteMove();
ACT['demo-notif']=()=>simulateNotif();
ACT['demo-activity']=()=>simulateNewActivity();
ACT['demo-guide']=()=>{S.demo.guide=!S.demo.guide;nav('#/p/rbt/board');render()};
ACT['demo-empty']=()=>{S.demo.emptyBoard=!S.demo.emptyBoard;nav('#/p/rbt/board');render()};
ACT['demo-degraded']=()=>{S.demo.degraded=!S.demo.degraded;if(S.demo.degraded){S.groupBy='state_id';toast('字段「严重等级」已停用 → 视图读取回退 state_id + meta.degraded（BR-05/BR-08）','warning',{ms:3600})}nav('#/p/rbt/board');render()};
ACT['demo-trunc']=()=>{nav('#/p/rbt/list');setTimeout(()=>{S.trunc=true;S.demo.bigCount=true;S.selection=filteredIssues().slice(0,100).map(i=>i.id);render();speak('已选前 100 项，共 1240 项')},120)};
ACT['demo-upload']=()=>{S.demo.uploading=!S.demo.uploading;closeDrawer();openDrawer('i132')};
ACT['set-role']=el=>{
  S.role=el.dataset.role;S.selection=[];
  toast('已切换视角：'+PROJ_ROLES[S.role]+(S.role==='VIEWER'?'（issue.bulk.* 403 · 拖拽禁用）':S.role==='COMMENTER'?'（可评论/点表情 · 无编辑）':'（全权限）'),'info');
  render();
};
ACT['demo-reset']=()=>location.reload();
ACT['dd-assignee']=el=>menuAt(el,MEMBERS.map(m=>({label:m.name,action:'noop'})).concat([{label:'未指派',action:'noop'}]));
ACT['dd-priority']=el=>menuAt(el,PRI_ORDER.map(k=>({label:PRIS[k].n,action:'noop'})));
ACT['dd-label']=el=>menuAt(el,Object.values(LABELS).map(l=>({label:l.n,action:'noop'})));

/* ═════════ 初始化 ═════════ */
parseHash();
S.defaultView='v_fire';
bindCheckboxes();bindMarquee();
render();
console.log('%cRabbitProjects Sprint-3 原型','font-weight:bold','DRAFT 待评审 · dock 演示面板可直达全部表面');
</script>
