name: ci
on:
  pull_request:
  push: { branches: [main] }
jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version-file: ".nvmrc" }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:affected
      - run: pnpm check:yjs
