<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>RabbitProjects Sprint 0 原型</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* ═════════ 设计 token · INFRA-001 §4.9 锁定值 ═════════ */
:root{
  --brand-50:#eef4ff;--brand-100:#dbe7fe;--brand-500:#3f76ff;--brand-600:#2f5fe0;
  --state-unstarted:#9ca3af;--state-started:#3b82f6;--state-completed:#10b981;--state-cancelled:#6b7280;
  --danger:#ef4444;--ok:#059669;
  --bg:#fafafa;--surface:#ffffff;--surface-2:#f5f5f5;--surface-3:#ececec;
  --line:#e5e5e5;--line-strong:#d4d4d4;
  --ink:#262626;--ink-2:#525252;--ink-3:#8c8c8c;--ink-4:#a3a3a3;
  --radius-card:.5rem;--radius-md:6px;--radius-lg:8px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);--shadow-md:0 4px 12px rgba(0,0,0,.08);--shadow-lg:0 12px 32px rgba(0,0,0,.14);
  --font-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --header-h:48px;--ease-spring:cubic-bezier(.2,.9,.3,1.1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-ui);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font:inherit;color:inherit}
svg{flex-shrink:0}
:focus-visible{outline:2px solid var(--brand-500);outline-offset:1px;border-radius:4px}
[hidden]{display:none!important}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ═════════ 基础控件 ═════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:var(--radius-md);font-weight:500;font-size:13px;transition:background .12s,border-color .12s,opacity .12s;white-space:nowrap}
.btn-primary{background:var(--brand-500);color:#fff}
.btn-primary:hover{background:var(--brand-600)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:var(--surface);border:1px solid var(--line-strong);color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-ghost:disabled{opacity:.5;cursor:not-allowed}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-danger:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:30px;height:30px;border-radius:var(--radius-md);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-3)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.input{width:100%;height:36px;border:1px solid var(--line-strong);border-radius:var(--radius-md);padding:0 10px;background:var(--surface);transition:border-color .12s,box-shadow .12s}
.input:focus{outline:none;border-color:var(--brand-500);box-shadow:0 0 0 3px var(--brand-50)}
.input.invalid{border-color:var(--danger)}
textarea.input{height:auto;padding:8px 10px;resize:vertical;line-height:1.6}
.label{display:block;font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:6px}
.hint{font-size:12px;color:var(--ink-3)}
.err-text{font-size:12px;color:var(--danger);margin-top:4px}
.alert{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 12px;border-radius:var(--radius-md);margin-bottom:14px}
.alert-error{background:var(--danger);color:#fff}
.alert-soft{background:#fef2f2;color:#b91c1c}
.alert-info{background:var(--brand-50);color:var(--brand-600)}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.badge-id{font-family:var(--font-mono);font-size:11px;padding:1px 6px;background:var(--surface-2);border-radius:4px;color:var(--ink-2);white-space:nowrap}
.avatar{width:28px;height:28px;border-radius:50%;color:#fff;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.avatar-sm{width:20px;height:20px;font-size:10px}
.avatar-md{width:24px;height:24px;font-size:11px}
a{color:var(--brand-600);text-decoration:none}
a:hover{text-decoration:underline}

/* ═════════ 弹层 / 下拉 / toast ═════════ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.32);backdrop-filter:blur(2px);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s ease}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow-lg);width:480px;max-width:100%;max-height:88vh;overflow:auto;padding:24px;animation:pop .18s var(--ease-spring)}
.modal.w520{width:520px}.modal.w640{width:640px}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-title{font-size:16px;font-weight:600}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.menu{position:absolute;min-width:150px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:4px;z-index:60;animation:pop .12s var(--ease-spring)}
.menu-item{display:flex;width:100%;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:var(--radius-md);font-size:13px;color:var(--ink-2);text-align:left}
.menu-item:hover{background:var(--surface-2)}
.menu-item.danger{color:#dc2626}
.menu-sep{height:1px;background:var(--line);margin:4px 0}
.dd{position:relative}
.toast-wrap{position:fixed;top:16px;right:16px;z-index:120;display:flex;flex-direction:column;gap:8px;width:320px}
.toast{background:#262626;color:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:10px 14px;font-size:13px;display:flex;align-items:center;gap:8px;animation:slide-in .2s var(--ease-spring)}

/* ═════════ 认证页（AUTH-001 §3.1）═════════ */
.auth-wrap{min-height:100vh;background:var(--bg);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 40px}
.auth-card{width:420px;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-sm);padding:32px 36px 26px}
.auth-logo{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:18px}
.logo-mark{width:44px;height:44px;border-radius:12px;background:var(--brand-500);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:var(--shadow-sm)}
.auth-title{font-size:24px;font-weight:600;text-align:center;text-wrap:balance}
.auth-sub{font-size:13px;color:var(--ink-3);text-align:center;margin-top:6px}
.auth-top-link{display:flex;justify-content:center;gap:6px;font-size:13px;color:var(--ink-3);margin-bottom:14px}
.field{margin-bottom:16px}
.pw-wrap{position:relative}
.pw-wrap .input{padding-right:38px}
.pw-eye{position:absolute;right:2px;top:3px;width:32px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--ink-3);border-radius:var(--radius-md)}
.pw-eye:hover{color:var(--ink)}
.strength-bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.strength-fill{height:100%;width:0;border-radius:3px;transition:width .2s,background .2s}
.strength-row{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:6px}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:12px;color:var(--ink-3);margin-top:10px}
.rules .ok{color:var(--ok)}
.check-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer}
.check-row input{accent-color:var(--brand-500);width:15px;height:15px}
.auth-foot{border-top:1px solid var(--line);margin-top:22px;padding-top:16px;font-size:13px;color:var(--ink-3);text-align:center}
.link-disabled{color:var(--ink-4);cursor:not-allowed}
/* ═════════ 应用壳：顶栏 + 侧栏（TEAM-001 §3.2/3.4）═════════ */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;flex-shrink:0}
.switcher{height:36px;display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:var(--radius-md);position:relative}
.switcher:hover{background:var(--surface-2)}
.sw-logo{width:20px;height:20px;border-radius:6px;color:#fff;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.sw-name{font-size:13px;font-weight:500;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw-chev{color:var(--ink-3)}
.switcher-menu{top:42px;left:0;width:260px;padding:6px}
.sw-item{height:40px;padding:0 10px;display:flex;align-items:center;gap:8px;border-radius:var(--radius-md);width:100%;text-align:left}
.sw-item:hover{background:var(--surface-2)}
.sw-item.current{background:var(--brand-50)}
.sw-item .nm{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw-item .rl{font-size:12px;color:var(--ink-4)}
.sw-item .ck{color:var(--brand-500);width:16px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.kbd-chip{height:28px;padding:0 8px;border:1px solid var(--line);border-radius:var(--radius-md);font-size:12px;color:var(--ink-3);background:var(--surface);display:inline-flex;align-items:center;gap:4px}
.shell{display:flex;flex:1;min-height:0}
.sidebar{width:240px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:2px;padding:12px;flex-shrink:0}
.side-label{font-size:11px;font-weight:600;color:var(--ink-4);text-transform:uppercase;letter-spacing:.05em;padding:10px 10px 4px}
.side-item{height:34px;padding:0 10px;border-radius:var(--radius-md);display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2);width:100%;text-align:left}
.side-item:hover{background:var(--surface-2)}
.side-item.active{background:var(--brand-50);color:var(--brand-600);font-weight:500}
.side-item.disabled{color:var(--ink-4);cursor:not-allowed}
.side-item.disabled:hover{background:none}
.side-bottom{margin-top:auto}
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}

/* ═════════ 项目列表（PROJ-001 §3.1）═════════ */
.page{flex:1;overflow-y:auto;padding:22px 26px}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.page-title{font-size:18px;font-weight:600}
.page-sub{font-size:13px;color:var(--ink-3)}
.page-head .btn{margin-left:auto}
.banner{display:flex;align-items:center;gap:10px;background:var(--brand-50);border:1px solid var(--brand-100);color:var(--brand-600);border-radius:var(--radius-lg);padding:9px 14px;font-size:13px;margin-bottom:16px}
.banner button{margin-left:auto;color:var(--brand-600)}
.proj-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(265px,1fr))}
.proj-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:16px;cursor:pointer;transition:border-color .15s,box-shadow .15s;display:block}
.proj-card:hover{border-color:var(--brand-100);box-shadow:var(--shadow-md)}
.proj-card-top{display:flex;gap:10px;align-items:flex-start}
.proj-logo{width:24px;height:24px;border-radius:6px;color:#fff;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}
.proj-name{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-badges{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12px;color:var(--ink-2)}
.proj-desc{font-size:13px;color:var(--ink-3);margin-top:9px;min-height:20px}
.proj-foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.proj-count{font-size:12px;color:var(--ink-4)}
.proj-more{position:absolute;top:10px;right:10px;opacity:0;transition:opacity .15s}
.proj-card:hover .proj-more{opacity:1}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:60px 0;color:var(--ink-3);text-align:center}
.empty svg{color:#d4d4d4}
.empty-title{font-size:15px;font-weight:600;color:var(--ink-2)}
.empty-sub{font-size:13px;color:var(--ink-3)}
.empty .btn{margin-top:8px}
.count-wrap{display:flex;justify-content:flex-end;font-size:12px;color:var(--ink-4);margin-top:4px}

/* ═════════ 项目壳 + 视图条（PROJ-001 §3.3）═════════ */
.pshell{flex:1;display:flex;min-height:0}
.psidebar{width:220px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:2px;padding:12px;flex-shrink:0}
.p-id{display:flex;align-items:center;gap:9px;padding:6px 10px 12px}
.p-id .nm{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.view-bar{display:flex;align-items:center;gap:8px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface);flex-shrink:0}
.view-title{font-size:15px;font-weight:600}
.view-bar .btn{margin-left:auto}
.pmain{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}

/* ═════════ 任务列表（TASK-001 §3.1）═════════ */
.twrap{flex:1;overflow-y:auto;padding:16px 20px 20px}
.quick-row{display:flex;align-items:center;gap:8px;border:1px dashed var(--line-strong);border-radius:var(--radius-md);height:38px;padding:0 12px;color:var(--ink-3);margin-bottom:14px;transition:border-color .12s,background .12s}
.quick-row:focus-within{border:1px solid var(--brand-500);background:var(--surface);color:var(--ink)}
.quick-row input{flex:1;border:none;background:transparent;outline:none;font-size:13px;color:var(--ink)}
.itable{width:100%;border-collapse:collapse}
.itable th{font-size:11px;font-weight:600;color:var(--ink-4);text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
.itable td{font-size:13px;padding:10px 12px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
.itable tbody tr{cursor:pointer}
.itable tbody tr:hover td{background:var(--bg)}
.itable tbody tr:hover .title-cell{color:var(--brand-600);text-decoration:underline;text-decoration-color:var(--ink-4)}
.cell-key{font-family:var(--font-mono);font-size:12px;color:var(--ink-3);white-space:nowrap}
.cell-title{color:var(--ink)}
.cell-dim{color:var(--ink-4)}
.state-badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.overdue{color:var(--danger);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.row-more{opacity:0;transition:opacity .15s}
tr:hover .row-more{opacity:1}

/* ═════════ 三列看板（BOARD-001 §3.1/3.2）═════════ */
.board{flex:1;display:flex;gap:16px;overflow-x:auto;overflow-y:hidden;padding:16px 20px;min-height:0}
.board-guide{position:absolute;left:20px;right:20px;top:62px;display:flex;align-items:center;gap:10px;background:var(--brand-50);border:1px solid var(--brand-100);color:var(--brand-600);border-radius:var(--radius-lg);padding:8px 14px;font-size:13px;z-index:5}
.board-empty-wrap{position:relative;flex:1;display:flex;min-height:0}
.bcol{width:280px;min-width:280px;display:flex;flex-direction:column;background:var(--surface-2);border-radius:var(--radius-lg);transition:box-shadow .12s,background .12s;max-height:100%}
.bcol.drag-over{background:var(--brand-50);box-shadow:inset 0 0 0 2px var(--brand-100)}
.bcol.fail-ring{box-shadow:inset 0 0 0 2px var(--danger)}
.bcol-head{height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;flex-shrink:0}
.bcol-name{font-size:13px;font-weight:500}
.bcol-count{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-4);margin-left:auto}
.bcol-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 8px 8px;display:flex;flex-direction:column;gap:8px;min-height:56px}
.bcol-body::-webkit-scrollbar{width:6px}
.bcol-body::-webkit-scrollbar-thumb{background:#d4d4d4;border-radius:3px}
.bcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:10px 12px 10px 15px;box-shadow:var(--shadow-sm);cursor:grab;transition:box-shadow .15s,border-color .15s,opacity .15s}
.bcard::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--bar,var(--state-unstarted))}
.bcard:hover{box-shadow:var(--shadow-md);border-color:var(--line-strong)}
.bcard.dragging{opacity:.4;transform:scale(.98)}
.bcard-title{font-size:13px;color:var(--ink);line-height:1.45}
.bcard-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:12px}
.bcard-key{font-family:var(--font-mono);font-size:11px;color:var(--ink-4)}
.bcard-meta{display:flex;align-items:center;gap:6px;color:var(--ink-3)}
.drop-hint{border:2px dashed var(--line-strong);border-radius:var(--radius-md);padding:16px 0;text-align:center;font-size:12px;color:var(--ink-4);margin:2px 2px 0;transition:border-color .12s,color .12s}
.bcol.drag-over .drop-hint{border-color:var(--brand-500);color:var(--brand-600)}
.ind{height:2px;width:100%;background:var(--brand-500);border-radius:2px;margin:0 0 2px;pointer-events:none}
.add-card-btn{height:32px;margin-top:6px;display:flex;align-items:center;gap:6px;padding:0 10px;border-radius:var(--radius-md);font-size:13px;color:var(--ink-3);width:100%;flex-shrink:0}
.add-card-btn:hover{background:var(--surface-3);color:var(--ink-2)}
.add-inline{display:flex;flex-direction:column;gap:4px;margin-top:2px}
.add-inline .input{height:34px;font-size:13px}
.add-inline .hint{font-size:11px}

/* ═════════ 任务详情抽屉（TASK-001 §3.3）═════════ */
.drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:80;animation:fade .15s ease}
.drawer{position:fixed;top:0;right:0;bottom:0;width:720px;max-width:calc(100vw - 64px);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);z-index:85;display:flex;flex-direction:column;animation:slide-x .22s var(--ease-spring)}
.drawer-head{display:flex;align-items:center;gap:8px;padding:12px 20px;border-bottom:1px solid var(--line);flex-shrink:0;position:relative}
.drawer-key{font-family:var(--font-mono);font-size:13px;color:var(--ink-3)}
.drawer-key:hover{color:var(--brand-600)}
.drawer-head .right{margin-left:auto;display:flex;align-items:center;gap:2px}
.drawer-body{flex:1;overflow-y:auto;padding:18px 24px;position:relative}
.d-title{font-size:17px;font-weight:600;padding:7px 10px;margin:0 -10px;border-radius:var(--radius-md);cursor:text}
.d-title:hover{background:var(--surface-2)}
.d-title-input{font-size:17px;font-weight:600;width:100%;border:none;border-bottom:2px solid var(--brand-500);outline:none;padding:7px 10px;margin:0 -10px;background:var(--surface)}
.desc-editor{border:1px solid var(--line);border-radius:var(--radius-lg);margin-top:14px;background:var(--surface)}
.de-toolbar{display:flex;gap:2px;padding:5px 8px;border-bottom:1px solid var(--line);background:var(--bg);border-radius:var(--radius-lg) var(--radius-lg) 0 0;font-size:13px;color:var(--ink-3);flex-wrap:wrap}
.de-t{min-width:26px;height:24px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;padding:0 4px}
.de-t:hover{background:var(--surface-2);color:var(--ink)}
.de-content{min-height:110px;padding:10px 12px;font-size:13px;outline:none;line-height:1.7}
.de-content:empty:before{content:attr(data-ph);color:var(--ink-4)}
.props{margin-top:18px;border-top:1px solid var(--line);padding-top:16px;display:grid;grid-template-columns:76px 1fr;gap:16px 14px;align-items:center}
.props label{font-size:13px;color:var(--ink-3)}
.prop-btn{height:32px;border:1px solid var(--line-strong);border-radius:var(--radius-md);padding:0 10px;display:inline-flex;align-items:center;gap:8px;font-size:13px;background:var(--surface);min-width:120px}
.prop-btn:hover{background:var(--surface-2)}
.d-meta{margin-top:20px;border-top:1px solid var(--line);padding-top:12px;font-size:12px;color:var(--ink-4);display:flex;gap:8px;flex-wrap:wrap}
.saved-chip{position:absolute;top:14px;right:70px;display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ok);opacity:0;transition:opacity .25s}
.saved-chip.show{opacity:1}

/* ═════════ 设置 / 加载 / 演示坞 ═════════ */
.settings{max-width:640px}
.set-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px;margin-bottom:16px}
.set-card.danger-zone{border-color:#fca5a5}
.set-title{font-size:15px;font-weight:600;margin-bottom:14px}
.set-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.set-row label{width:84px;font-size:13px;color:var(--ink-3);flex-shrink:0}
.set-row .input{flex:1}
.set-note{font-size:12px;color:var(--ink-3);display:inline-flex;align-items:center;gap:4px}
.loader-full{position:fixed;inset:0;background:var(--bg);z-index:110;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.lf-logo{font-size:32px;opacity:.9}
.spinner{animation:spin 1s linear infinite;color:var(--brand-500)}
.lf-text{font-size:13px;color:var(--ink-3);opacity:0;animation:fadein .2s .8s forwards}
.dock{position:fixed;left:14px;bottom:14px;z-index:100;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.dock-panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);padding:10px;width:224px}
.dock-panel button{display:flex;width:100%;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:var(--radius-md);font-size:12px;color:var(--ink-2);text-align:left}
.dock-panel button:hover{background:var(--surface-2)}
.dock-cap{font-size:11px;color:var(--ink-4);margin-top:8px;padding:0 4px}
.dock-pill{background:#262626;color:#fff;font-size:12px;padding:0 12px;height:32px;border-radius:16px;display:inline-flex;align-items:center;gap:7px;box-shadow:var(--shadow-md)}
.dock-dot{width:6px;height:6px;border-radius:50%;background:var(--state-completed);animation:pulse 2s infinite}

/* ═════════ 动效 ═════════ */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes slide-in{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
@keyframes slide-x{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .lf-text{opacity:1}
}

/* ═════════ 工具 ═════════ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ═════════ 状态与种子数据（仅存本机浏览器）═════════ */

/* ═════════ toast / 弹层 ═════════ */
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>{t.style.transition='opacity .3s';t.style.opacity='0';setTimeout(()=>t.remove(),320)},2600)}
function openModal(html,cls=''){const r=$('#modal-root');r.innerHTML='<div class="overlay" data-overlay><div class="modal '+cls+'" role="dialog" aria-modal="true">'+html+'</div></div>';return r}
function closeModal(){$('#modal-root').innerHTML=''}
let drawerIssue=null,peekPushed=false;
function closeDrawer(keepURL){
  drawerIssue=null;$('#drawer-root').innerHTML='';

/* ═════════ 路由（含 AUTH-002 守卫）═════════ */
function nav(h){if(location.hash===h)render();else location.hash=h}
function parseHash(){const h=(location.hash||'#/login').slice(1);const[q1,q2]=h.split('?');return{seg:q1.split('/').filter(Boolean),params:new URLSearchParams(q2||'')}}
function render(){
  const{seg,params}=parseHash();
  closeAllMenus();
  if(!S.user&&(seg[0]==='ws'||seg[0]==='p')){location.replace('#/login?next='+encodeURIComponent(q1of(seg)));return}
  if(seg[0]==='register')renderRegister();
  else if(seg[0]==='p'){const p=projById(seg[1]);p?renderProject(p,seg[2]||'board'):renderNotFound()}
  else if(seg[0]==='ws')renderWorkspace();
  else renderLogin(params);
  const pk=params.get('peekIssue');
  if(seg[0]==='p'&&pk&&S.issues.some(x=>x.id===pk))openDrawer(pk,true);
  else if(drawerIssue||$('#drawer-root').innerHTML)closeDrawer(true);
  $('#dock').hidden=false;
}
const q1of=seg=>'/'+seg.join('/');
window.addEventListener('hashchange',render);

function closeAllMenus(){document.querySelectorAll('.menu:not([hidden])').forEach(m=>m.hidden=true)}
/* ═════════ 登录（AUTH-001 §3.3 + AUTH-002 §3.2）═════════ */

  '</div></div>';
  if(simDisabled){

/* ═════════ 注册（AUTH-001 §3.2/3.4 + TEAM-001 §2.2）═════════ */
function pwScore(p){const okLen=p.length>=8,okLo=/[a-z]/.test(p),okUp=/[A-Z]/.test(p),okDi=/\d/.test(p);
  const hard=okLen&&okLo&&okUp&&okDi;const strong=p.length>=12&&/[^A-Za-z0-9]/.test(p)&&hard;
  return{okLen,okLo,okUp,okDi,hard,strong,lvl:strong?'强':hard?'中':p?'弱':''}}
function renderRegister(){
  const email0=parseHash().params.get('email')||'';
  $('#app').innerHTML=
  '<div class="auth-wrap"><div class="auth-card">'+

      '<div class="field"><label class="label" for="rg-pw">密码</label><div class="pw-wrap"><input class="input" id="rg-pw" type="password" autocomplete="new-password" placeholder="至少 8 位，需含大小写字母与数字">'+

        '<div class="strength-bar" role="meter" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0" aria-label="密码强度" id="rg-meter"><div class="strength-fill" id="rg-fill"></div></div>'+
        '<div class="strength-row"><span>密码强度</span><span id="rg-lvl"></span></div>'+
        '<div class="rules" id="rg-rules"></div></div>'+
      '<div class="field"><label class="label" for="rg-pw2">确认密码</label><div class="pw-wrap"><input class="input" id="rg-pw2" type="password" autocomplete="new-password" placeholder="再次输入密码">'+
        '<button type="button" class="pw-eye" data-action="toggle-pw" data-target="rg-pw2" aria-label="显示密码">'+icon('eye',16)+'</button></div>'+
        '<div class="err-text" id="rg-pw2-err" hidden>两次输入的密码不一致</div></div>'+
      '<button class="btn btn-primary" style="width:100%" type="submit">创建账号</button>'+
    '</form>'+
    '<div class="auth-foot">已有账号？ <button type="button" data-action="go-login" style="color:var(--brand-600);cursor:pointer">登录</button></div>'+
  '</div></div>';
  const upd=()=>{
    const p=$('#rg-pw').value,s=pwScore(p);
    const f=$('#rg-fill');
    f.style.width=s.lvl==='强'?'100%':s.lvl==='中'?'66%':p?'33%':'0';
    f.style.background=s.lvl==='强'?'var(--state-completed)':s.lvl==='中'?'#f59e0b':'var(--danger)';
    $('#rg-meter').setAttribute('aria-valuenow',s.lvl==='强'?'3':s.lvl==='中'?'2':p?'1':'0');
    $('#rg-lvl').textContent=s.lvl?'强度：'+s.lvl:'';
    $('#rg-rules').innerHTML=
      '<span class="'+(s.okLen?'ok':'')+'">'+(s.okLen?'✓':'○')+' 至少 8 位</span>'+
      '<span class="'+(s.okUp?'ok':'')+'">'+(s.okUp?'✓':'○')+' 含大写字母</span>'+
      '<span class="'+(s.okLo?'ok':'')+'">'+(s.okLo?'✓':'○')+' 含小写字母</span>'+
      '<span class="'+(s.okDi?'ok':'')+'">'+(s.okDi?'✓':'○')+' 含数字</span>';
  };
  upd();
  $('#rg-pw').addEventListener('input',upd);
  $('#rg-email').addEventListener('input',()=>{$('#rg-email-err').hidden=true;$('#rg-email').classList.remove('invalid')});
  $('#rg-pw2').addEventListener('input',()=>{if($('#rg-pw2').value===$('#rg-pw').value)$('#rg-pw2-err').hidden=true});
  $('#rg-pw2').addEventListener('blur',()=>{$('#rg-pw2-err').hidden=!($('#rg-pw2').value&&$('#rg-pw2').value!==$('#rg-pw').value)});
  $('#reg-form').addEventListener('submit',e=>{
    e.preventDefault();
    const email=$('#rg-email').value.trim(),pw=$('#rg-pw').value,pw2=$('#rg-pw2').value,s=pwScore(pw);
    const emailOk=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    if(!emailOk){$('#rg-email-err').textContent='请输入有效的邮箱地址';$('#rg-email-err').hidden=false;$('#rg-email').classList.add('invalid');return}
    if(email===DEMO.email){$('#rg-email-err').innerHTML='该邮箱已注册，<a href="#/login?email='+encodeURIComponent(email)+'">直接登录</a> →';$('#rg-email-err').hidden=false;$('#rg-email').classList.add('invalid');return}
    $('#rg-email-err').hidden=true;$('#rg-email').classList.remove('invalid');
    if(!emailOk||!s.hard){if(!s.hard)$('#reg-alert').innerHTML='<div class="alert alert-soft">'+icon('alert',14)+'密码不满足规则：至少 8 位，需含大小写字母与数字</div>';return}
    if(pw!==pw2){$('#rg-pw2-err').hidden=false;return}
    const name=email.split('@')[0];
    let slug=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'me';
    let base=slug,n=2;while(S.workspaces.some(w=>w.slug===slug))slug=base+'-'+(n++);
    S.workspaces.push({id:'w'+Date.now(),name:name+' 的工作空间',slug,role:'所有者',owner:'me'});
    S.user={name,email,owner:'me'};S.currentWs=slug;S.welcomeShown=false;save();
    showLoader(()=>nav('#/ws/projects'));
  });
}

function createIssue(pid,{name,state,assignee=null,due=null,desc=''}){

}
let dragId=null,guideDismissed=false,simFail=false,simDisabled=false;
function wireBoard(p){
  document.querySelectorAll('.bcard').forEach(c=>{
    c.addEventListener('dragstart',e=>{dragId=c.dataset.card;e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move';requestAnimationFrame(()=>c.classList.add('dragging'))});
    c.addEventListener('dragend',()=>{c.classList.remove('dragging');dragId=null;document.querySelectorAll('.bcol').forEach(col=>{col.classList.remove('drag-over','fail-ring');const ind=col.querySelector('.ind');if(ind)ind.hidden=true})});
    c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDrawer(c.dataset.id)}});
  });
  document.querySelectorAll('.bcol').forEach(col=>{
    const body=col.querySelector('.bcol-body'),ind=col.querySelector('.ind');
    col.addEventListener('dragover',e=>{
      if(!dragId)return;e.preventDefault();e.dataTransfer.dropEffect='move';
      col.classList.add('drag-over');
      const cards=[...body.querySelectorAll('.bcard:not(.dragging)')];
      const ref=cards.find(c=>e.clientY<c.getBoundingClientRect().top+c.getBoundingClientRect().height/2);
      body.insertBefore(ind,ref||null);ind.hidden=false;
    });
    col.addEventListener('dragleave',e=>{if(!col.contains(e.relatedTarget)){col.classList.remove('drag-over');ind.hidden=true}});
    col.addEventListener('drop',e=>{
      e.preventDefault();if(!dragId)return;
      const st=col.dataset.col;
      if(simFail){col.classList.add('fail-ring');setTimeout(()=>col.classList.remove('fail-ring'),400);toast('移动失败，已回滚到原位置');dragId=null;return}
      const idx=[...body.children].filter(el=>el.classList.contains('bcard')||el===ind).indexOf(ind);
      moveIssue(dragId,st,Math.max(0,idx));dragId=null;
    });
  });
}
function moveIssue(id,state,idx){
  const i=S.issues.find(x=>x.id===id);if(!i)return;
  const col=S.issues.filter(x=>x.p===i.p&&x.state===state&&x.id!==id).sort((a,b)=>a.sort-b.sort);
  let sort;
  if(idx>=col.length)sort=col.length?Math.max(...col.map(x=>x.sort))+65535:65535;
  else if(idx<=0)sort=col.length?Math.min(...col.map(x=>x.sort))/2:65535;
  else sort=(col[idx-1].sort+col[idx].sort)/2;
  i.state=state;i.sort=sort;touch(i);save();
  toast('已移动 '+issueKey(i)+' 到 '+STATES[state].name);
  render();
}
function wireColAdd(btn){
  const col=btn.closest('.bcol'),body=col.querySelector('.bcol-body'),st=btn.dataset.state;
  btn.outerHTML='<div class="add-inline"><input class="input" id="ci-input" placeholder="输入任务标题…"><div class="hint">回车创建 · Esc 取消</div></div>';
  const inp=$('#ci-input');inp.focus();
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){const v=inp.value.trim();if(!v||inp.disabled)return;inp.disabled=true;
      const tmp=document.createElement('div');tmp.className='bcard dragging';tmp.style.cssText='--bar:'+STATES[st].color;tmp.innerHTML='<div class="bcard-title">…</div>';
      if(body.querySelector('.drop-hint'))body.querySelector('.drop-hint').remove();
      body.appendChild(tmp);
      setTimeout(()=>{createIssue(projById(parseHash().seg[1]).id,{name:v,state:st});render()},260);
    }
    if(e.key==='Escape')render();
  });
  inp.addEventListener('blur',()=>{if(!inp.value.trim())setTimeout(()=>{if(document.activeElement!==inp)render()},120)});
}

    '<input class="input" id="tk-name" style="height:40px;font-size:17px;font-weight:500;border:none;padding-left:0;background:transparent;box-shadow:none" placeholder="任务标题" autofocus>'+
    '<div class="desc-editor"><div class="de-toolbar">'+['B','I','U','≡','☰','⌗','</>','🔗'].map(t=>'<span class="de-t" style="'+(t==='B'?'font-weight:700':t==='I'?'font-style:italic':t==='U'?'text-decoration:underline':'')+'">'+t+'</span>').join('')+'</div>'+
    '<div class="de-content" id="tk-desc" contenteditable="true" data-ph="添加描述…"></div></div>'+
    '<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">'+
      '<div class="dd"><button type="button" class="prop-btn" data-menu-btn="tm-state">'+stateBadge('unstarted')+icon('chev',12)+'</button>'+
      '<div class="menu" id="tm-state" hidden>'+Object.entries(STATES).map(([k,v])=>'<button type="button" class="menu-item" data-taskstate="'+k+'"><span class="dot" style="background:'+v.color+'"></span>'+v.name+'</button>').join('')+'</div></div>'+
      '<div class="dd"><button type="button" class="prop-btn" data-menu-btn="tm-assignee">'+avatarEl(me,'avatar avatar-sm')+'<span id="tm-aname">'+esc(me)+'</span>'+icon('chev',12)+'</button>'+
      '<div class="menu" id="tm-assignee" hidden><button type="button" class="menu-item" data-taskassign="'+esc(me)+'">指派给我（'+esc(me)+'）</button><button type="button" class="menu-item" data-taskassign="">未分配</button></div></div>'+
      '<input type="date" class="input" id="tk-due" style="width:160px" aria-label="截止时间">'+
    '</div>'+
    '<label class="check-row" style="margin-top:16px"><input type="checkbox" id="tk-more">创建后继续创建下一个</label>'+
    '<div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="modal-close">取消</button><button class="btn btn-primary" type="submit">创建任务 <span style="opacity:.7;font-size:11px">⌘↵</span></button></div></form>','w640');
  let st='unstarted',as=me;
  document.querySelectorAll('[data-taskstate]').forEach(b=>b.addEventListener('click',()=>{st=b.dataset.taskstate;closeAllMenus();$('[data-menu-btn="tm-state"]').innerHTML=stateBadge(st)+icon('chev',12)}));
  document.querySelectorAll('[data-taskassign]').forEach(b=>b.addEventListener('click',()=>{as=b.dataset.taskassign;closeAllMenus();$('[data-menu-btn="tm-assignee"]').innerHTML=(as?avatarEl(as,'avatar avatar-sm')+esc(as):'<span class="cell-dim">未分配</span>')+icon('chev',12)}));
  const form=$('#task-form');
  form.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter')form.requestSubmit()});
  form.addEventListener('submit',e=>{
    e.preventDefault();
    const name=$('#tk-name').value.trim();
    if(!name){$('#tk-name').style.borderBottom='2px solid var(--danger)';$('#tk-name').focus();return}
    const i=createIssue(p.id,{name,state:st,assignee:as||null,due:$('#tk-due').value||null,desc:$('#tk-desc').innerHTML});
    toast('已创建 '+issueKey(i));
    if($('#tk-more').checked){$('#tk-name').value='';const d=$('#tk-desc');d.innerHTML='';$('#tk-name').focus()}
    else{closeModal();render()}
  });
}

/* ═════════ 任务详情抽屉（TASK-001 §3.3）═════════ */
function openDrawer(id,fromURL){
  const i=S.issues.find(x=>x.id===id);if(!i)return;
  drawerIssue=i;
  if(!fromURL){
    const base=q1of(parseHash().seg);
    if(location.hash.includes('peekIssue='))location.replace('#'+base+'?peekIssue='+id);
    else{peekPushed=true;location.hash='#'+base+'?peekIssue='+id}
  }
  $('#drawer-root').innerHTML='<div class="drawer-mask" data-action="drawer-close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="任务详情">'+
    '<div class="drawer-head"><button class="drawer-key mono" data-action="copy-key" data-key="'+esc(issueKey(i))+'" title="点击复制编号">'+esc(issueKey(i))+'</button>'+
      '<div class="right"><div class="dd"><button class="icon-btn" data-menu-btn="dw-menu" aria-label="更多操作">'+icon('more',16)+'</button>'+
      '<div class="menu" id="dw-menu" hidden style="top:34px;right:0">'+
        '<button class="menu-item" data-action="copy-link">复制链接</button>'+
        '<button class="menu-item" data-action="copy-key" data-key="'+esc(issueKey(i))+'">复制编号</button>'+
        '<button class="menu-item danger" data-action="delete-issue" data-id="'+i.id+'">删除任务</button></div></div>'+
      '<button class="icon-btn" data-action="drawer-close" aria-label="关闭">'+icon('x',16)+'</button></div></div>'+
    '<div class="drawer-body"><div class="saved-chip" id="dw-saved">'+icon('check',13)+'已保存</div>'+
      '<div class="d-title" id="dw-title" title="点击编辑标题">'+esc(i.name)+'</div>'+
      '<div class="desc-editor"><div class="de-toolbar">'+['B','I','U','≡','☰','⌗','</>','🔗'].map(t=>'<span class="de-t" style="'+(t==='B'?'font-weight:700':t==='I'?'font-style:italic':t==='U'?'text-decoration:underline':'')+'">'+t+'</span>').join('')+'</div>'+
      '<div class="de-content" id="dw-desc" contenteditable="true" data-ph="添加描述…">'+i.desc+'</div></div>'+
      '<div class="props">'+
        '<label>状态</label><div class="dd"><button class="prop-btn" data-menu-btn="dw-state">'+stateBadge(i.state)+icon('chev',12)+'</button>'+
        '<div class="menu" id="dw-state" hidden>'+Object.entries(STATES).map(([k,v])=>'<button class="menu-item" data-dwstate="'+k+'"><span class="dot" style="background:'+v.color+'"></span>'+v.name+'</button>').join('')+'</div></div>'+
        '<label>负责人</label><div class="dd"><button class="prop-btn" data-menu-btn="dw-as">'+(i.assignee?avatarEl(i.assignee,'avatar avatar-sm')+esc(i.assignee):'<span class="cell-dim">未分配</span>')+icon('chev',12)+'</button>'+
        '<div class="menu" id="dw-as" hidden><button class="menu-item" data-dwas="'+esc(S.user.name)+'">指派给我（'+esc(S.user.name)+'）</button><button class="menu-item" data-dwas="">未分配</button></div></div>'+
        '<label>截止时间</label><input type="date" class="input" id="dw-due" style="width:170px" value="'+(i.due||'')+'">'+
      '</div>'+
      '<div class="d-meta"><span>创建者 '+esc(i.createdBy)+'</span><span>· 创建于 '+esc(i.createdAt)+'</span><span>· 最后更新 '+esc(i.updatedAt)+'</span></div>'+
    '</div></aside>';
  const saved=()=>{const c=$('#dw-saved');if(!c)return;c.classList.add('show');setTimeout(()=>c.classList.remove('show'),1800)};
  const ttl=$('#dw-title');
  ttl.addEventListener('click',()=>{
    ttl.outerHTML='<input class="d-title-input" id="dw-title-in" value="'+esc(i.name)+'">';
    const inp=$('#dw-title-in');inp.focus();inp.select();
    const commit=()=>{const v=inp.value.trim();if(v&&v!==i.name){i.name=v;touch(i);save()}render();saved()};
    inp.addEventListener('blur',commit);
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')inp.blur();if(e.key==='Escape'){inp.removeEventListener('blur',commit);render()}});
  });
  $('#dw-desc').addEventListener('blur',e=>{if(e.target.innerHTML!==i.desc){i.desc=e.target.innerHTML;touch(i);save();saved()}});
  document.querySelectorAll('[data-dwstate]').forEach(b=>b.addEventListener('click',()=>{i.state=b.dataset.dwstate;touch(i);save();closeAllMenus();render();saved()}));
  document.querySelectorAll('[data-dwas]').forEach(b=>b.addEventListener('click',()=>{i.assignee=b.dataset.dwas||null;touch(i);save();closeAllMenus();render();saved()}));
  $('#dw-due').addEventListener('change',e=>{i.due=e.target.value||null;touch(i);save();render();saved()});
}

function openDeleteProj(p){
  openModal('<div class="modal-head"><div class="modal-title">删除项目</div><button class="icon-btn" data-action="modal-close" aria-label="关闭">'+icon('x',16)+'</button></div>'+

  '<div class="modal-foot"><button class="btn btn-ghost" data-action="modal-close">取消</button><button class="btn btn-danger" id="dp-ok" disabled>删除项目</button></div>');
  const inp=$('#dp-input'),ok=$('#dp-ok');inp.focus();
  inp.addEventListener('input',()=>ok.disabled=inp.value.trim()!==p.name);
  ok.addEventListener('click',()=>{
    S.projects=S.projects.filter(x=>x.id!==p.id);
    S.issues=S.issues.filter(x=>x.p!==p.id);
    save();closeModal();toast('项目已删除');nav('#/ws/projects');
  });
}

/* ═════════ 全局事件 ═════════ */
document.addEventListener('click',e=>{
  const mb=e.target.closest('[data-menu-btn]');
  const act=e.target.closest('[data-action]');
  if(mb){const menu=mb.parentElement.querySelector('.menu');const open=menu.hidden;closeAllMenus();if(open){menu.hidden=false}return}
  if(!act){closeAllMenus();return}
  const a=act.dataset.action;
  const stop=e.target.closest('[data-stop]');
  switch(a){
    case 'toggle-pw':{const t=$('#'+act.dataset.target);t.type=t.type==='password'?'text':'password';break}
    case 'demo-login':doLogin({name:DEMO.name,email:DEMO.email,owner:'demo'},parseHash().params.get('next'));break;
    case 'close-banner':S.welcomeShown=true;save();render();break;
    case 'switch-ws':S.currentWs=act.dataset.ws;save();render();break;
    case 'open-team-modal':openTeamModal();break;
    case 'open-proj-modal':openProjModal();break;
    case 'accept-sug':$('#pj-id').value=act.dataset.sug;$('#pj-id-err').hidden=true;$('#pj-id').classList.remove('invalid');$('#pj-preview').textContent=act.dataset.sug+'-1';idDirty=true;break;
    case 'open-project':if(!e.target.closest('.menu')&&!e.target.closest('.proj-more'))nav('#/p/'+act.dataset.id+'/board');break;
    case 'proj-settings':closeAllMenus();nav('#/p/'+act.dataset.id+'/settings');break;
    case 'proj-delete':closeAllMenus();{const p=projById(act.dataset.id);if(p)openDeleteProj(p)}break;
    case 'settings-save':{const p=projById(act.dataset.id);p.name=$('#st-name').value.trim()||p.name;p.desc=$('#st-desc').value;save();toast('已保存');break}
    case 'modal-close':closeModal();break;
    case 'guide-close':guideDismissed=true;render();break;
    case 'open-task-modal':openTaskModal();break;
    case 'col-add':wireColAdd(act);break;
    case 'open-issue':if(!stop&&!e.target.closest('.menu'))openDrawer(act.dataset.id);break;
    case 'drawer-close':closeDrawer();closeAllMenus();break;
    case 'copy-key':copyText(act.dataset.key,'已复制 '+act.dataset.key);break;
    case 'copy-link':copyText(location.href,'已复制链接');break;
    case 'go-login':{const v=$('#rg-email')&&$('#rg-email').value.trim();nav('#/login'+(v?'?email='+encodeURIComponent(v):''));break}
    case 'go-register':{const v=$('#lg-email')&&$('#lg-email').value.trim();nav('#/register'+(v?'?email='+encodeURIComponent(v):''));break}
    case 'sim-disabled':{simDisabled=true;toast('账号已被禁用，请联系管理员');if(S.user){S.user=null;save();closeDrawer(true);nav('#/login')}else render();break}
    case 'toggle-fail':{simFail=!simFail;const t=act.querySelector('.tf-t');if(t)t.textContent=simFail?'关闭拖拽失败模拟':'开启拖拽失败模拟';toast(simFail?'拖拽失败模拟已开启（下次松手即失败）':'拖拽失败模拟已关闭');break}
    case 'delete-issue':{closeAllMenus();const id=act.dataset.id;closeDrawer();
      const i=S.issues.find(x=>x.id===id);S.issues=S.issues.filter(x=>x.id!==id);save();toast('已删除 '+(i?issueKey(i):'任务'));render();break}
    case 'logout':S.user=null;save();closeDrawer(true);nav('#/login');break;
    case 'expire':{const nb=q1of(parseHash().seg);S.user=null;save();closeDrawer(true);toast('登录已过期，请重新登录');nav('#/login?next='+encodeURIComponent(nb));break}
    case 'reset-demo':try{localStorage.removeItem(LS_KEY)}catch(x){}location.hash='';location.reload();break;
    case 'dock-toggle':$('#dock-panel').hidden=!$('#dock-panel').hidden;break;
    default:closeAllMenus();
  }
  if(['open-issue','copy-key','delete-issue'].includes(a))return;
  if(!mb)closeAllMenus();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    const m=document.querySelector('.menu:not([hidden])');
    if(m){m.hidden=true;return}
    if($('#modal-root').innerHTML){closeModal();return}
    if(drawerIssue)closeDrawer();
  }
});
