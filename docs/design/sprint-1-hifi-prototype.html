<style>
/* ═════════ 设计 token · 与 sprint-0 冻结基线一致 ═════════ */
:root{
  --brand-50:#eef4ff;--brand-100:#dbe7fe;--brand-500:#3f76ff;--brand-600:#2f5fe0;
  --state-unstarted:#9ca3af;--state-started:#3b82f6;--state-completed:#10b981;--state-cancelled:#6b7280;
  --danger:#ef4444;--ok:#059669;--warn:#f59e0b;
  --bg:#fafafa;--surface:#ffffff;--surface-2:#f5f5f5;--surface-3:#ececec;
  --line:#e5e5e5;--line-strong:#d4d4d4;
  --ink:#262626;--ink-2:#525252;--ink-3:#8c8c8c;--ink-4:#a3a3a3;
  --radius-card:.5rem;--radius-md:6px;--radius-lg:8px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);--shadow-md:0 4px 12px rgba(0,0,0,.08);--shadow-lg:0 12px 32px rgba(0,0,0,.14);
  --font-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --header-h:48px;--ease-spring:cubic-bezier(.2,.9,.3,1.1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-ui);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font:inherit;color:inherit}
svg{flex-shrink:0}
:focus-visible{outline:2px solid var(--brand-500);outline-offset:1px;border-radius:4px}
[hidden]{display:none!important}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ═════════ 基础控件（基线） ═════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:var(--radius-md);font-weight:500;font-size:13px;transition:background .12s,border-color .12s,opacity .12s;white-space:nowrap}
.btn-primary{background:var(--brand-500);color:#fff}
.btn-primary:hover{background:var(--brand-600)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:var(--surface);border:1px solid var(--line-strong);color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-ghost:disabled{opacity:.5;cursor:not-allowed}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-danger:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{height:28px;padding:0 10px;font-size:12px}
.icon-btn{width:30px;height:30px;border-radius:var(--radius-md);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-3)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.input{width:100%;height:36px;border:1px solid var(--line-strong);border-radius:var(--radius-md);padding:0 10px;background:var(--surface);transition:border-color .12s,box-shadow .12s}
.input:focus{outline:none;border-color:var(--brand-500);box-shadow:0 0 0 3px var(--brand-50)}
.input.invalid{border-color:var(--danger)}
textarea.input{height:auto;padding:8px 10px;resize:vertical;line-height:1.6}
.label{display:block;font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:6px}
.hint{font-size:12px;color:var(--ink-3)}
.err-text{font-size:12px;color:var(--danger);margin-top:4px}
.alert{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 12px;border-radius:var(--radius-md);margin-bottom:14px}
.alert-error{background:var(--danger);color:#fff}
.alert-soft{background:#fef2f2;color:#b91c1c}
.alert-info{background:var(--brand-50);color:var(--brand-600)}
.alert-ok{background:#ecfdf5;color:#047857}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.badge-id{font-family:var(--font-mono);font-size:11px;padding:1px 6px;background:var(--surface-2);border-radius:4px;color:var(--ink-2);white-space:nowrap}
.avatar{width:28px;height:28px;border-radius:50%;color:#fff;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.avatar-sm{width:20px;height:20px;font-size:10px}
.avatar-md{width:24px;height:24px;font-size:11px}
.avatar-custom{background:linear-gradient(135deg,#6366f1,#3f76ff)}
.avatar-img-wrap{display:inline-flex;overflow:hidden}
.avatar-img{width:100%;height:100%;object-fit:cover;display:block}
a{color:var(--brand-600);text-decoration:none}
a:hover{text-decoration:underline}
.link-btn{color:var(--brand-600);font-size:13px}
.link-btn:hover{text-decoration:underline}
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#262626;color:#fff;font-size:12px;font-weight:400;padding:4px 9px;border-radius:6px;white-space:nowrap;z-index:300;pointer-events:none;text-decoration:none}

/* ═════════ 弹层 / 下拉 / Popconfirm ═════════ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.32);backdrop-filter:blur(2px);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s ease}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow-lg);width:480px;max-width:100%;max-height:88vh;overflow:auto;padding:24px;animation:pop .18s var(--ease-spring)}
.modal.w400{width:400px}.modal.w520{width:520px}.modal.w560{width:560px}.modal.w640{width:640px}.modal.w720{width:720px}.modal.w920{width:920px}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-title{font-size:16px;font-weight:600}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.menu{position:absolute;min-width:150px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:4px;z-index:60;animation:pop .12s var(--ease-spring)}
.menu-item{display:flex;width:100%;align-items:center;gap:8px;min-height:32px;padding:4px 12px;border-radius:var(--radius-md);font-size:13px;color:var(--ink-2);text-align:left}
.menu-item:hover{background:var(--surface-2)}
.menu-item.danger{color:#dc2626}
.menu-sep{height:1px;background:var(--line);margin:4px 0}
.menu-cap{font-size:11px;color:var(--ink-4);padding:6px 12px 3px}
.mrow{display:flex;width:100%;align-items:center;gap:8px;min-height:30px;padding:4px 12px;border-radius:var(--radius-md);font-size:13px;color:var(--ink-2);text-align:left}
.mrow:hover{background:var(--surface-2)}
.mrow .cb{width:15px;height:15px;accent-color:var(--brand-500);flex-shrink:0}
.mrow.active{color:var(--ink);font-weight:500}
.dd{position:relative}
.pconfirm{position:fixed;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:12px 14px;width:240px;z-index:130;animation:pop .12s var(--ease-spring)}
.pconfirm .pt{font-size:13px;font-weight:500;margin-bottom:10px}
.pconfirm .prow{display:flex;justify-content:flex-end;gap:8px}

/* ═════════ ErrorToast（C.36） ═════════ */
.toast-wrap{position:fixed;top:16px;right:16px;z-index:220;display:flex;flex-direction:column;gap:8px;width:340px}
.toast{border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:10px 14px;font-size:13px;display:flex;align-items:flex-start;gap:8px;animation:slide-in .2s var(--ease-spring);color:#fff;position:relative}
.toast .tx{flex:1;min-width:0}
.toast .tclose{color:rgba(255,255,255,.7);width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;flex-shrink:0}
.toast .tclose:hover{color:#fff;background:rgba(255,255,255,.15)}
.toast-info{background:#2563eb}
.toast-warning{background:#d97706}
.toast-error{background:#b91c1c}
.toast-track{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:rgba(255,255,255,.9);flex-wrap:wrap}
.toast-track .tid{font-family:var(--font-mono)}
.toast-track .tb{color:#fff;text-decoration:underline;text-underline-offset:2px;font-size:12px}
.toast-action{margin-left:4px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:5px;padding:1px 8px;font-size:12px}
.toast-action:hover{background:rgba(255,255,255,.28)}

/* ═════════ 认证页（基线 + C.12/13/17 轻页） ═════════ */
.auth-wrap{min-height:100vh;background:var(--bg);display:flex;justify-content:center;align-items:flex-start;padding:10vh 16px 40px}
.auth-card{width:420px;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-sm);padding:32px 36px 26px}
.auth-logo{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:18px}
.logo-mark{width:44px;height:44px;border-radius:12px;background:var(--brand-500);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:var(--shadow-sm)}
.auth-title{font-size:24px;font-weight:600;text-align:center;text-wrap:balance}
.auth-sub{font-size:13px;color:var(--ink-3);text-align:center;margin-top:6px}
.auth-top-link{display:flex;justify-content:center;gap:6px;font-size:13px;color:var(--ink-3);margin-bottom:14px}
.field{margin-bottom:16px}
.pw-wrap{position:relative}
.pw-wrap .input{padding-right:38px}
.pw-eye{position:absolute;right:2px;top:3px;width:32px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--ink-3);border-radius:var(--radius-md)}
.pw-eye:hover{color:var(--ink)}
.strength-bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.strength-fill{height:100%;width:0;border-radius:3px;transition:width .2s,background .2s}
.strength-row{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:6px}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:12px;color:var(--ink-3);margin-top:10px}
.rules .ok{color:var(--ok)}
.check-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer}
.check-row input{accent-color:var(--brand-500);width:15px;height:15px}
.auth-foot{border-top:1px solid var(--line);margin-top:22px;padding-top:16px;font-size:13px;color:var(--ink-3);text-align:center}
.invalid-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:18px 0 4px}
.invalid-card .ic{color:#d4d4d4}
.invalid-card .t1{font-size:16px;font-weight:600;color:var(--ink)}
.invalid-card .t2{font-size:13px;color:var(--ink-3)}

/* ═════════ 应用壳：顶栏 + 侧栏（C.3 变更 + C.14 截断条） ═════════ */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;flex-shrink:0}
.switcher{height:36px;display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:var(--radius-md);position:relative}
.switcher:hover{background:var(--surface-2)}
.sw-logo{width:20px;height:20px;border-radius:6px;color:#fff;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.sw-name{font-size:13px;font-weight:500;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw-chev{color:var(--ink-3)}
.switcher-menu{top:42px;left:0;width:260px;padding:6px}
.sw-item{height:40px;padding:0 10px;display:flex;align-items:center;gap:8px;border-radius:var(--radius-md);width:100%;text-align:left}
.sw-item:hover{background:var(--surface-2)}
.sw-item.current{background:var(--brand-50)}
.sw-item .nm{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw-item .rl{font-size:12px;color:var(--ink-4)}
.sw-item .ck{color:var(--brand-500);width:16px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.kbd-chip{height:28px;padding:0 8px;border:1px solid var(--line);border-radius:var(--radius-md);font-size:12px;color:var(--ink-3);background:var(--surface);display:inline-flex;align-items:center;gap:4px}
.bell-wrap{position:relative}
.bell-badge{position:absolute;top:-1px;right:-3px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.bell-badge.bounce{animation:bounce .5s var(--ease-spring)}
.syncstrip{display:flex;align-items:center;gap:8px;background:#fffbeb;border-bottom:1px solid #fde68a;color:#b45309;font-size:13px;padding:6px 14px;flex-shrink:0}
.syncstrip button{margin-left:auto;color:#b45309;font-size:12px;border:1px solid #fde68a;border-radius:5px;padding:2px 10px}
.shell{display:flex;flex:1;min-height:0}
.sidebar{width:240px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:2px;padding:12px;flex-shrink:0}
.side-label{font-size:11px;font-weight:600;color:var(--ink-4);text-transform:uppercase;letter-spacing:.05em;padding:10px 10px 4px}
.side-item{height:34px;padding:0 10px;border-radius:var(--radius-md);display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2);width:100%;text-align:left}
.side-item:hover{background:var(--surface-2)}
.side-item.active{background:var(--brand-50);color:var(--brand-600);font-weight:500}
.side-item.disabled{color:var(--ink-4);cursor:not-allowed}
.side-item.disabled:hover{background:none}
.side-bottom{margin-top:auto}
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.page{flex:1;overflow-y:auto;padding:22px 26px}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.page-title{font-size:18px;font-weight:600}
.page-sub{font-size:13px;color:var(--ink-3)}
.page-head .btn{margin-left:auto}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:60px 0;color:var(--ink-3);text-align:center}
.empty svg{color:#d4d4d4}
.empty-title{font-size:15px;font-weight:600;color:var(--ink-2)}
.empty-sub{font-size:13px;color:var(--ink-3)}
.empty .btn{margin-top:8px}
.count-wrap{display:flex;justify-content:flex-end;font-size:12px;color:var(--ink-4);margin-top:4px}

/* ═════════ 项目列表页（C.19） ═════════ */
.proj-filter{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.proj-filter .fsearch{width:280px}
.ptabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px}
.ptab{height:36px;padding:0 12px;font-size:13px;color:var(--ink-2);border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px}
.ptab.active{color:var(--brand-600);font-weight:500;border-bottom-color:var(--brand-500)}
.ptab .cnt{font-size:12px;color:var(--ink-4);background:var(--surface-2);border-radius:99px;padding:0 8px}
.proj-sec-title{font-size:13px;font-weight:600;color:var(--ink-2);margin:4px 0 10px;display:flex;align-items:center;gap:6px}
.proj-sec-sep{height:1px;background:var(--line);margin:20px 0 14px}
.proj-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(265px,1fr))}
.proj-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:16px;cursor:pointer;transition:border-color .15s,box-shadow .15s;display:block}
.proj-card:hover{border-color:var(--brand-100);box-shadow:var(--shadow-md)}
.proj-card.archived{opacity:.75}
.proj-card-top{display:flex;gap:10px;align-items:flex-start;padding-right:56px}
.proj-logo{width:24px;height:24px;border-radius:6px;color:#fff;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}
.proj-name{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-badges{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.arch-badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-3);background:var(--surface-2);border-radius:4px;padding:1px 7px}
.proj-desc{font-size:13px;color:var(--ink-3);margin-top:9px;min-height:20px}
.proj-foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.proj-count{font-size:12px;color:var(--ink-4)}
.proj-more{position:absolute;top:10px;right:10px;opacity:0;transition:opacity .15s}
.proj-card:hover .proj-more{opacity:1}
.star-btn{position:absolute;top:8px;right:40px;width:28px;height:28px;border-radius:var(--radius-md);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-4);opacity:0;transition:opacity .15s}
.proj-card:hover .star-btn,.star-btn.on{opacity:1}
.star-btn.on{color:#f59e0b}
.star-btn:hover{background:var(--surface-2)}
.avstack{display:inline-flex;align-items:center}
.avstack .avatar{border:2px solid var(--surface);margin-left:-6px}
.avstack .avatar:first-child{margin-left:0}
.avstack .more-n{width:24px;height:24px;border-radius:50%;background:var(--surface-3);color:var(--ink-3);font-size:10px;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--surface);margin-left:-6px}
.arch-banner{display:flex;align-items:center;gap:8px;background:#fffbeb;border:1px solid #fde68a;color:#b45309;border-radius:var(--radius-lg);padding:8px 14px;font-size:13px;margin:0 20px 12px}
.arch-banner.fixed{margin:12px 20px 0}

/* ═════════ 项目壳（C.4 / C.14） ═════════ */
.pshell{flex:1;display:flex;min-height:0}
.psidebar{width:220px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:2px;padding:12px;flex-shrink:0}
.p-id{display:flex;align-items:center;gap:9px;padding:6px 10px 12px}
.p-id .nm{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.view-bar{display:flex;align-items:center;gap:8px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface);flex-shrink:0}
.view-title{font-size:15px;font-weight:600}
.view-count{font-size:13px;color:var(--ink-3)}
.view-bar .btn{margin-left:auto}
.pmain{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.ps-manage-fold{display:none}
@media (max-width:1279px){
  .ps-manage-flat{display:none}
  .ps-manage-fold{display:block}
}

/* ═════════ 筛选工具条 / Chips（C.28 / C.29） ═════════ */
.filterbar{display:flex;align-items:center;gap:8px;padding:8px 20px;background:rgba(255,255,255,.95);backdrop-filter:blur(4px);border-bottom:1px solid var(--line);flex-shrink:0;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.filterbar.boardbar{min-height:52px}
.fsearch-wrap{position:relative;display:flex;align-items:center;width:240px}
.fsearch-wrap .input{height:32px;padding-left:30px;padding-right:56px;font-size:13px}
.fsearch-wrap>svg{position:absolute;left:9px;color:var(--ink-4);pointer-events:none}
.fsearch-wrap .fcnt{position:absolute;right:30px;font-size:11px;color:var(--ink-4);pointer-events:none;font-variant-numeric:tabular-nums}
.fsearch-wrap .fclear{position:absolute;right:4px;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-3);border-radius:4px}
.fsearch-wrap .fclear:hover{background:var(--surface-2)}
.fbtn{height:32px;padding:0 10px;border:1px solid var(--line-strong);border-radius:var(--radius-md);font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;background:var(--surface)}
.fbtn:hover{background:var(--surface-2)}
.fbtn.has{border-color:var(--brand-500);color:var(--brand-600);background:var(--brand-50)}
.fbtn .n{font-size:11px;background:var(--brand-500);color:#fff;border-radius:99px;padding:0 6px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--radius-md);overflow:hidden;height:32px}
.seg button{padding:0 12px;font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.seg button.active{background:var(--brand-50);color:var(--brand-600);font-weight:500}
.seg button+button{border-left:1px solid var(--line-strong)}
.chiprow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 20px;border-bottom:1px solid var(--line);flex-shrink:0;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:99px;padding:2px 10px;font-size:12px;color:var(--ink-2)}
.chip:hover{background:var(--surface-3)}
.chip .cx{display:inline-flex;width:16px;height:16px;align-items:center;justify-content:center;border-radius:50%;color:var(--ink-3)}
.chip .cx:hover{background:#d4d4d4;color:var(--ink)}
.total-cnt{margin-left:auto;color:var(--ink-4);font-size:12px}
.loadmore-row{display:flex;justify-content:center;padding:16px 0 22px;gap:10px;align-items:center}

/* ═════════ 任务列表 七列（C.28 / C.27） ═════════ */
.twrap{flex:1;overflow-y:auto;padding:16px 20px 20px;display:flex;flex-direction:column}
.quick-row{display:flex;align-items:center;gap:8px;border:1px dashed var(--line-strong);border-radius:var(--radius-md);height:38px;padding:0 12px;color:var(--ink-3);margin-bottom:14px;transition:border-color .12s,background .12s;flex-shrink:0}
.quick-row:focus-within{border:1px solid var(--brand-500);background:var(--surface);color:var(--ink)}
.quick-row input{flex:1;border:none;background:transparent;outline:none;font-size:13px;color:var(--ink)}
.itable{width:100%;border-collapse:collapse}
.itable th{font-size:11px;font-weight:600;color:var(--ink-4);text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.itable th.sortable{cursor:pointer;user-select:none}
.itable th.sortable:hover{color:var(--ink-2)}
.itable td{font-size:13px;padding:9px 12px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
.itable tbody tr{cursor:pointer}
.itable tbody tr:hover td,.itable tbody tr:focus-visible td{background:var(--bg)}
.itable tbody tr:hover .title-cell{color:var(--brand-600);text-decoration:underline;text-decoration-color:var(--ink-4)}
.itable tbody tr.flash td{animation:flashhl 2s ease}
.cell-key{font-family:var(--font-mono);font-size:12px;color:var(--ink-3);white-space:nowrap;display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.cell-key .tbar{width:3px;height:14px;border-radius:2px;display:inline-block}
.cell-title{color:var(--ink)}
.cell-dim{color:var(--ink-4)}
.title-cell .inl-tags{display:inline-flex;gap:4px;margin-left:8px;vertical-align:1px}
.lbl-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:0 7px;border-radius:4px;color:#fff;white-space:nowrap;height:18px}
.lbl-tag .ld{width:6px;height:6px;border-radius:2px;background:rgba(255,255,255,.85)}
.lbl-tag.gray{background:var(--surface-3);color:var(--ink-3)}
.subtask-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-3);background:var(--surface-2);border-radius:4px;padding:1px 6px;margin-left:6px;white-space:nowrap}
.pri-cell{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.state-badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.overdue{color:var(--danger);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.due-today{color:#d97706;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.rel-time{color:var(--ink-3);font-size:12px;white-space:nowrap}

/* ═════════ 看板 四列（C.29） ═════════ */
.board-empty-wrap{position:relative;flex:1;display:flex;min-height:0}
.board{flex:1;display:flex;gap:16px;overflow-x:auto;overflow-y:hidden;padding:16px 20px;min-height:0;transition:opacity .12s}
.board.reflow{opacity:.35}
.board-guide{position:absolute;left:20px;right:20px;top:8px;display:flex;align-items:center;gap:10px;background:var(--brand-50);border:1px solid var(--brand-100);color:var(--brand-600);border-radius:var(--radius-lg);padding:8px 14px;font-size:13px;z-index:5}
.bcol{width:280px;min-width:280px;display:flex;flex-direction:column;background:var(--surface-2);border-radius:var(--radius-lg);transition:box-shadow .12s,background .12s;max-height:100%}
.bcol.drag-over{background:var(--brand-50);box-shadow:inset 0 0 0 2px var(--brand-100)}
.bcol.fail-ring{box-shadow:inset 0 0 0 2px var(--danger)}
.bcol-head{height:40px;display:flex;align-items:center;gap:8px;padding:0 12px;flex-shrink:0}
.bcol-name{font-size:13px;font-weight:500}
.bcol-count{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-4);margin-left:auto;background:var(--surface-3);border-radius:99px;padding:0 8px}
.bcol-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 8px 8px;display:flex;flex-direction:column;gap:8px;min-height:56px}
.bcol-body::-webkit-scrollbar{width:6px}
.bcol-body::-webkit-scrollbar-thumb{background:#d4d4d4;border-radius:3px}
.bcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:9px 12px 9px 15px;box-shadow:var(--shadow-sm);cursor:grab;transition:box-shadow .15s,border-color .15s,opacity .15s}
.bcard::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--bar,var(--state-unstarted))}
.bcard:hover{box-shadow:var(--shadow-md);border-color:var(--line-strong)}
.bcard.dragging{opacity:.4;transform:scale(.98)}
.bcard.cancelled{opacity:.6}
.bcard-title{font-size:13px;color:var(--ink);line-height:1.45;display:flex;gap:5px;align-items:flex-start}
.bcard-title .tico{color:var(--ink-4);margin-top:2px}
.bcard-meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.bcard-pri{display:inline-flex;align-items:center;gap:5px}
.bcard-pri .pd{width:8px;height:8px;border-radius:50%}
.bcard-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:12px;gap:6px}
.bcard-key{font-family:var(--font-mono);font-size:11px;color:var(--ink-4)}
.bcard-lbls{display:inline-flex;gap:4px;align-items:center;flex-wrap:wrap}
.att-badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--ink-3)}
.drop-hint{border:2px dashed var(--line-strong);border-radius:var(--radius-md);padding:16px 0;text-align:center;font-size:12px;color:var(--ink-4);margin:2px 2px 0;transition:border-color .12s,color .12s}
.bcol.drag-over .drop-hint{border-color:var(--brand-500);color:var(--brand-600)}
.ind{height:2px;width:100%;background:var(--brand-500);border-radius:2px;margin:0 0 2px;pointer-events:none}
.add-card-btn{height:32px;margin-top:6px;display:flex;align-items:center;gap:6px;padding:0 10px;border-radius:var(--radius-md);font-size:13px;color:var(--ink-3);width:100%;flex-shrink:0}
.add-card-btn:hover{background:var(--surface-3);color:var(--ink-2)}
.add-inline{display:flex;flex-direction:column;gap:4px;margin-top:2px}
.add-inline .input{height:34px;font-size:13px}
.add-inline .hint{font-size:11px}
.col-loadmore{height:28px;margin-top:4px;font-size:12px;color:var(--ink-3);width:100%;border-radius:var(--radius-md);flex-shrink:0}
.col-loadmore:hover{background:var(--surface-3);color:var(--ink-2)}
.board-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:6;pointer-events:auto;background:linear-gradient(rgba(250,250,250,.6),rgba(250,250,250,.6))}
.board-overlay.solid{background:var(--bg)}

/* ═════════ Hover Peek（C.30） ═════════ */
.peek{position:fixed;width:340px;max-height:320px;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:16px;z-index:70;animation:peekin .12s ease-out}
.peek-head{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3)}
.peek-head .pk{font-family:var(--font-mono);color:var(--ink-2)}
.peek-title{font-size:14px;font-weight:600;margin:8px 0 6px;line-height:1.4}
.peek-desc{font-size:12px;color:var(--ink-3);line-height:1.6}
.peek-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);margin-top:8px;flex-wrap:wrap}

/* ═════════ 任务详情抽屉（C.6 基线 + C.23~C.33） ═════════ */
.drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:80;animation:fade .15s ease}
.drawer{position:fixed;top:0;right:0;bottom:0;width:720px;max-width:calc(100vw - 64px);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);z-index:85;display:flex;flex-direction:column;animation:slide-x .22s var(--ease-spring)}
.drawer-head{display:flex;align-items:center;gap:8px;padding:12px 20px;border-bottom:1px solid var(--line);flex-shrink:0;position:relative}
.drawer-key{font-family:var(--font-mono);font-size:13px;color:var(--ink-3)}
.drawer-key:hover{color:var(--brand-600)}
.drawer-head .right{margin-left:auto;display:flex;align-items:center;gap:2px}
.drawer-body{flex:1;overflow-y:auto;padding:18px 24px;position:relative}
.d-title{font-size:17px;font-weight:600;padding:7px 10px;margin:0 -10px;border-radius:var(--radius-md);cursor:text}
.d-title:hover{background:var(--surface-2)}
.d-title-input{font-size:17px;font-weight:600;width:100%;border:none;border-bottom:2px solid var(--brand-500);outline:none;padding:7px 10px;margin:0 -10px;background:var(--surface)}
.desc-editor{border:1px solid var(--line);border-radius:var(--radius-lg);margin-top:14px;background:var(--surface)}
.de-toolbar{display:flex;gap:2px;padding:5px 8px;border-bottom:1px solid var(--line);background:var(--bg);border-radius:var(--radius-lg) var(--radius-lg) 0 0;font-size:13px;color:var(--ink-3);flex-wrap:wrap}
.de-t{min-width:26px;height:24px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;padding:0 4px}
.de-t:hover{background:var(--surface-2);color:var(--ink)}
.de-content{min-height:96px;padding:10px 12px;font-size:13px;outline:none;line-height:1.7}
.de-content:empty:before{content:attr(data-ph);color:var(--ink-4)}
.dtabs{display:flex;gap:2px;padding:0 24px;border-bottom:1px solid var(--line);flex-shrink:0}
.dtab{height:38px;padding:0 14px;font-size:13px;color:var(--ink-2);border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px}
.dtab.active{color:var(--brand-600);font-weight:500;border-bottom-color:var(--brand-500)}
.props{margin-top:18px;border-top:1px solid var(--line);padding-top:16px;display:grid;grid-template-columns:80px 1fr;gap:14px 14px;align-items:center}
.props label{font-size:13px;color:var(--ink-3)}
.prop-btn{height:32px;border:1px solid var(--line-strong);border-radius:var(--radius-md);padding:0 10px;display:inline-flex;align-items:center;gap:8px;font-size:13px;background:var(--surface);min-width:120px}
.prop-btn:hover{background:var(--surface-2)}
.prop-btn:disabled{cursor:not-allowed;color:var(--ink-4)}
/* 下拉触发器的 chev 图标一律靠右：按钮定宽/满宽（.prop-btn min-width:120px、width:100%）时不再贴着文案 */
.fbtn>svg:last-child,.prop-btn>svg:last-child,.switcher>.sw-chev{margin-left:auto}
.d-meta{margin-top:20px;border-top:1px solid var(--line);padding-top:12px;font-size:12px;color:var(--ink-4);display:flex;gap:8px;flex-wrap:wrap}
.saved-chip{position:absolute;top:8px;right:70px;display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ok);opacity:0;transition:opacity .25s;z-index:3}
.saved-chip.show{opacity:1}
/* 子任务区（C.24） */
.subsec{margin-top:22px;border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px}
.subsec-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.subsec-head .t{font-size:13px;font-weight:600}
.subbar{width:80px;height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.subbar .f{height:100%;background:var(--brand-500);border-radius:4px;transition:width .2s}
.subbar .f.done{background:var(--state-completed)}
.subrow{display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid #f0f0f0;position:relative}
.subrow:last-of-type{border-bottom:none}
.subrow input[type=checkbox]{width:15px;height:15px;accent-color:var(--brand-500);flex-shrink:0}
.subrow .snm{flex:1;font-size:13px;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.subrow .snm:hover{color:var(--brand-600);text-decoration:underline}
.subrow .snm.done{color:var(--ink-4);text-decoration:line-through}
.sub-add{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--ink-3);font-size:13px}
.sub-add input{flex:1;border:1px dashed var(--line-strong);border-radius:var(--radius-md);height:32px;padding:0 10px;font-size:13px;outline:none;background:transparent}
.sub-add input:focus{border:1px solid var(--brand-500);background:var(--surface)}
.sub-notice{margin-top:10px;background:var(--surface-2);border-radius:var(--radius-md);padding:8px 12px;font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
/* 动态时间线（C.25） */
.tl{list-style:none;display:flex;flex-direction:column;gap:16px}
.tl-epoch{display:flex;gap:12px}
.tl-epoch .ewho{flex-shrink:0;width:28px}
.tl-epoch .eh{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--ink-4);margin-bottom:4px}
.tl-epoch .eh b{font-size:13px;color:var(--ink-2);font-weight:500}
.tl-epoch li{font-size:13px;color:var(--ink-2);padding:2px 0;list-style:none}
/* 评论（C.32 / C.33） */
.crow{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #f0f0f0}
.crow.opt{opacity:.6}
.crow .cbody{flex:1;min-width:0}
.crow .chead{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--ink-4);flex-wrap:wrap}
.crow .chead b{font-size:13px;color:var(--ink);font-weight:600}
.crow .ctext{font-size:13px;color:var(--ink);margin-top:2px;line-height:1.6;word-break:break-word}
.crow .ctext.deleted{color:var(--ink-4)}
.crow .cops{margin-left:auto;display:inline-flex;gap:2px}
.mention{color:var(--brand-600);font-weight:500}
.ceditor{border:1px solid var(--line-strong);border-radius:var(--radius-lg);margin-top:16px;position:relative}
.ceditor:focus-within{border-color:var(--brand-500);box-shadow:0 0 0 3px var(--brand-50)}
.ce-toolbar{display:flex;gap:2px;padding:5px 8px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-3);border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.ce-content{min-height:64px;padding:8px 12px;font-size:13px;outline:none;line-height:1.6}
.ce-content:empty:before{content:attr(data-ph);color:var(--ink-4)}
.ce-foot{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12px;color:var(--ink-4)}
.ce-foot .btn{margin-left:auto;height:28px}
.mention-pop{position:absolute;bottom:calc(100% + 6px);left:0;width:300px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);z-index:40;overflow:hidden;animation:pop .1s ease-out}
.mention-pop .mf{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-4);padding:7px 12px;border-bottom:1px solid var(--line)}
.mopt{display:flex;width:100%;align-items:center;gap:8px;padding:7px 12px;font-size:13px;color:var(--ink-2);text-align:left}
.mopt.on{background:var(--brand-50)}
.mopt .em{font-size:11px;color:var(--ink-4);margin-left:auto;font-family:var(--font-mono)}
.edit-timer{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-4)}
.edit-timer.warn{color:#d97706}
.viewer-note{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:var(--radius-lg);padding:12px 16px;font-size:13px;color:var(--ink-3);margin-top:16px}
/* 附件（C.31） */
.dropzone{border:2px dashed var(--line-strong);border-radius:var(--radius-lg);padding:18px;text-align:center;font-size:13px;color:var(--ink-3);margin-top:14px;cursor:pointer;transition:border-color .12s,background .12s;position:relative}
.dropzone:hover{border-color:var(--brand-100)}
.dropzone.over{border-color:var(--brand-500);background:var(--brand-50);color:var(--brand-600)}
.frow{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid #f0f0f0;font-size:13px}
.frow .fico{color:var(--ink-3);display:inline-flex}
.frow .fnm{font-size:13px;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .fmeta{font-size:12px;color:var(--ink-4);white-space:nowrap}
.frow .fops{margin-left:auto;display:inline-flex;gap:2px;align-items:center}
.frow.failed{background:#fef2f2;border-radius:var(--radius-md)}
.frow.failed .fnm{color:#b91c1c}
.upbar{flex:1;height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden;min-width:80px}
.upbar .f{height:100%;background:var(--brand-500);border-radius:2px;transition:width .3s}

/* ═════════ 通知中心抽屉（C.34） ═════════ */
.ndrawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:92;animation:fade .15s ease}
.ndrawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:calc(100vw - 48px);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);z-index:95;display:flex;flex-direction:column;animation:slide-x .22s var(--ease-spring)}
.nd-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-shrink:0}
.nd-title{font-size:15px;font-weight:600}
.nd-head .right{margin-left:auto;display:flex;align-items:center;gap:12px}
.nd-switch{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);cursor:pointer}
.nd-switch input{accent-color:var(--brand-500);width:14px;height:14px}
.nd-body{flex:1;overflow-y:auto;padding:6px 0 16px}
.nd-group{font-size:12px;font-weight:600;color:var(--ink-4);padding:12px 18px 4px}
.nrow{display:flex;gap:10px;padding:9px 18px;cursor:pointer;align-items:flex-start}
.nrow:hover{background:var(--bg)}
.nrow .ndot{width:8px;height:8px;border-radius:50%;background:var(--brand-500);margin-top:6px;flex-shrink:0}
.nrow .ndot.read{background:var(--line-strong)}
.nrow .ntext{flex:1;font-size:13px;color:var(--ink);line-height:1.5}
.nrow .ntime{font-size:12px;color:var(--ink-4);white-space:nowrap;margin-top:2px}
.nrow .nico{color:var(--ink-4);flex-shrink:0;margin-top:1px}
.nd-more{display:block;width:calc(100% - 36px);margin:8px 18px 0;font-size:12px;color:var(--ink-3);border:1px solid var(--line);border-radius:var(--radius-md);padding:6px 0}
.nd-more:hover{background:var(--surface-2)}

/* ═════════ 工作台首页（C.35） ═════════ */
.home-wrap{display:flex;gap:20px;align-items:flex-start}
.home-main{flex:1;min-width:0}
.home-right{width:320px;flex-shrink:0}
.welcome-row{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.welcome-hi{font-size:20px;font-weight:600}
.welcome-date{font-size:13px;color:var(--ink-3)}
.welcome-row .icon-btn{align-self:center}
.statgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px}
.statcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px;display:flex;flex-direction:column;gap:2px;cursor:pointer;transition:border-color .12s,box-shadow .12s;position:relative}
.statcard:hover{border-color:var(--line-strong);box-shadow:var(--shadow-sm)}
.statcard .sl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.statcard .sv{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.statcard .sv.red{color:var(--danger)}
.statcard .sv.orange{color:#d97706}
.statcard .retry{position:absolute;top:10px;right:10px;font-size:11px;color:var(--brand-600)}
.barchart{display:flex;align-items:flex-end;gap:6px;height:64px;margin-top:6px}
.barchart .bar{width:10px;border-radius:3px 3px 0 0;background:var(--state-completed);cursor:default}
.barchart .bar.today{background:var(--state-started)}
.barchart .bar.stub{height:2px!important;background:var(--surface-3)}
.htabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:6px}
.htab{height:36px;padding:0 12px;font-size:13px;color:var(--ink-2);border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px}
.htab.active{color:var(--brand-600);font-weight:500;border-bottom-color:var(--brand-500)}
.htab .cnt{font-size:12px;color:var(--ink-4);background:var(--surface-2);border-radius:99px;padding:0 8px}
.irow{display:flex;align-items:center;gap:10px;height:44px;padding:0 8px;border-radius:var(--radius-md);cursor:pointer;border-bottom:1px solid #f2f2f2}
.irow:hover{background:var(--surface)}
.irow.flash{animation:flashhl 2s ease}
.irow .pbadge{font-family:var(--font-mono);font-size:11px;color:#fff;border-radius:4px;padding:1px 6px;flex-shrink:0}
.irow .ikey{font-family:var(--font-mono);font-size:12px;color:var(--ink-4);flex-shrink:0}
.irow .inm{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.irow .iright{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);flex-shrink:0}
.notifcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px}
.notifcard .nhead{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-bottom:4px}
.notifcard .nbadge{background:var(--danger);color:#fff;font-size:11px;border-radius:99px;padding:0 8px;font-weight:600}
.notifcard .nitem{display:flex;flex-direction:column;gap:2px;padding:9px 0;border-bottom:1px solid #f2f2f2;font-size:12px;color:var(--ink-2)}
.notifcard .nitem .t2{color:var(--ink-4);font-size:11px}
.notifcard .nitem .tt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.notifcard .nitem .rt{color:var(--ink-4);font-size:11px}
.notifcard .nall{text-align:right;margin-top:10px}

/* ═════════ 个人设置（C.10 / C.11） ═════════ */
.setshell{flex:1;display:flex;min-height:0}
.setnav{width:240px;border-right:1px solid var(--line);background:var(--surface);padding:18px 12px;display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.setnav .sh{font-size:15px;font-weight:600;padding:0 10px 14px}
.setcontent{flex:1;overflow-y:auto;padding:26px 30px}
.setcontent .inner{max-width:720px}
.profile-head{display:flex;gap:24px;align-items:flex-start;margin-bottom:8px;flex-wrap:wrap}
.bigav{width:160px;height:160px;border-radius:50%;position:relative;overflow:hidden;flex-shrink:0}
.bigav .bav{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:48px;font-weight:600}
.bigav .mask{position:absolute;inset:0;background:rgba(0,0,0,.45);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;opacity:0;transition:opacity .15s;cursor:pointer}
.bigav:hover .mask{opacity:1}
.bigav.dragover{outline:3px dashed var(--brand-500);outline-offset:3px}
.ring-wrap{position:relative;width:44px;height:44px;flex-shrink:0}
.ring-wrap .rtxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pfield{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;margin-bottom:16px}
.pfield label{font-size:13px;color:var(--ink-3)}
.email-lock{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.disabled-block{border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px;opacity:.6;position:relative;margin-top:16px;background:var(--surface-2)}
.soon-tag{position:absolute;top:12px;right:14px;font-size:11px;color:var(--ink-3);background:var(--surface-3);border-radius:99px;padding:2px 10px}

/* ═════════ 成员页（C.15 / C.20） ═════════ */
.memfilter{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.memfilter .input{width:240px;height:32px}
.memfilter .fbtn{height:32px}
.rolebadge{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-radius:99px;padding:2px 10px;white-space:nowrap}
.inherited-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#6d28d9;background:#f5f3ff;border:1px solid #ddd6fe;border-radius:99px;padding:1px 8px;white-space:nowrap}
.pending-box{border:1px solid var(--line);border-radius:var(--radius-lg);margin-bottom:16px;background:var(--surface)}
.pending-head{display:flex;align-items:center;gap:8px;width:100%;padding:10px 14px;font-size:13px;color:var(--ink-2);text-align:left}
.pending-head:hover{background:var(--surface-2);border-radius:var(--radius-lg)}
.pending-head .chev{transition:transform .15s;margin-left:auto;color:var(--ink-4)}
.pending-box.open .pending-head .chev{transform:rotate(90deg)}
.pending-rows{padding:4px 14px 12px;display:none}
.pending-box.open .pending-rows{display:block}
.pending-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:13px;flex-wrap:wrap}
.pending-row:last-child{border-bottom:none}
.exp-orange{color:#d97709}
.tagbox{display:flex;flex-wrap:wrap;gap:6px;border:1px solid var(--line-strong);border-radius:var(--radius-md);padding:6px 8px;min-height:42px;background:var(--surface);cursor:text}
.tagbox:focus-within{border-color:var(--brand-500);box-shadow:0 0 0 3px var(--brand-50)}
.mtag{display:inline-flex;align-items:center;gap:6px;background:var(--brand-50);color:var(--brand-600);border:1px solid var(--brand-100);border-radius:5px;padding:2px 8px;font-size:12px;font-family:var(--font-mono)}
.mtag.invalid{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
.mtag .mx{display:inline-flex;width:16px;height:16px;align-items:center;justify-content:center;border-radius:3px;color:var(--brand-600)}
.mtag.invalid .mx{color:#b91c1c}
.mtag .mx:hover{background:rgba(0,0,0,.08)}
.tagbox input{flex:1;min-width:120px;border:none;outline:none;font-size:13px;background:transparent}
.cand-list{border:1px solid var(--line);border-radius:var(--radius-md);max-height:240px;overflow-y:auto;margin-top:8px}
.cand{display:flex;width:100%;align-items:center;gap:10px;padding:8px 12px;font-size:13px;text-align:left;border-bottom:1px solid #f5f5f5}
.cand:hover{background:var(--surface-2)}
.cand.on{background:var(--brand-50)}
.cand .cmeta{margin-left:auto;font-size:12px;color:var(--ink-4);white-space:nowrap}
.cand input{accent-color:var(--brand-500);width:15px;height:15px}
.resrow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #f0f0f0;font-size:13px}
.resrow:last-child{border-bottom:none}
.resrow .remail{font-family:var(--font-mono);font-size:12px}
.guest-warn{display:flex;align-items:center;gap:6px;font-size:12px;color:#b45309;background:#fffbeb;border:1px solid #fde68a;border-radius:var(--radius-md);padding:5px 10px;margin-top:10px}

/* ═════════ 标签管理（C.26） ═════════ */
.lrow{display:flex;align-items:center;gap:10px;padding:9px 8px;border-bottom:1px solid #f0f0f0;border-radius:var(--radius-md);background:var(--surface)}
.lrow.dragging{opacity:.4}
.lrow.inactive{opacity:.55;background:var(--surface-2)}
.lrow .grip{color:var(--ink-4);cursor:grab;display:inline-flex}
.lrow .lname{font-size:13px;min-width:90px}
.lrow .lhex{font-family:var(--font-mono);font-size:12px;color:var(--ink-3)}
.lrow .lcnt{font-size:12px;color:var(--ink-4);flex:1}
.swatches{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.swatch{width:22px;height:22px;border-radius:6px;border:2px solid transparent;cursor:pointer}
.swatch.on{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}

/* ═════════ 403 / 错误空态页（C.14 / C.36） ═════════ */
.errpage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:40px;max-width:480px;margin:0 auto;text-align:center}
.errpage .eicon{color:#d4d4d4;margin-bottom:8px}
.errpage h1{font-size:20px;font-weight:600}
.errpage .esub{font-size:13px;color:var(--ink-3);line-height:1.7}
.errpage .ebtns{display:flex;gap:10px;margin-top:18px}
.errpage .etrack{margin-top:14px;font-size:12px;color:var(--ink-4)}

/* ═════════ 骨架 / Gate 骨架 / 加载（C.14 / 各视图加载态） ═════════ */
.skel{background:var(--surface-3);border-radius:6px;animation:skelpulse 1.3s ease-in-out infinite}
.gateskel{padding:26px;display:flex;flex-direction:column;gap:14px}
.gateskel .row{display:flex;gap:14px}
.gateskel-btn{display:inline-flex;align-items:center;height:34px;min-width:96px;margin-left:auto;border-radius:var(--radius-md);vertical-align:middle}
.skel-card{height:118px}
.skel-line{height:12px}
.skel-row{height:38px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #f0f0f0}
.err-block{display:flex;flex-direction:column;align-items:center;gap:10px;padding:70px 0;color:var(--ink-3);text-align:center}
.err-block svg{color:#f87171}
.loader-full{position:fixed;inset:0;background:var(--bg);z-index:210;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.lf-logo{font-size:32px;opacity:.9}
.spinner{animation:spin 1s linear infinite;color:var(--brand-500)}
.lf-text{font-size:13px;color:var(--ink-3);opacity:0;animation:fadein .2s .8s forwards}

/* ═════════ 演示坞（不占产品 UI 语义） ═════════ */
.dock{position:fixed;left:14px;bottom:14px;z-index:230;display:flex;flex-direction:column;align-items:flex-start;gap:8px;max-height:calc(100vh - 60px)}
.dock-panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);padding:12px;width:284px;overflow-y:auto;max-height:calc(100vh - 120px)}
.dock-sec{font-size:11px;font-weight:600;color:var(--ink-4);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 6px}
.dock-sec:first-child{margin-top:0}
.dock-opts{display:flex;gap:4px;flex-wrap:wrap}
.ropt{flex:1;min-width:74px;border:1px solid var(--line-strong);border-radius:6px;padding:5px 4px;font-size:11px;color:var(--ink-2);text-align:center;background:var(--surface)}
.ropt:hover{background:var(--surface-2)}
.ropt.on{border-color:var(--brand-500);background:var(--brand-50);color:var(--brand-600);font-weight:600}
.dock-btn{display:flex;width:100%;align-items:center;gap:8px;min-height:28px;padding:4px 8px;border-radius:6px;font-size:12px;color:var(--ink-2);text-align:left}
.dock-btn:hover{background:var(--surface-2)}
.dock-links{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.dock-links a{font-size:11px;color:var(--ink-2);padding:3px 6px;border-radius:5px;text-decoration:none;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock-links a:hover{background:var(--surface-2);color:var(--brand-600);text-decoration:none}
.dock-cap{font-size:11px;color:var(--ink-4);margin-top:10px;padding:0 4px}
.dock-pill{background:#262626;color:#fff;font-size:12px;padding:0 12px;height:32px;border-radius:16px;display:inline-flex;align-items:center;gap:7px;box-shadow:var(--shadow-md)}
.dock-dot{width:6px;height:6px;border-radius:50%;background:var(--state-completed);animation:pulse 2s infinite}

/* ═════════ 动效 ═════════ */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes slide-in{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
@keyframes slide-x{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes skelpulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes peekin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes flashhl{0%,60%{background:#fef3c7}100%{background:transparent}}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-4px)}}
.fcb{display:inline-flex;width:15px;height:15px;border:1.5px solid var(--line-strong);border-radius:4px;align-items:center;justify-content:center;font-size:10px;color:#fff;flex-shrink:0;line-height:1}
.fcb.on{background:var(--brand-500);border-color:var(--brand-500)}
.mrow,.cand{cursor:pointer}
.cand.focus{outline:2px solid var(--brand-500);outline-offset:-2px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .lf-text{opacity:1}
}
@media (max-width:1023px){
  .statgrid{grid-template-columns:repeat(2,1fr)}
  .home-right{width:100%}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="drawer-root"></div>
<div id="notif-root"></div>
<div id="peek-root"></div>
<div id="pop-root"></div>
<div class="toast-wrap" id="toasts"></div>
<div id="sr-live" class="sr-only" aria-live="polite"></div>
<script>
/* ═════════ 工具 ═════════ */

/* ═════════ ErrorToast（C.36：三变体 / 追踪号 / 反馈 / hover 暂停 / 最多 3 条） ═════════ */
function toast(msg,o={}){
  const wrap=$('#toasts');
  while(wrap.children.length>=3)wrap.firstChild.remove();
  const t=document.createElement('div');
  t.className='toast toast-'+(o.variant||'info');
  t.setAttribute('role','status');
  t.setAttribute('aria-live',o.variant==='error'?'assertive':'polite');
  const iconN=o.variant==='error'?'xCircle':o.variant==='warning'?'alertTri':'checkCircle';
  t.innerHTML=icon(iconN,15)+'<div class="tx">'+esc(msg)+
    (o.requestId?'<div class="toast-track">追踪号 <span class="tid">'+REQ_ID_SHORT+'</span> <button class="tb" data-action="copy-reqid">📋 复制</button>'+(o.feedback?'<button class="tb" data-action="open-feedback">反馈</button>':'')+'</div>':'')+
    (o.action?'<div style="margin-top:6px"><button class="toast-action" data-action="toast-act">'+esc(o.action.label)+'</button></div>':'')+
    '</div><button class="tclose" data-action="toast-close" aria-label="关闭提示">'+icon('x',13)+'</button>';
  t._act=o.action;
  wrap.appendChild(t);
  const dur=o.duration||(o.requestId?10000:5000);
  let remaining=dur,paused=false,tmr;
  let start=Date.now();
  const arm=()=>{tmr=setTimeout(kill,remaining)};
  arm();
  t.addEventListener('mouseenter',()=>{
    if(paused)return;
    paused=true;
    clearTimeout(tmr);
    remaining-=(Date.now()-start);
    if(remaining<0)remaining=0;
  });
  t.addEventListener('mouseleave',()=>{
    if(!paused)return;
    paused=false;
    start=Date.now();
    arm();
  });
  function kill(){t.style.transition='opacity .25s';t.style.opacity='0';setTimeout(()=>t.remove(),260)}
  t._kill=kill;
}

/* Popconfirm（C.31 附件删除 / C.10 恢复默认头像 / C.15 撤销邀请） */
function popconfirm(anchor,title,okText,onOk){
  closePop();
  const r=anchor.getBoundingClientRect();
  const el=document.createElement('div');
  el.className='pconfirm';el.id='pop';el.setAttribute('role','alertdialog');el.setAttribute('aria-label',title);
  el.innerHTML='<div class="pt">'+esc(title)+'</div><div class="prow"><button class="btn btn-ghost btn-sm" data-action="pop-cancel">取消</button><button class="btn btn-danger btn-sm" data-action="pop-ok">'+esc(okText)+'</button></div>';
  document.body.appendChild(el);
  const w=240,h=el.offsetHeight||110;
  el.style.left=Math.min(Math.max(8,r.left),innerWidth-w-8)+'px';
  el.style.top=(r.top-h-8>8?r.top-h-8:r.bottom+8)+'px';
  el._onOk=onOk;
  el.querySelector('[data-action="pop-ok"]').focus();
}
function closePop(){const el=$('#pop');if(el)el.remove()}

/* ═════════ 路由 ═════════ */
function nav(h){if(location.hash===h)render();else location.hash=h}
function parseHash(){const h=(location.hash||'#/login').slice(1);const[q1,q2]=h.split('?');return{seg:q1.split('/').filter(Boolean),params:new URLSearchParams(q2||'')}}
const PUBLIC=['login','register','forgot-password','reset-password','invite','error'];
function q1of(seg){return'/'+seg.join('/')}
function buildQuery(p){const q=new URLSearchParams();for(const[k,v]of p.entries())if(v!=='')q.set(k,v);const s=q.toString();return s?'?'+s:''}
function setHashParam(key,val,replace){const{seg,params}=parseHash();if(val===''||val==null)params.delete(key);else params.set(key,val);const h='#'+q1of(seg)+buildQuery(params);if(replace)location.replace(h);else location.hash=h}
let focusKeep=null;
function routeRender(){return render.apply(null,arguments)}
function render(){
  const{seg,params}=parseHash();
  closeAllMenus();hidePeek();closePop();
  document.querySelectorAll('body > .menu').forEach(m=>m.remove()); /* 清理看板上下文菜单等临时挂载 */
  focusKeep=(document.activeElement&&document.activeElement.id)||null;

  if(!S.user&&!PUBLIC.includes(r)&&r!=='login'){location.replace('#/login?next='+encodeURIComponent(q1of(seg)));return}
  if(r==='register')renderRegister();
  else if(r==='forgot-password')renderForgot();
  else if(r==='reset-password')renderReset(params);
  else if(r==='invite')renderInvite(seg[1]);
  else if(r==='error')renderErrorPage(params.get('code')||'not_found');
  else if(r==='403')render403(params.get('perm'));
  else if(r==='login')renderLogin(params);

  else if(r==='p'){const p=projById(seg[1]);if(!p)return renderErrorPage('not_found');
    const view=seg[2]||'board';
    if(view==='settings'&&(S.role!=='PROJ_ADMIN')&&(seg[3]==='members'||seg[3]===undefined))

    else renderProject(p,view+(seg[3]?'/'+seg[3]:''));}
  else renderErrorPage('not_found');
  const pk=params.get('peekIssue');
  if(pk&&issueById(pk))openDrawer(pk,true);

      '<div class="strength-row"><span>密码强度</span><span id="rp-lvl"></span></div></div>'+
    '<div class="field"><label class="label" for="rp-pw2">确认新密码</label><div class="pw-wrap"><input class="input" id="rp-pw2" type="password" autocomplete="new-password" placeholder="再次输入新密码">'+
      '<button type="button" class="pw-eye" data-action="toggle-pw" data-target="rp-pw2" aria-label="显示密码">'+icon('eye',16)+'</button></div>'+

    '<button class="btn btn-primary" style="width:100%" type="submit">重置密码</button>'+
    '</form>');
  const upd=()=>{const p=$('#rp-pw').value,s=pwScore(p);const f=$('#rp-fill');
    f.style.width=s.lvl==='强'?'100%':s.lvl==='中'?'66%':p?'33%':'0';
    f.style.background=s.lvl==='强'?'var(--state-completed)':s.lvl==='中'?'#f59e0b':'var(--danger)';
    $('#rp-meter').setAttribute('aria-valuenow',s.lvl==='强'?'3':s.lvl==='中'?'2':p?'1':'0');
    $('#rp-lvl').textContent=s.lvl?'强度：'+s.lvl:''};
  upd();$('#rp-pw').addEventListener('input',upd);

let homeTab='all',homeRefreshing=false;
function myStats(){
  const wsOk=curWs().slug==='rabbitprojects';   /* 演示项目数据挂在 rabbitprojects 空间 */
  const mine=wsOk?S.issues.filter(i=>{const p=projById(i.pid);return p&&i.as.includes(DEMO_USER)}):[];
  const todo=mine.filter(i=>i.state==='unstarted'||i.state==='started');
  const dueToday=todo.filter(isDueToday);
  const overdue=todo.filter(isOverdue);
  const doneWeek=mine.filter(i=>i.state==='completed'&&i.updMin<10080);
  const trend=[];for(let d=6;d>=0;d--){const lo=d*1440,hi=(d+1)*1440;trend.push({day:dOffset(-d),n:doneWeek.filter(x=>x.updMin>=lo&&x.updMin<hi).length})}
  return{todo,dueToday,overdue,doneWeek,trend};
}
function greet(){const h=new Date().getHours();return h>=5&&h<11?'早上好':h>=11&&h<14?'中午好':h>=14&&h<18?'下午好':'晚上好'}
function cnDate(){const d=new Date();const w='日一二三四五六'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+w}
function statCard(iconN,label,val,cls,tabKey,aria){
  return '<div class="statcard" role="button" tabindex="0" aria-label="'+esc(aria)+'" data-action="home-stat" data-tab="'+tabKey+'">'+
    '<span class="sl">'+icon(iconN,16)+esc(label)+'</span><span class="sv '+(cls||'')+'">'+val+'</span></div>';
}

const dsEmpty=()=>S.demoState==='empty';
function trendCard(trend,ds){
  const total=trend.reduce((s,x)=>s+x.n,0);
  const max=Math.max(1,...trend.map(x=>x.n));
  const bars=trend.map((x,idx)=>'<span class="bar'+(x.n===0?' stub':'')+(idx===6?' today':'')+'" style="height:'+(x.n===0?2:Math.max(8,x.n/max*58))+'px" title="'+x.day.slice(5).replace('-','/')+' · 完成 '+x.n+' 项" aria-label="'+x.day+' 完成 '+x.n+' 项"></span>').join('');
  return '<div class="statcard" role="button" tabindex="0" aria-label="近 7 日共完成 '+total+' 项" data-action="home-stat" data-tab="done">'+
    '<span class="sl">'+icon('rotate',16)+'近 7 日完成</span><span class="sv">'+(ds==='empty'?0:total)+' <span style="font-size:12px;font-weight:400;color:var(--ink-3)">项</span></span>'+
    '<div class="barchart" role="img" aria-label="近 7 日共完成 '+total+' 项">'+bars+'</div></div>';
}
function homeRows(list){

    '<span class="pbadge" style="background:'+hashColor(p.identifier)+'">'+esc(p.identifier)+'</span>'+

function dueChip(i){
  if(isOverdue(i))return'<span class="overdue">'+icon('alert',11)+fmtMD(i.due)+' 逾期'+overdueDays(i)+'天</span>';
  if(isDueToday(i))return'<span class="due-today">'+icon('clock',11)+'今日到期</span>';
  return i.due?'<span class="mono" style="font-size:12px">'+fmtMD(i.due)+'</span>':'';

const overdueDays=i=>Math.max(1,Math.round((new Date(todayISO())-new Date(i.due))/86400000));

  if(ds==='loading')return'<div class="htabs">'+['全部','今日到期','已逾期','已完成(本周)'].map(()=>'<span class="skel" style="width:86px;height:32px;display:inline-block"></span>').join('')+'</div>'+Array(5).fill('<div class="skel" style="height:44px;margin-top:8px"></div>').join('');

/* ═════════ 创建项目 / 团队（C.3/C.8 基线弹窗） ═════════ */
let idDirty=false;
function openProjModal(){
  idDirty=false;
  openModal(
    '<div class="modal-head"><div class="modal-title">创建项目</div><button class="icon-btn" data-action="modal-close" aria-label="关闭">'+icon('x',16)+'</button></div>'+
    '<form id="proj-form" novalidate>'+
    '<div class="field"><label class="label" for="pj-name">项目名称 *</label><input class="input" id="pj-name" maxlength="255" placeholder="兔子项目管理"></div>'+
    '<div class="field"><label class="label" for="pj-id">项目标识符 *</label>'+
      '<div style="display:flex;gap:10px;align-items:center"><input class="input mono" id="pj-id" maxlength="5" placeholder="TZXM" style="width:150px;text-transform:uppercase">'+
      '<span class="badge-id" id="pj-preview" style="font-size:13px;padding:4px 10px">…-1</span></div>'+
      '<div class="err-text" id="pj-id-err" hidden></div>'+
      '<div class="hint" style="margin-top:6px">2-5 个大写字母，用于生成任务编号，<b>创建后不可修改</b></div></div>'+
    '<div class="field"><label class="label" for="pj-desc">项目描述</label><textarea class="input" id="pj-desc" rows="3" maxlength="2000" placeholder="企业级项目管理系统，对标 Ones 与 Plane"></textarea><div class="count-wrap"><span id="pj-cnt">0 / 2000</span></div></div>'+
    '<div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="modal-close">取消</button><button class="btn btn-primary" type="submit">创建项目</button></div></form>');
  const nm=$('#pj-name'),id=$('#pj-id');nm.focus();let tmr;
  nm.addEventListener('input',()=>{clearTimeout(tmr);tmr=setTimeout(()=>{if(!idDirty){const words=nm.value.trim().split(/[\s一-龥]+/).filter(w=>/^[a-zA-Z]/.test(w));id.value=words.map(w=>w[0]).join('').toUpperCase().slice(0,5);updPreview()}},200)});
  const updPreview=()=>{$('#pj-preview').textContent=(id.value||'…')+'-1'};
  id.addEventListener('input',()=>{idDirty=true;id.value=id.value.replace(/[^a-zA-Z]/g,'').toUpperCase();updPreview();$('#pj-id-err').hidden=true;id.classList.remove('invalid')});
  $('#pj-desc').addEventListener('input',e=>{$('#pj-cnt').textContent=e.target.value.length+' / 2000'});
  $('#proj-form').addEventListener('submit',e=>{e.preventDefault();
    const name=nm.value.trim(),identifier=id.value;
    if(!name){nm.classList.add('invalid');nm.focus();return}
    if(!/^[A-Z]{2,5}$/.test(identifier))return idErr('标识符须为 2-5 个字母');
    if(S.projects.some(pp=>pp.identifier===identifier)){
      let sug=identifier,sfx='A';while(S.projects.some(pp=>pp.identifier===sug)){sug=identifier+sfx;sfx=String.fromCharCode(sfx.charCodeAt(0)+1)}
      return idErr('标识符 '+identifier+' 已被占用，请换一个 <button type="button" class="btn btn-ghost" style="height:24px;padding:0 8px;font-size:12px;margin-left:6px" data-action="accept-sug" data-sug="'+sug+'">试试 '+sug+'</button>');}
    const pid='p'+Date.now();
    S.projects.push({id:pid,name,identifier,desc:$('#pj-desc').value.trim(),starred:false,archived:false,members:[S.user.name]});save();closeModal();toast('项目创建成功');nav('#/p/'+pid+'/board');});
  function idErr(html){const el=$('#pj-id-err');el.innerHTML=html;el.hidden=false;id.classList.add('invalid')}
}

/* ═════════ 邀请成员弹窗（C.16 · 560px · 结果四态） ═════════ */
let invTags=[],invRole='MEMBER',invSending=false;
function openInviteModal(){
  invTags=[];invRole='MEMBER';invSending=false;
  renderInviteModal();
}
function renderInviteModal(result){
  const roleDesc={MEMBER:'成员可参与协作；管理员可管理成员与项目',ADMIN:'成员可参与协作；管理员可管理成员与项目'};
  openModal(
  '<div class="modal-head"><div class="modal-title">邀请成员加入『'+esc(curWs().name)+'』</div><button class="icon-btn" data-action="invite-close" aria-label="关闭">'+icon('x',16)+'</button></div>'+
  '<div id="inv-body">'+(result?invResultHTML(result):
    '<div class="field"><span class="label" id="inv-lbl">邮箱（1-20 个）</span>'+
    '<div class="tagbox" id="inv-box" aria-labelledby="inv-lbl"></div>'+
    '<div class="hint" style="margin-top:6px">支持逗号 / 分号 / 空格 / 换行分隔，粘贴自动切分</div></div>'+
    '<div class="field"><span class="label">预设角色</span>'+
    '<div class="dd"><button class="fbtn" data-menu-btn="inv-role" aria-haspopup="listbox" aria-describedby="inv-role-desc">'+roleBadge(invRole)+' '+icon('chev',12)+'</button>'+
    '<div class="menu" id="inv-role" hidden>'+[['MEMBER','成员'],['ADMIN','管理员']].map(([k])=>'<button class="menu-item" data-action="inv-role" data-v="'+k+'">'+roleBadge(k)+'</button>').join('')+'</div></div>'+
    '<div class="hint" id="inv-role-desc" style="margin-top:6px">'+roleDesc[invRole]+'（aria-describedby 关联）</div></div>'+
    '<div class="modal-foot"><button class="btn btn-ghost" data-action="invite-close">取消</button>'+
    '<button class="btn btn-primary" id="inv-send" '+(invTags.length?'':'disabled')+'>'+(invSending?icon('spin',13)+'发送中…':'发送邀请（'+invTags.length+'）')+'</button></div>')+'</div>');
  if(result)return;
  const box=$('#inv-box');
  const renderBox=()=>{
    const full=invTags.length>=20;
    box.innerHTML=invTags.map((t,i)=>{
      const ok=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(t);
      return'<span class="mtag'+(ok?'':' invalid')+'">'+esc(t)+'<button type="button" class="mx" data-action="inv-del" data-i="'+i+'" aria-label="邮箱 '+esc(t)+'，按退格删除">'+icon('x',11)+'</button></span>'}).join('')+
      '<input id="inv-inp" '+(full?'disabled':'')+' placeholder="'+(full?'已达上限 20 个':'继续输入或粘贴…')+'" aria-label="邮箱输入" autocomplete="off">';
    const inp=$('#inv-inp');
    if(!inp)return;
    if(!full)inp.focus();
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===','||e.key===';'||e.key===' '){e.preventDefault();commit(inp.value)}
      else if(e.key==='Backspace'&&!inp.value){invTags.pop();renderBox();announce('已删除，剩余 '+invTags.length+' 个邮箱')}});
    inp.addEventListener('paste',e=>{e.preventDefault();commit((e.clipboardData||window.clipboardData).getData('text'))});
    $('#inv-send').disabled=!invTags.length||invSending;
    $('#inv-send').innerHTML=invSending?icon('spin',13)+'发送中…':'发送邀请（'+invTags.length+'）';
  };
  const commit=v=>{const parts=v.split(/[,;\s\n]+/).map(x=>x.trim()).filter(Boolean);
    for(const p of parts){if(invTags.length>=20)break;if(!invTags.includes(p))invTags.push(p)}
    renderBox();if(parts.length)announce('已添加 '+parts.length+' 个邮箱，共 '+invTags.length+' 个')};
  renderBox();
  $$('#inv-role [data-action="inv-role"]').forEach(b=>b.addEventListener('click',()=>{invRole=b.dataset.v;closeAllMenus();
    $('[data-menu-btn="inv-role"]').innerHTML=roleBadge(invRole)+' '+icon('chev',12);$('#inv-role-desc').textContent=roleDesc[invRole]}));
  $('#inv-send').addEventListener('click',()=>{
    invSending=true;renderInviteModal();
    setTimeout(()=>{
      const res=invTags.map(t=>{
        if(wsMembers().some(m=>m.email===t))return{email:t,st:'skip'};
        if(/^fail/i.test(t))return{email:t,st:'failed',msg:'该邮箱域名被网关拒绝'};
        if(/^direct/i.test(t))return{email:t,st:'added'};
        return{email:t,st:'invited'}});
      let firstNew=true;
      res.forEach(r=>{if(r.st==='added'&&firstNew){firstNew=false;S.wsmembers.push({name:r.email.split('@')[0],email:r.email,role:invRole,joined:'09-03 19:00'})}});
      save();invSending=false;renderInviteModal(res);},900);
  });
}
function invResultHTML(res){
  const ICONS={added:['checkCircle','#059669'],invited:['mail','#2563eb'],skip:['skipFwd','#6b7280'],failed:['xCircle','#dc2626']};
  const TXT={added:'已直接加入（'+WSROLES[invRole].n+'）',invited:'邮件已发送，7 天内有效',skip:'已是成员，已跳过',failed:''};
  return '<div class="modal-title" style="font-size:15px;margin-bottom:10px">邀请结果</div>'+
    res.map(r=>'<div class="resrow">'+icon(ICONS[r.st][0],16)+'<span class="remail">'+esc(r.email)+'</span>'+
    '<span style="color:'+ICONS[r.st][1]+';font-size:13px">'+TXT[r.st]+(r.st==='failed'?'：<span class="hint">'+esc(r.msg||'发送失败')+'</span>':'')+'</span>'+
    (r.st==='invited'&&S.smtpDegraded?'<button class="btn btn-ghost btn-sm" style="margin-left:auto" data-action="copy-invlink" data-email="'+esc(r.email)+'">复制邀请链接</button>':'')+'</div>').join('')+
    '<div class="modal-foot"><button class="btn btn-ghost" data-action="invite-again">继续邀请</button><button class="btn btn-primary" data-action="invite-close">完成</button></div>';
}

function filtersFromParams(p){

  return{q:p.get('q')||'',st:arr(p.get('st')),ty:arr(p.get('ty')),pr:arr(p.get('pr')),lb:arr(p.get('lb')),as:arr(p.get('as')),cr:arr(p.get('cr')),due:p.get('due')||'',sort:p.get('sort')||'seq:asc'};
}
function writeFilters(F,{dropSt}={}){
  const{seg}=parseHash();
  const p=new URLSearchParams();
  if(F.q)p.set('q',F.q);
  if(!dropSt&&F.st.length)p.set('st',F.st.join(','));
  if(F.ty.length)p.set('ty',F.ty.join(','));
  if(F.pr.length)p.set('pr',F.pr.join(','));
  if(F.lb.length)p.set('lb',F.lb.join(','));
  if(F.as.length)p.set('as',F.as.join(','));
  if(F.cr.length)p.set('cr',F.cr.join(','));
  if(F.due)p.set('due',F.due);
  if(F.sort!=='seq:asc')p.set('sort',F.sort);
  const pk=parseHash().params.get('peekIssue');if(pk)p.set('peekIssue',pk);
  location.replace('#'+q1of(seg)+(p.toString()?'?'+p.toString():''));
}
function applyFilters(list,F){
  return list.filter(i=>{
    if(F.st.length&&!F.st.includes(i.state))return false;
    if(F.ty.length&&!F.ty.includes(i.type))return false;
    if(F.pr.length&&!F.pr.includes(i.pri))return false;
    if(F.lb.length&&!i.labels.some(l=>F.lb.includes(l)))return false;
    if(F.as.length){const me=F.as.includes('me'),names=F.as.filter(x=>x!=='me');
      if(!((me&&i.as.includes(DEMO_USER))||i.as.some(a=>names.includes(a))))return false}
    if(F.cr.length&&!F.cr.includes(i.createdBy))return false;
    if(F.due&&!dueMatch(i,F.due))return false;
    if(F.q){const q=F.q.trim().toLowerCase();
      if(!i.name.toLowerCase().includes(q)&&!(q.length>=3&&(i.desc||'').toLowerCase().includes(q)))return false}
    return true});
}
function dueMatch(i,d){
  if(d==='today')return i.due===todayISO();
  if(d==='week'){if(!i.due)return false;const t=new Date();const dow=(t.getDay()+6)%7;return i.due>=dOffset(-dow)&&i.due<=dOffset(6-dow)}
  if(d==='overdue')return isOverdue(i);
  if(d==='next7')return i.due&&i.due>=todayISO()&&i.due<=dOffset(7);
  if(d.indexOf('..')>0){const ab=d.split('..');return i.due&&i.due>=ab[0]&&i.due<=ab[1]}
  return true;
}
function sortList(list,F){
  const[col,dir]=F.sort.split(':');const mul=dir==='desc'?-1:1;
  const cmp={seq:(a,b)=>(a.seq-b.seq)*mul,
    priority:(a,b)=>(PRIS[a.pri].w-PRIS[b.pri].w)*mul,
    due:(a,b)=>((a.due||'9999')<(b.due||'9999')?-1:(a.due||'9999')>(b.due||'9999')?1:0)*mul,
    updated:(a,b)=>(b.updMin-a.updMin)*mul}[col]||( (a,b)=>(a.seq-b.seq)*mul);
  return[...list].sort(cmp);
}

function wireBoard(p,F){

let inPeek=false;
function moveIssue(id,state,idx,fromState){
  const i=issueById(id);if(!i)return;
  const col=S.issues.filter(x=>x.pid===i.pid&&x.state===state&&x.id!==id&&!x.parent).sort((a,b)=>a.sort-b.sort);
  let sort;
  if(idx>=col.length)sort=col.length?Math.max(...col.map(x=>x.sort))+65535:65535;
  else if(idx<=0)sort=col.length?Math.min(...col.map(x=>x.sort))/2:65535;
  else sort=(col[idx-1].sort+col[idx].sort)/2;
  i.state=state;i.sort=sort;i.updMin=0;save();
  announce('已移动 '+issueKey(i)+' 到 '+STATES[state].name);
  if(state==='cancelled'){
    toast('已取消，可拖回恢复',{variant:'warning',duration:5000,action:{label:'撤销',fn:()=>{i.state=fromState;i.updMin=0;save();announce('已恢复 '+issueKey(i)+' 到 '+STATES[fromState].name);toast('已恢复');render()}}});
    announce('任务已取消');
  } else toast('已移动 '+issueKey(i)+' 到 '+STATES[state].name);
  render();
}

/* Hover Peek（C.30：400ms 浮入 / 340px / 锚定右侧越界翻转 / 退出瞬时） */
function showPeek(cardEl){
  const i=issueById(cardEl.dataset.card);if(!i)return;
  hidePeek(true);
  const t=typeById(i.type);
  const labels=i.labels.map(id=>lblById(id)).filter(Boolean);
  const el=document.createElement('div');
  el.className='peek';el.id='peek';el.setAttribute('role','dialog');el.setAttribute('aria-labelledby','peek-title');
  const desc=(i.desc||'').replace(/<[^>]+>/g,'');
  el.innerHTML='<div class="peek-head"><span class="pk">'+esc(issueKey(i))+'</span> · '+icon(t.icon,12)+' '+t.name+' · '+(i.pri!=='none'?'<span class="dot" style="background:'+PRIS[i.pri].c+';display:inline-block"></span> '+i.pri:'无优先级')+
    '<button class="icon-btn" style="margin-left:auto;width:24px;height:24px" data-action="peek-open" data-id="'+i.id+'" aria-label="打开详情" title="打开详情">'+icon('maximize',13)+'</button></div>'+
    '<div class="peek-title" id="peek-title">'+esc(i.name)+'</div>'+
    (desc?'<div class="peek-desc">'+esc(desc.slice(0,200))+(desc.length>200?'…':'')+(desc.length>200?'<button class="link-btn" style="font-size:12px;margin-left:4px" data-action="peek-open" data-id="'+i.id+'">展开 ▾</button>':'')+'</div>':'')+
    (labels.length?'<div class="peek-row">'+labels.map(l=>'<span class="lbl-tag" style="background:'+l.color+'">'+esc(l.name)+'</span>').join('')+'</div>':'')+
    (i.subN?'<div class="peek-row"><span class="subbar" style="width:64px"><span class="f'+(i.subM===i.subN?' done':'')+'" style="display:block;height:100%;width:'+(i.subM/i.subN*100)+'%;background:'+(i.subM===i.subN?'#10B981':'#3f76ff')+';border-radius:4px"></span></span>子任务 '+i.subM+'/'+i.subN+'</div>':'')+
    (i.att?'<div class="peek-row">'+icon('clip',12)+' 附件 '+i.att+'</div>':'')+
    (i.start||i.due?'<div class="peek-row'+(isOverdue(i)?'" style="color:var(--danger)':'')+'">📅 '+(i.start||'—')+' → '+(i.due||'—')+(isOverdue(i)?' ⏰ 逾期 '+overdueDays(i)+' 天':'')+'</div>':'')+
    '<div class="peek-row">'+icon('user',12)+' '+esc(i.createdBy)+' 创建于 '+fmtAbs(i.crtMin).split(' ')[0]+'</div>';
  $('#peek-root').appendChild(el);
  const r=cardEl.getBoundingClientRect();
  let left=r.right+8;
  if(left+340>innerWidth-8)left=Math.max(8,r.left-348);
  el.style.left=left+'px';
  el.style.top=Math.min(r.top,innerHeight-el.offsetHeight-12)+'px';
  cardEl.setAttribute('aria-expanded','true');
  peekIssue=i.id;
  el.addEventListener('mouseenter',()=>inPeek=true);
  el.addEventListener('mouseleave',()=>{inPeek=false;hidePeek()});
}
function hidePeek(keep){

}

const stripKey=(p,k)=>{const q=new URLSearchParams();for(const[a,b]of p.entries())if(a!==k)q.set(a,b);return q};
let drawerPushedHash=false;
function openDrawer(id,fromURL){

function wireDrawer(i,canEdit){
  const saved=()=>{const c=$('#dw-saved');if(!c)return;c.classList.add('show');setTimeout(()=>c.classList.remove('show'),1800)};
  const ttl=$('#dw-title');
  if(ttl)ttl.addEventListener('click',()=>{
    if(!canEdit)return;
    ttl.outerHTML='<input class="d-title-input" id="dw-title-in" value="'+esc(i.name)+'">';
    const inp=$('#dw-title-in');inp.focus();inp.select();
    const commit=()=>{const v=inp.value.trim();if(v&&v!==i.name){i.name=v;i.updMin=0;save()}drawDrawer(i);saved()};
    inp.addEventListener('blur',commit);
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')inp.blur();if(e.key==='Escape'){inp.removeEventListener('blur',commit);drawDrawer(i)}});});
  const de=$('#dw-desc');
  if(de)de.addEventListener('blur',e=>{if(e.target.innerHTML!==(i.desc||'')){i.desc=e.target.innerHTML;i.updMin=0;save();saved()}});
  $$('[data-action="dw-set"]').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.k;let v=b.dataset.v;
    if(k==='as')i.as=v?[v]:[];else i[k]=v;
    i.updMin=0;save();closeAllMenus();drawDrawer(i);saved();}));
  $$('#dw-lbl [data-action="dw-lbl"]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.id;
    if(i.labels.includes(id))i.labels=i.labels.filter(x=>x!==id);else i.labels.push(id);
    i.updMin=0;save();drawDrawer(i);saved()}));
  $$('[data-action="dw-lbl-x"]').forEach(b=>{
    b.addEventListener('keydown',e=>{if(e.key==='Backspace'||e.key==='Enter'){e.preventDefault();i.labels=i.labels.filter(x=>x!==b.dataset.id);save();drawDrawer(i);saved()}});});
  const ds=$('#dw-start'),dd=$('#dw-due');
  if(ds)ds.addEventListener('change',()=>{i.start=ds.value||null;if(dd)dd.min=ds.value||'';i.updMin=0;save();saved();drawDrawer(i)});
  if(dd)dd.addEventListener('change',()=>{i.due=dd.value||null;i.updMin=0;save();saved();drawDrawer(i)});
  const si=$('#sub-inp');
  if(si)si.addEventListener('keydown',e=>{
    if(e.key==='Enter'){const v=si.value.trim();if(!v)return;
      const sub={id:'i'+i.pid+'-s'+Date.now(),pid:i.pid,seq:nextSeq(i.pid),name:v,desc:'',state:'unstarted',type:i.type,pri:'none',as:[],labels:[],start:null,due:null,createdBy:S.user.name,updMin:0,crtMin:0,subM:0,subN:0,att:0,parent:i.id,sort:65535};
      S.issues.push(sub);save();drawDrawer(i);}
    if(e.key==='Escape')si.value='';});
  if(drawerState.tab==='comments')wireComments(i);
  if(drawerState.tab==='attach')wireAttach(i,canEdit);
}

let mentionState={open:false,idx:0,items:[],trigger:null};
function wireComments(i){
  const rows=S.comments[i.id]=S.comments[i.id]||[];
  const ed=$('#ce-inp');
  if(ed){
    ed.addEventListener('input',()=>{$('#ce-cnt').textContent=Math.min(5000,ed.textContent.length)+'/5000';detectMention(ed,i)});
    ed.addEventListener('click',()=>detectMention(ed,i));
    ed.addEventListener('keydown',e=>{
      if(mentionState.open){
        if(e.key==='ArrowDown'){e.preventDefault();mentionMove(1);return}
        if(e.key==='ArrowUp'){e.preventDefault();mentionMove(-1);return}
        if(e.key==='Enter'){e.preventDefault();mentionPick();return}

      }
      if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();publishComment(i)}
    });
    $('#ce-send').addEventListener('click',()=>publishComment(i));

    S.commentLoaded[id]=(S.commentLoaded[id]||0)+2;save();drawDrawer(i);});

const pickCommentBy=()=>pick(['王五','梁工']);
function publishComment(i){
  const ed=$('#ce-inp');if(!ed)return;
  const html=ed.innerHTML.trim();if(!html)return;

function startEditComment(i,cid){
  const rows=S.comments[i.id];const c=rows.find(x=>x.id===cid);if(!c)return;
  const remain=Math.max(0,15*60-c.mins);
  const mm=Math.floor(remain/60),ss=remain%60;

  rowEl.innerHTML='<div class="chead"><b>'+esc(c.by)+'</b><span>编辑中 · 剩余 <span class="edit-timer" data-remain="'+remain+'">'+pad2(mm)+':'+pad2(ss)+'</span> ⏱</span><span class="cops"><button class="btn btn-ghost btn-sm" data-action="ce-cancel">取消</button><button class="btn btn-primary btn-sm" data-action="ce-save" data-cid="'+cid+'">保存</button></span></div>'+
  '<div class="ceditor" style="margin-top:8px"><div class="ce-content" id="ce-edit" contenteditable="true" role="textbox" aria-label="编辑评论">'+c.text+'</div></div>';
  const ta=$('#ce-edit');ta.focus();

    if(r<=30)t.classList.add('warn');

  rowEl.querySelector('[data-action="ce-cancel"]').addEventListener('click',()=>drawDrawer(i));

const REMOVED_MENTION_NAMES=new Set(['梁工']);
function applyRemovedMentionTooltips(){
  if(!S.mentionedRemoved)return;
  document.querySelectorAll('.crow .ctext .mention').forEach(el=>{
    const name=(el.textContent||'').replace(/^@/,'').trim();

      el.setAttribute('data-removed-mention','1');
    }
  });
