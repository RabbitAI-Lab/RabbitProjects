/* ═════════ 设计 token · 与 sprint-0/1 冻结基线一致 ═════════ */

  --state-unstarted:#9ca3af;--state-started:#3b82f6;--state-completed:#10b981;--state-cancelled:#6b7280;

}

.cell-title{color:var(--ink)}
.cell-dim{color:var(--ink-4)}
.title-cell .inl-tags{display:inline-flex;gap:4px;margin-left:8px;vertical-align:1px}
.lbl-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:0 7px;border-radius:4px;color:#fff;white-space:nowrap;height:18px}
.lbl-tag.gray{background:var(--surface-3);color:var(--ink-3)}
.pri-cell{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.state-badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);white-space:nowrap}
/* 树形专用 */
.tog{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-3);border-radius:3px;transition:transform .15s ease;vertical-align:-3px;margin-right:3px}
.tog.open{transform:rotate(90deg)}
.tog.spin svg{animation:rot 1s linear infinite}
.tree-pad{display:inline-block}
.guide{position:relative}
.guide::before{content:"";position:absolute;top:0;bottom:0;left:-1px;border-left:1px solid var(--line)}
.row-plus{opacity:0;transition:opacity .12s;margin-left:6px;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;color:var(--ink-3);vertical-align:-6px}
tr:hover .row-plus{opacity:1}
.row-plus:hover{background:var(--surface-2);color:var(--ink)}
.row-grip{opacity:0;cursor:grab;color:var(--ink-4);margin-left:4px;vertical-align:-4px}
tr:hover .row-grip{opacity:1}
tr.dragging{opacity:.5}
tr.dragging .row-grip{cursor:grabbing}
.quick-sub{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;margin:2px 0 2px 44px;border:1px dashed var(--line-strong);border-radius:var(--radius-md);color:var(--ink-3);transition:border-color .12s,background .12s}
.quick-sub:focus-within{border:1px solid var(--brand-500);background:var(--surface);color:var(--ink)}
.quick-sub input{flex:1;border:none;background:transparent;outline:none;font-size:13px;color:var(--ink)}
.quick-sub .depth-cap{font-size:12px;color:var(--ink-4)}
/* 子任务进度圆环（T004 §3.1 · R2 裁决） */
.subprog{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ring{width:16px;height:16px;border-radius:50%;border:2px solid var(--surface-3);border-top-color:var(--brand-500);display:inline-block}
.ring.half-0{border-top-color:var(--state-unstarted)}
.ring.full{border:2px solid var(--state-completed);background:var(--state-completed)}
/* 依赖图标（T005 §3.4） */
.link-ico{color:var(--ink-4);margin-right:5px;vertical-align:-2px}
.link-ico.blocked{color:var(--warn)}
/* 工时列（T006 §3.3） */
.wl-cell{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.wl-cell.over{color:var(--danger)}
.wl-cell.none{color:var(--ink-4)}
/* 执行人堆叠（T007 §3.3 · 20px） */
.avstack{display:inline-flex;align-items:center}
.avstack .avatar{border:2px solid var(--surface);margin-left:-6px}
.avstack .avatar:first-child{margin-left:0}
.avstack .more-n{width:20px;height:20px;border-radius:50%;background:var(--surface-3);color:var(--ink-3);font-size:10px;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--surface);margin-left:-6px}
.unassign-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-3);background:var(--surface-2);border-radius:99px;padding:1px 9px}
.unassign-chip.dashed{border:1.5px dashed var(--line-strong);background:transparent}
.claim-btn{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-3);vertical-align:-6px;margin-left:4px}
.claim-btn:hover{background:var(--brand-50);color:var(--brand-600)}
/* 归档行（T009 §3.2） */
tr.archived-row td{opacity:.6}
tr.archived-row:hover td{opacity:.85}
.arch-ico{color:var(--ink-4);margin-right:5px;vertical-align:-2px}
/* 动态列值渲染（T008 §3.5） */
.cfv{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.cfbar{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* ═════════ 看板（C.29 基线 + Sprint-2 角标/列头计数） ═════════ */
.board{flex:1;display:flex;gap:16px;overflow-x:auto;overflow-y:hidden;padding:16px 20px;min-height:0}
.bcol{width:280px;min-width:280px;display:flex;flex-direction:column;background:var(--surface-2);border-radius:var(--radius-lg);max-height:100%}
.bcol-head{height:40px;display:flex;align-items:center;gap:8px;padding:0 12px;flex-shrink:0}
.bcol-name{font-size:13px;font-weight:500}
.bcol-count{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-4);margin-left:auto;background:var(--surface-3);border-radius:99px;padding:0 8px}
.bcol-blocked-sub{font-size:11px;color:var(--amber-ink);padding:0 12px 6px;flex-shrink:0}
.bcol.shaking{animation:shake .4s ease}
.bcol-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 8px 8px;display:flex;flex-direction:column;gap:8px;min-height:56px}
.bcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:9px 12px;box-shadow:var(--shadow-sm);cursor:grab;transition:box-shadow .15s,border-color .15s,opacity .15s,transform .3s var(--ease-spring)}
.bcard::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--bar,var(--state-unstarted))}
.bcard:hover{box-shadow:var(--shadow-md);border-color:var(--line-strong)}
.bcard.dragging{opacity:.4;transform:scale(.98)}
.bcard.bounce-back{animation:bounceback .3s var(--ease-spring)}
.bcard-title{font-size:13px;color:var(--ink);line-height:1.45;display:flex;gap:5px;align-items:flex-start}
.bcard-meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.bcard-blocked-badge{position:absolute;top:6px;right:6px;color:var(--warn);font-size:13px}
.bcard-av{position:absolute;right:8px;bottom:8px}
.unassign-ghost{display:inline-flex;color:var(--ink-4)}

/* ═════════ 任务详情抽屉（C.6/C.23 基线 + Sprint-2 分区） ═════════ */
.drawer-scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:70;animation:fade .15s ease}
.drawer{position:fixed;top:0;right:0;bottom:0;width:720px;max-width:100vw;background:var(--surface);box-shadow:var(--shadow-lg);z-index:71;display:flex;flex-direction:column;animation:slidein .2s var(--ease-spring)}
.drawer.wide{width:min(960px,calc(100vw - 48px))}
.drawer-head{display:flex;align-items:flex-start;gap:10px;padding:16px 20px 10px;border-bottom:1px solid var(--line);flex-shrink:0}
.drawer-body{flex:1;overflow-y:auto;padding:4px 20px 20px}
.dkey{font-family:var(--font-mono);font-size:12px;color:var(--ink-3);cursor:pointer;white-space:nowrap}
.dtitle{font-size:17px;font-weight:600;width:100%;border:1px solid transparent;border-radius:6px;padding:2px 6px;margin-left:-6px}
.dtitle:hover{border-color:var(--line)}
.dtitle:focus{outline:none;border-color:var(--brand-500);box-shadow:0 0 0 3px var(--brand-50)}
.dtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 20px;flex-shrink:0}
.dtab{height:38px;padding:0 12px;font-size:13px;color:var(--ink-2);border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px}
.dtab.active{color:var(--brand-600);font-weight:500;border-bottom-color:var(--brand-500)}
.prop-row{display:grid;grid-template-columns:80px 1fr;align-items:center;gap:10px;min-height:34px;padding:2px 0}
.prop-label{font-size:13px;color:var(--ink-3)}
.dsec{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.dsec-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dsec-title{font-size:13px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.dsec-head .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.dsec-toggle{width:26px;height:26px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-3);transition:transform .15s}
.dsec-toggle.open{transform:rotate(180deg)}
.dsec-toggle:hover{background:var(--surface-2)}
/* 子任务分区（T004 §3.4） */
.subrow{display:flex;align-items:center;gap:8px;min-height:32px;padding:3px 4px;border-radius:6px}
.subrow:hover{background:var(--bg)}
.subrow .cb{width:15px;height:15px;accent-color:var(--state-completed);flex-shrink:0;cursor:pointer}
.subrow .nm{flex:1;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subrow .nm.done{text-decoration:line-through;color:var(--ink-3)}
.subrow .grip{color:var(--ink-4);cursor:grab;opacity:0}
.subrow:hover .grip{opacity:1}
.add-sub-row{display:flex;align-items:center;gap:8px;height:32px;padding:0 4px;color:var(--ink-3)}
.add-sub-row input{flex:1;border:none;background:transparent;outline:none;font-size:13px}
.add-sub-row:focus-within{background:var(--bg);border-radius:6px}
/* 关联分区（T005 §3.1） */
.relgroup{margin-bottom:10px}
.relgroup-title{font-size:12px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:6px;margin-bottom:4px}
.relrow{display:flex;align-items:center;gap:8px;min-height:32px;padding:2px 8px;border-radius:6px;font-size:13px}
.relrow:hover{background:var(--bg)}
.relrow .rk{font-family:var(--font-mono);font-size:12px;color:var(--ink-3)}
.relrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.relrow .del{opacity:0;width:24px;height:24px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-4)}
.relrow:hover .del{opacity:1}
.relrow .del:hover{color:var(--danger);background:#fef2f2}
.dup-badge{font-size:11px;color:var(--ink-3);background:var(--surface-2);border-radius:4px;padding:0 6px;margin-left:6px}
.rel-count-amber{color:var(--amber-ink)!important}
/* 工时分区（T006 §3.1） */
.wl-grid{display:grid;grid-template-columns:80px 1fr;gap:10px;align-items:center}
.wl-main{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.wl-spent{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.wl-spent.over{color:var(--danger)}
.wl-sub{font-size:12px;color:var(--ink-3)}
.wl-toggle{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-3);cursor:pointer;user-select:none}
.wl-toggle input{accent-color:var(--brand-500)}
.wl-bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin:8px 0 2px}
.wl-bar-fill{height:100%;border-radius:4px;background:var(--brand-500);transition:width .3s}
.wl-bar-fill.over{background:var(--danger)}
.wl-pct{font-size:11px;color:var(--ink-3)}
.wlog-row{display:flex;align-items:center;gap:10px;min-height:34px;padding:3px 6px;border-radius:6px;font-size:13px}
.wlog-row:hover{background:var(--bg)}
.wlog-row .dt{font-family:var(--font-mono);font-size:12px;color:var(--ink-3);width:86px}
.wlog-row .mins{font-variant-numeric:tabular-nums;font-weight:500;width:44px;text-align:right}
.wlog-row .note{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-3)}
/* 执行人区（T007 §3.1） */
.asg-wrap{display:flex;align-items:center;gap:8px;min-height:34px}
.asg-stack{display:inline-flex;align-items:center}
.asg-stack .avatar{width:24px;height:24px;border:2px solid #fff;margin-left:-8px;box-shadow:0 0 0 1px var(--line)}
.asg-stack .avatar:first-child{margin-left:0}
.asg-stack .more-n{width:24px;height:24px;border-radius:50%;background:var(--surface-3);color:var(--ink-3);font-size:10px;display:inline-flex;align-items:center;justify-content:center;border:2px solid #fff;margin-left:-8px}
.asg-names{font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.asg-empty{display:inline-flex;align-items:center;gap:8px;border:1.5px dashed var(--line-strong);border-radius:8px;padding:3px 10px 3px 6px;color:var(--ink-3);font-size:12px}
/* 动态表单折叠区（T008 §3.4） */
.cff-row{display:grid;grid-template-columns:80px 1fr;gap:10px;align-items:center;min-height:34px}
.cff-row .req{color:var(--danger);margin-left:2px}
.cff-help{color:var(--ink-4);cursor:help}
.autoinc-ro{font-family:var(--font-mono);font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:4px;padding:1px 8px}
/* 动态 Tab 时间线（T010 §3.1） */
.tl-day{position:sticky;top:0;background:var(--surface);font-size:12px;color:var(--ink-4);padding:10px 0 6px;border-bottom:1px solid var(--line);z-index:2;margin-top:8px}
.tl-day:first-child{margin-top:0}
.tl-epoch{position:relative;padding:8px 0 8px 20px;border-left:2px solid var(--surface-3);margin-left:8px}
.tl-epoch-head{display:flex;align-items:center;gap:8px;font-size:13px}
.tl-time{font-family:var(--font-mono);font-size:12px;color:var(--ink-3);width:44px}
.tl-actor{font-weight:500}
.tl-actor.sys{color:var(--ink-3)}
.tl-summary{font-size:13px;color:var(--ink-2)}
.tl-field{font-size:12.5px;color:var(--ink-3);padding:3px 0 0 22px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tl-field .fname{color:var(--ink-2)}
.tl-field .old{text-decoration:line-through;color:var(--ink-4)}
.tl-field .new{font-weight:600;color:var(--ink)}
.tl-loadmore{display:flex;justify-content:center;padding:16px 0}
/* 归档只读横幅（T009 §3.2） */
.arch-banner{display:flex;align-items:center;gap:8px;background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber-ink);border-radius:var(--radius-lg);padding:8px 14px;font-size:13px;margin:10px 0 2px}

/* ═════════ 全屏树抽屉（T004 §3.3） ═════════ */
.tree-node{display:flex;align-items:center;gap:10px;min-height:40px;padding:4px 12px;border-radius:8px;font-size:13px;cursor:pointer}
.tree-node:hover{background:var(--bg)}
.tree-node .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-stats{font-family:var(--font-mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.trunc-bar{background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber-ink);border-radius:var(--radius-lg);padding:8px 14px;font-size:13px;margin:10px 0;display:flex;align-items:center;gap:8px}

/* ═════════ 弹层内组件 ═════════ */
.opt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.opt-cell{border:1px solid var(--line-strong);border-radius:8px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--ink-2);cursor:pointer;transition:border-color .12s,background .12s}
.opt-cell:hover{border-color:var(--brand-500);background:var(--brand-50)}
.opt-cell.sel{border-color:var(--brand-500);background:var(--brand-50);color:var(--brand-600);font-weight:600}
.fielddef-row{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-bottom:6px;background:var(--surface)}
.fielddef-row .colorswatch{width:14px;height:14px;border-radius:4px;cursor:pointer;flex-shrink:0}
.cp-pop{position:absolute;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow-lg);padding:8px;z-index:80;width:168px}
.cp-pop .sw{width:20px;height:20px;border-radius:4px;cursor:pointer;border:2px solid transparent}
.cp-pop .sw.sel{border-color:var(--ink)}
.chips-keep{display:flex;flex-wrap:wrap;gap:6px}
.kchip{display:inline-flex;align-items:center;gap:4px;background:var(--brand-50);color:var(--brand-600);border-radius:99px;padding:2px 10px;font-size:12px}
.kchip .cx{cursor:pointer;border-radius:50%;width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center}
.kchip .cx:hover{background:var(--brand-100)}
.qchips{display:flex;gap:6px;flex-wrap:wrap}
.qchip{border:1px solid var(--line-strong);border-radius:99px;padding:2px 10px;font-size:12px;color:var(--ink-2)}
.qchip:hover{border-color:var(--brand-500);color:var(--brand-600)}
.qchip.sel{background:var(--brand-500);border-color:var(--brand-500);color:#fff}
.searchres{border:1px solid var(--line);border-radius:8px;max-height:200px;overflow-y:auto;margin-top:6px}
.searchres .srow{display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:13px;cursor:pointer}
.searchres .srow:hover{background:var(--bg)}
.searchres .srow.disabled{color:var(--ink-4);cursor:not-allowed}
.searchres .srow.disabled:hover{background:none}
.sem-tip{display:flex;gap:8px;align-items:flex-start;background:var(--brand-50);color:var(--brand-600);border-radius:8px;padding:8px 12px;font-size:12.5px;margin-top:14px}
.blocked-list .brow{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:13px}
.blocked-list .brow:hover{border-color:var(--brand-100);background:var(--brand-50)}
.notice-strip{display:flex;gap:8px;align-items:flex-start;background:var(--surface-2);border-radius:8px;padding:8px 12px;font-size:12.5px;color:var(--ink-3);margin-top:14px}
.preview-line{font-size:12.5px;color:var(--ink-3);background:var(--surface-2);border-radius:6px;padding:6px 10px;margin-top:12px}

/* ═════════ 字段管理页（T008 §3.1） ═════════ */
.fields-tbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fields-tbl th{font-size:11px;font-weight:600;color:var(--ink-4);text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.fields-tbl td{font-size:13px;padding:10px 12px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
.fields-tbl tr:last-child td{border-bottom:none}
.fields-tbl tr.frow:hover{background:var(--bg)}
.fields-tbl tr.frow.inactive td{opacity:.5}
.fields-tbl tr.frow.dragover td{border-top:2px solid var(--brand-500)}
.ftype-chip{font-size:12px;color:var(--ink-2);background:var(--surface-2);border-radius:4px;padding:1px 8px;white-space:nowrap}
.scope-chip{font-size:11px;color:var(--ink-3);background:var(--surface-2);border-radius:4px;padding:0 6px;margin-right:4px}
.mark{font-size:12px;color:var(--ink-4)}
.mark.on{color:var(--ink-2)}
.idx-dot{width:8px;height:8px;border-radius:50%;background:var(--brand-500);display:inline-block;margin-right:5px}
.field-cap{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);margin-bottom:12px}
.field-cap .n{font-variant-numeric:tabular-nums}
.field-cap .n.amber{color:var(--amber-ink);font-weight:600}
.fold-sec{margin-top:18px}
.fold-head{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;padding:6px 0}
.fold-head .cnt{font-size:12px;color:var(--ink-4)}
.import-note{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3);padding:6px 10px;background:var(--surface-2);border-radius:8px;margin-top:10px}
.delete-stats{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:10px 14px;font-size:13px;color:#b91c1c;margin:10px 0}
.delete-stats ul{margin:6px 0 0 18px;color:var(--ink-2)}

/* ═════════ admin 死信页（T010 §3.2 · O2 自定布局） ═════════ */
.dlq-tbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dlq-tbl th{font-size:11px;font-weight:600;color:var(--ink-4);text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface);white-space:nowrap}
.dlq-tbl td{font-size:13px;padding:10px 12px;border-bottom:1px solid #f0f0f0;vertical-align:top}
.dlq-tbl tr:hover td{background:var(--bg)}
.ekey{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);word-break:break-all;max-width:220px}
.retry-n{font-variant-numeric:tabular-nums}
.retry-n.maxed{color:var(--danger);font-weight:600}

/* ═════════ 拦截对话框（T005 §3.3） ═════════ */
.alertdlg{border-left:4px solid var(--warn)}
.force-box{background:var(--surface-2);border-radius:8px;padding:10px 12px;margin-top:12px}
.force-box textarea{min-height:60px}
.n-409{color:var(--amber-ink)}

/* ═════════ DOCK 演示面板（基线模式） ═════════ */
.dock{position:fixed;left:12px;bottom:12px;z-index:200;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow-lg);width:264px;font-size:12px}
.dock-head{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);color:var(--ink-2);font-weight:600;cursor:pointer;user-select:none}
.dock-body{padding:8px 12px 12px;max-height:52vh;overflow-y:auto}
.dock-cap{font-size:10px;font-weight:600;color:var(--ink-4);text-transform:uppercase;letter-spacing:.05em;margin:8px 0 4px}
.dock-item{display:flex;width:100%;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;color:var(--ink-2);text-align:left;min-height:26px}
.dock-item:hover{background:var(--surface-2)}
.dock-item.on{background:var(--brand-50);color:var(--brand-600);font-weight:500}
.dock-sep{height:1px;background:var(--line);margin:6px -12px}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes slide-in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes slidein{from{transform:translateX(60px);opacity:.4}to{transform:translateX(0);opacity:1}}
@keyframes skel{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes cycleflash{0%,60%{background:#fef2f2!important}100%{background:transparent}}
@keyframes bounceback{0%{transform:scale(.95)}60%{transform:translateX(8px)}100%{transform:translateX(0)}}
@media (max-width:768px){
  .psidebar{display:none}
  .drawer{width:100vw}
  .modal{width:100%;max-width:100%;border-radius:12px 12px 0 0;margin-top:auto;max-height:86vh}
  .overlay{align-items:flex-end;padding:0}
}

function relOf(it){
  const pre=[],post=[],rel=[];
  for(const l of D.links){
    if(l.to===it.id){const o=issueBy(l.from);if(l.type==='blocks')pre.push({o,type:'is_blocked_by'});else rel.push({o,type:l.type})}

  }
  return {pre,post,rel};
}

function toast(msg,kind='info',opt={}){
  const t=document.createElement('div');t.className='toast toast-'+kind;
  t.innerHTML='<div class="tx">'+msg+(opt.sub?'<div style="font-size:12px;opacity:.85;margin-top:2px">'+opt.sub+'</div>':'')+'</div>'+
    (opt.action?'<button class="toast-action" id="toast-act">'+esc(opt.action)+'<span class="toast-count"></span></button>':'')+
    '<button class="tclose" aria-label="关闭">'+icon('x',13)+'</button>';
  $('#toasts').appendChild(t);
  let left=opt.ttl||4200;const cnt=t.querySelector('.toast-count');const act=t.querySelector('#toast-act');
  const timer=setInterval(()=>{left-=500;if(cnt)cnt.textContent=opt.countdown?'('+Math.ceil(left/1000)+'s)':'';if(left<=0)kill()},500);
  function kill(){clearInterval(timer);t.style.transition='opacity .25s';t.style.opacity='0';setTimeout(()=>t.remove(),260)}
  t.querySelector('.tclose').onclick=kill;
  if(act&&opt.onAction)act.onclick=()=>{clearInterval(timer);opt.onAction();kill()};
  return t;
}

function addQuickSub(pid,name){

/* ═════════ V-BOARD 看板（C.29 基线 + T005 §3.4 ⛔/列头计数 + T007 §3.3 堆叠 + T009 §3.2 归档退出列） ═════════ */
function renderBoard(){
  const cols=['unstarted','started','completed','cancelled'];
  const issues=activeIssues().filter(i=>!i.archivedAt);
  let colsHTML='';
  for(const st of cols){
    const inCol=issues.filter(i=>i.state===st&&i.parent==null).sort((a,b)=>a.sort-b.sort); /* 顶层任务上板（子任务在抽屉内管理，口径沿用 C.29） */
    const blockedN=inCol.filter(isBlocked).length;
    colsHTML+='<section class="bcol" data-col="'+st+'" role="list" aria-label="'+STATES[st].name+' 列，共 '+inCol.length+' 个任务">'+
      '<div class="bcol-head"><span class="dot" style="background:'+STATES[st].color+'"></span><span class="bcol-name">'+STATES[st].name+'</span><span class="bcol-count">'+inCol.length+'</span></div>'+
      (st==='started'&&blockedN?'<div class="bcol-blocked-sub">'+icon('alertTri',11)+' '+inCol.length+' 个任务（'+blockedN+' 被阻塞）</div>':'')+
      '<div class="bcol-body">'+inCol.map(i=>boardCard(i)).join('')+'</div></section>';
  }
  const content='<div class="view-bar"><span class="view-title">看板</span><span class="view-count">'+issues.length+' 个任务</span><div class="right"><button class="fbtn">筛选 '+icon('chev',12)+'</button></div></div>'+
    '<div class="board">'+colsHTML+'</div>';
  mount(shell(content,'board'));
}
function boardCard(i){
  const blocked=isBlocked(i);const ro=relOf(i);
  const tip=blocked?esc(ro.pre.filter(x=>x.o.state!=='completed'&&x.o.state!=='cancelled').slice(0,3).map(x=>x.o.key+' '+x.o.name).join('、')+(ro.pre.length>3?' 等 '+ro.pre.length+' 项':'')):'';
  return '<article class="bcard" data-id="'+i.id+'" draggable="'+canWrite()+'" style="--bar:'+typeById(i.type).color+'">'+
    (blocked?'<span class="bcard-blocked-badge" data-tip="'+tip+'" role="img" aria-label="被未完成前置任务阻塞">⛔</span>':'')+
    '<div class="bcard-title"><span style="color:'+typeById(i.type).color+'">'+icon(i.type==='bug'?'bug':i.type==='story'?'sparkles':i.type==='test'?'flask':i.type==='doc'?'fileText':'circleCheck',12)+'</span><span>'+esc(i.name)+'</span></div>'+
    '<div class="bcard-meta">'+
      '<span class="badge-id mono">'+i.key+'</span>'+
      (i.pri!=='none'?'<span style="width:7px;height:7px;border-radius:50%;background:'+PRIS[i.pri].c+';display:inline-block"></span>':'')+
      (i.due?'<span class="'+(isOverdue(i)?'overdue':'')+'">'+(+i.due.slice(5,7))+'-'+(+i.due.slice(8,10))+'</span>':'')+
      (i.labels.length?'<span>'+esc(i.labels.slice(0,3).join(' / '))+(i.labels.length>3?' +'+(i.labels.length-3):'')+'</span>':'')+
      (kids(i.id).length?'<span data-tip="子任务 '+kids(i.id).filter(k=>k.state==='completed').length+'/'+kids(i.id).length+'">ⓔ '+kids(i.id).filter(k=>k.state==='completed').length+'/'+kids(i.id).length+'</span>':'')+
    '</div>'+
    '<div class="bcard-av">'+(i.as.length?'<span class="avstack">'+i.as.slice(0,2).map(n=>avatarEl(n,'avatar avatar-sm')).join('')+(i.as.length>2?'<span class="more-n mono">+'+(i.as.length-2)+'</span>':'')+'</span>':'<span class="unassign-ghost" data-tip="未指派">'+icon('user',14)+'</span>')+'</div>'+
  '</article>';
}
/* 看板拖拽 → 拦截演出（T005 §3.3 / §4.4.2：300ms 弹回 + 列头 shake + alertdialog） */
function tryMoveCard(id,toState){
  const it=issueBy(id);if(!it)return;
  if(toState==='completed'&&isBlocked(it)){
    const col=$('[data-col="'+it.state+'"]');
    const card=$('.bcard[data-id="'+id+'"]');
    if(card){card.classList.add('bounce-back')}
    if(col){col.classList.remove('shaking');void col.offsetWidth;col.classList.add('shaking')}
    openBlockedDialog(it);return;
  }
  it.state=toState;save();renderBoard();
  toast('已移至「'+STATES[toState].name+'」','ok');
}

/* ═════════ TREE 全屏树抽屉（T004 §3.3） ═════════ */
function openTree(id){
  const it=issueBy(id);if(!it)return;
  const nodes=[it,...descendants(it.id)];
  const completed=nodes.filter(n=>n.state==='completed').length;
  const maxDepth=Math.max(...nodes.map(depthOf))-(depthOf(it)-1);
  const truncated=S.demo.treeTrunc&&nodes.length>8;
  const shown=truncated?nodes.slice(0,8):nodes;
  const directDone=kids(it.id).filter(k=>k.state==='completed').length;
  $('#tree-root').innerHTML=
    '<div class="drawer-scrim" data-action="close-tree"></div>'+
    '<div class="drawer wide" role="dialog" aria-modal="true" aria-label="任务树">'+
      '<div class="drawer-head"><div style="flex:1"><div style="font-size:16px;font-weight:600">'+esc(it.name)+' 的任务树</div>'+
      '<div class="tree-stats" style="margin-top:2px">'+(truncated?nodes.length+'+':'')+nodes.length+' 个任务（含自身） · '+completed+' 已完成 · 最深 '+maxDepth+' 层</div></div>'+
      '<button class="icon-btn" data-action="close-tree" aria-label="关闭">'+icon('x',16)+'</button></div>'+
      '<div class="drawer-body">'+
        shown.map(n=>{
          const d=depthOf(n)-(depthOf(it)-1)-1;
          const kd=kids(n.id);
          return '<div class="tree-node" data-action="open-drawer" data-id="'+n.id+'" role="button" tabindex="0" style="padding-left:'+(12+d*24)+'px" data-tip="'+esc(n.key+' · '+n.name+' · 估算 '+(n.est!=null?fmtMinutes(n.est):'—')+' · 已耗 '+fmtMinutes(spentOf(n.seq)))+'" data-tip-class="tip-up">'+
            '<span class="dot" style="background:'+STATES[n.state].color+';width:9px;height:9px"></span>'+
            '<span class="badge-id mono">'+n.key+'</span><span class="nm" style="'+(d===0?'font-weight:500':'')+'">'+esc(n.name)+'</span>'+
            (n.as[0]?avatarEl(n.as[0],'avatar avatar-sm'):'')+
            (kd.length?subProgCell(n):'')+'</div>';
        }).join('')+
        (truncated?'<div class="trunc-bar">'+icon('alertTri',15)+' 结果超过 500 节点已截断 · 建议按状态 / 负责人筛选缩小范围</div>':'')+
      '</div></div>';
}
function setHashParam(key,val,replace){const{seg,params}=parseHash();if(val===''||val==null)params.delete(key);else params.set(key,val);

    dupRow('labels','包含标签',(it.labels.join(' / ')||'无'))+

    dupRow('dates','包含起止日期',((it.start||'—')+' ~ '+(it.due||'—')))+
    (archivedSubs?'<div class="notice-strip">'+icon('alertTri',14)+' '+archivedSubs+' 个已归档子任务将复制为活跃副本</div>':'')+
    '<div class="notice-strip">ⓘ 新任务将进入「待办」状态，编号重新分配；<b>评论、附件、依赖、工时不会被复制</b>。</div>'+
    '<div class="preview-line" id="dup-preview"></div>'+
    '<div class="modal-foot"><button class="btn btn-ghost" data-action="modal-close">取消</button><button class="btn btn-primary" id="dup-go">创建副本</button></div>','w480');
  const upd=()=>{const n=dupOpt.sub?subs.length+1:1;$('#dup-preview').textContent='副本预览：'+it.name+' (副本)'+(dupOpt.sub&&subs.length?' + '+subs.length+' 个子任务':'');};
  $$('.dup-cb').forEach(cb=>cb.addEventListener('change',e=>{dupOpt[e.target.dataset.k]=e.target.checked;upd()}));
  upd();
  $('#dup-go').addEventListener('click',()=>{
    const btn=$('#dup-go');btn.disabled=true;btn.textContent='正在复制 '+(dupOpt.sub?subs.length+1:1)+' 个任务…';
    setTimeout(()=>{
      let ns=Math.max(...Object.values(D.issues).map(i=>i.seq));
      const map={};/* 源 id → 副本 seq 映射，重建父子 */
      ns++;map[it.id]=ns;
      D.issues[ns]={...it,id:'i'+ns,seq:ns,key:'RBT-'+ns,name:it.name+' (副本)',state:'unstarted',completedAt:null,
        as:dupOpt.asg?[...it.as]:[],labels:dupOpt.labels?[...it.labels]:[],cf:dupOpt.cf?{...it.cf}:{},
        start:dupOpt.dates?it.start:null,due:dupOpt.dates?it.due:null,parent:null,archivedAt:null,sort:ns*65535};
      const newRoot='i'+ns;
      if(dupOpt.sub)for(const src of subs){
        ns++;map[src.id]=ns;
        D.issues[ns]={...src,id:'i'+ns,seq:ns,key:'RBT-'+ns,state:'unstarted',
          as:dupOpt.asg?[...src.as]:[],labels:dupOpt.labels?[...src.labels]:[],cf:dupOpt.cf?{...src.cf}:{},
          start:dupOpt.dates?src.start:null,due:dupOpt.dates?src.due:null,
          parent:'i'+map[src.parent],archivedAt:null,sort:ns*65535};
      }
      D.links.push({id:'lDup'+Date.now(),from:newRoot,to:it.id,type:'duplicates'});
      save2();closeModal();render();
      toast('已创建 <b class="mono">RBT-'+map[it.id]+'</b> '+esc(it.name)+' (副本)','ok',{action:'查看',onAction:()=>openDrawer('i'+map[it.id])});
    },900);
  });
}

    '<div class="modal-foot"><button class="btn btn-ghost" data-action="modal-close">取消</button></div>','w480');
  const res=$('#mv-res');

function confirmMove(fromId,toId){
  const from=issueBy(fromId),to=issueBy(toId);
  const descs=descendants(fromId).length;
  openModal('<div class="modal-head"><div class="modal-title">'+icon('moveIco',15)+' 移动子树</div></div>'+
    '<p style="font-size:13.5px">将「<b>'+esc(from.name)+'</b>」（含 '+descs+' 个后代）移动到「<b>'+esc(to.name)+'</b>」之下？</p>'+
    '<div class="modal-foot"><button class="btn btn-ghost" data-action="modal-close">取消</button><button class="btn btn-primary" id="mv-go">移动</button></div>','w400');
  $('#mv-go').addEventListener('click',()=>{
    /* 环检测演出：目标是自身后代 ⇒ 409 环路径 Toast + 高亮 */
    if(descendants(fromId).some(x=>x.id===toId)){
      closeModal();
      toast('移动被拒绝：存在循环依赖 RBT-… → '+to.key+' → '+from.key+'（409 RESOURCE_CIRCULAR_DEPENDENCY）','error',{ttl:6000});
      [fromId,toId].forEach(x=>{const tr=$('tr[data-id="'+x+'"]');if(tr)tr.classList.add('cycle-flash');setTimeout(()=>tr&&tr.classList.remove('cycle-flash'),2000)});
      return;
    }
    from.parent=toId;S.expanded[toId]=true;save2();closeModal();render();
    toast('已移动到「'+esc(to.name)+'」之下','ok');
  });
}

function closeMenus(){$$('body > .menu').forEach(m=>m.remove())}
function openMenu(anchor,html){
  closeMenus();
  const el=document.createElement('div');el.className='menu';el.innerHTML=html;
  document.body.appendChild(el);
  const r=anchor.getBoundingClientRect();
  el.style.top=Math.min(r.bottom+4,innerHeight-el.offsetHeight-8)+'px';
  el.style.left=Math.min(r.left,innerWidth-el.offsetWidth-8)+'px';
  el.querySelector('button')?.focus();
  setTimeout(()=>document.addEventListener('mousedown',function h(e){if(!el.contains(e.target)){el.remove();document.removeEventListener('mousedown',h)}}),0);
  return el;
}

let _asgRefresh=null;
document.addEventListener('change',e=>{

  if(el.dataset.action==='asg-tick'){ /* checkbox 用 change（click 会在 label 转发时双触发） */

  if(el.dataset.action==='nf-opt-name'){nfDraft.options[+el.dataset.i].n=el.value;return}
  if(el.dataset.action==='nf-opt-val'){nfDraft.options[+el.dataset.i].v=el.value;return}
  if(el.dataset.action==='wl-scope'){S.wlScopeSelf=!el.checked;openDrawer(S.drawer,true);return}
});
/* 抽屉内添加子任务：回车 */
document.addEventListener('keydown',e=>{
  if(e.target.id==='drawer-sub-input'&&e.key==='Enter'&&e.target.value.trim()){
    const pid=e.target.dataset.id;const parent=issueBy(pid);
    const ns=Math.max(...Object.values(D.issues).map(i=>i.seq))+1;
    D.issues[ns]={id:'i'+ns,seq:ns,key:'RBT-'+ns,name:e.target.value.trim(),state:'unstarted',type:parent.type,pri:'none',as:[],labels:[],parent:pid,est:null,archivedAt:null,cf:{},sort:ns*65535};
    save2();openDrawer(S.drawer,true);e.target.value='';
    toast('已创建子任务','ok');announce('子任务已创建');
  }
  if(e.target.id==='drawer-sub-input'&&e.key==='Escape')e.target.value='';
  /* 树形键盘导航（T004 §3.1：←折叠 →展开 ↑↓移动 Enter 开详情） */
  const row=e.target.closest&&e.target.closest('tr.treerow');
  if(row&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter'].includes(e.key)){
    e.preventDefault();const rows=$$('tr.treerow');const idx=rows.indexOf(row);
    if(e.key==='Enter'){openDrawer(row.dataset.id);return}
    if(e.key==='ArrowRight'&&S.expanded[row.dataset.id]===undefined)S.expanded[row.dataset.id]=true;
    if(e.key==='ArrowLeft'&&S.expanded[row.dataset.id])S.expanded[row.dataset.id]=false;
    if(e.key==='ArrowUp'&&idx>0)rows[idx-1].focus();
    if(e.key==='ArrowDown'&&idx<rows.length-1)rows[idx+1].focus();
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){save2();render();const nr=$('tr[data-id="'+row.dataset.id+'"]');if(nr)nr.focus()}
  }
});
/* 列表行点击（非按钮区）开抽屉 */
document.addEventListener('click',e=>{
  if(e.target.closest('[data-action]'))return;
  const row=e.target.closest('tr.treerow');
  if(row&&!row.id.startsWith('temp')){openDrawer(row.dataset.id);return}
  const card=e.target.closest('.bcard');
  if(card){openDrawer(card.dataset.id);return}
  const node=e.target.closest('.tree-node');
  if(node){openDrawer(node.dataset.id);return}
});
/* 看板拖拽（拦截演出入口） */
document.addEventListener('dragstart',e=>{
  const grip=e.target.closest('[data-action="drag-start"]');
  if(grip){e.dataTransfer.setData('text/plain','row:'+grip.dataset.id);grip.closest('tr').classList.add('dragging')}
  const card=e.target.closest('.bcard');
  if(card&&card.draggable){e.dataTransfer.setData('text/plain','card:'+card.dataset.id)}
});
document.addEventListener('dragend',e=>{$$('.dragging').forEach(x=>x.classList.remove('dragging'))});
document.addEventListener('dragover',e=>{
  const col=e.target.closest('.bcol');const row=e.target.closest('tr.treerow');
  if(col)e.preventDefault();
  if(row){e.preventDefault();
    const r=row.getBoundingClientRect();
    const inChildZone=(e.clientY-r.top)/r.height>0.25;
    row.classList.toggle('dropinto',inChildZone);
    $$('.treerow.dropinto').forEach(x=>{if(x!==row)x.classList.remove('dropinto')});
  }
});
document.addEventListener('drop',e=>{
  const data=e.dataTransfer.getData('text/plain')||'';
  const row=e.target.closest('tr.treerow');
  if(row&&data.startsWith('row:')){ /* 列表拖拽移动子树：中部 75% ⇒ 成为子任务（预览 400ms 后松手） */
    row.classList.remove('dropinto');
    const from=data.slice(4);
    const r=row.getBoundingClientRect();
    if((e.clientY-r.top)/r.height>0.25&&from!==row.dataset.id)confirmMove(from,row.dataset.id);
    return;
  }
  const col=e.target.closest('.bcol');
  if(col&&data.startsWith('card:')){e.preventDefault();tryMoveCard(data.slice(5),col.dataset.col)}
});
render();




</script>
