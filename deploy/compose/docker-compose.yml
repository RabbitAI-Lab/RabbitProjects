name: rabbit-projects
services:
  db:
    image: postgres:15.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-rabbit_projects}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init/init-extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [rp-net]
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }

  redis:
    image: valkey/valkey:7.2-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes: [redisdata:/data]
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [rp-net]
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }

  mq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
    volumes: [mqdata:/var/lib/rabbitmq]
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks: [rp-net]
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }

  minio:
    image: minio/minio:RELEASE.2025-01-20T15-22-18Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes: [miniodata:/data]
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [rp-net]
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }

  migrator:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../../.env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-plane.settings.local}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@mq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-rp-uploads}
    restart: "no"
    command: ["/app/bin/docker-entrypoint-migrator.sh"]
    depends_on:
      db: { condition: service_healthy }
    networks: [rp-net]
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }

  createbuckets:
    image: minio/mc:RELEASE.2025-01-20T15-22-18Z
    restart: "no"
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-rp-uploads}
    entrypoint: >
      /bin/sh -c "
      mc alias set rp http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing rp/$$AWS_S3_BUCKET_NAME &&
      mc anonymous set download rp/$$AWS_S3_BUCKET_NAME/public &&
      echo 'bucket ready'
      "
    networks: [rp-net]

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../../.env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-plane.settings.local}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@mq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-rp-uploads}
    restart: unless-stopped
    command: ["/app/bin/docker-entrypoint-api.sh"]
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      db:       { condition: service_healthy }
      redis:    { condition: service_healthy }
      mq:       { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [rp-net]
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }

  worker:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../../.env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-plane.settings.local}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@mq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-rp-uploads}
    restart: unless-stopped
    command: ["/app/bin/docker-entrypoint-worker.sh"]
    depends_on:
      db:       { condition: service_healthy }
      redis:    { condition: service_healthy }
      mq:       { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "celery -A plane inspect ping -d celery@$$HOSTNAME | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [rp-net]
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }

  beat:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../../.env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-plane.settings.local}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@mq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-rp-uploads}
    restart: unless-stopped
    command: ["/app/bin/docker-entrypoint-beat.sh"]
    depends_on:
      db:       { condition: service_healthy }
      redis:    { condition: service_healthy }
      mq:       { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
    networks: [rp-net]
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }

  live:
    build:
      context: ../..
      dockerfile: apps/live/Dockerfile
    restart: unless-stopped
    environment:
      LIVE_PORT: 3000
      API_INTERNAL_URL: http://api:8000
    ports: ["${LIVE_PORT:-3000}:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [rp-net]
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_LIVE_BASE_URL: ${VITE_LIVE_BASE_URL:-/live}
    restart: unless-stopped
    ports: ["${WEB_PORT:-3001}:3001"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [rp-net]
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }

  admin:
    build:
      context: ../..
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    ports: ["${ADMIN_PORT:-3002}:3002"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/god-mode/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [rp-net]
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }

  space:
    build:
      context: ../..
      dockerfile: apps/space/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_LIVE_BASE_URL: ${VITE_LIVE_BASE_URL:-/live}
    restart: unless-stopped
    ports: ["${SPACE_PORT:-3003}:3003"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/spaces/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [rp-net]
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }

  proxy:
    build:
      context: ../..
      dockerfile: apps/proxy/Dockerfile
    restart: unless-stopped
    environment:
      NGINX_PORT: ${NGINX_PORT:-80}
      SERVER_NAME: ${SERVER_NAME:-localhost}
      WEB_UPSTREAM: web:3001
      ADMIN_UPSTREAM: admin:3002
      SPACE_UPSTREAM: space:3003
      API_UPSTREAM: api:8000
      LIVE_UPSTREAM: live:3000
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-100M}
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      web:   { condition: service_healthy }
      admin: { condition: service_healthy }
      space: { condition: service_healthy }
      api:   { condition: service_healthy }
      live:  { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks: [rp-net]
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }

volumes:
  pgdata:    { name: rp-pgdata }
  redisdata: { name: rp-redisdata }
  mqdata:    { name: rp-mqdata }
  miniodata: { name: rp-miniodata }

networks:
  rp-net:
    name: rp-net
    driver: bridge
