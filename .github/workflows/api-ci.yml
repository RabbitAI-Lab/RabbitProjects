name: api-ci
on:
  pull_request:
    paths: ["apps/api/**", ".github/workflows/api-ci.yml", "ci/**"]
  push: { branches: [main], paths: ["apps/api/**"] }
  workflow_dispatch: {}

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: dev
      DATABASE_URL: postgresql://rp:rp@127.0.0.1:5432/rabbit_projects
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: amqp://rp:rp@127.0.0.1:5672//
    services:
      # pytest 全量需真 PG（settings/test 直连；SQLite 走不通 advisory lock/GIN 等）
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rp
          POSTGRES_PASSWORD: rp
          POSTGRES_DB: rabbit_projects
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rp -d rabbit_projects"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # pytest 有真实 broker/redis 依赖（CPM 重算/异步导出 dispatch、死信直连 redis）
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3-alpine
        env:
          RABBITMQ_DEFAULT_USER: rp
          RABBITMQ_DEFAULT_PASS: rp
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --project apps/api
      # Django 5.1 + swappable User 在 PG 上 manage.py migrate 必炸（CLAUDE.md 已知坑 ①），
      # 全新库按 sqlmigrate 配方建 schema（ci/api_db_bootstrap.sh，dev 同口径）
      - name: bootstrap PG schema
        env:
          PGHOST: 127.0.0.1
          PGUSER: rp
          PGPASSWORD: rp
          PGDATABASE: rabbit_projects
        run: bash ci/api_db_bootstrap.sh
      # uv run --project 不改变工作目录；ruff/mypy/pytest 必须在 apps/api 下执行
      # （否则 mypy 找不到 plane 包、pytest 读不到 pyproject 的 DJANGO_SETTINGS_MODULE）
      - run: uv run ruff check .
        working-directory: apps/api
      - run: uv run mypy plane
        working-directory: apps/api
      - run: uv run pytest -q
        working-directory: apps/api
        env:
          # 共享 runner 硬件慢于 dev 机，缓存命中 P99 门禁按 3ms 放宽（本地默认 1ms）
          RP_PERF_P99_MS: "3"
