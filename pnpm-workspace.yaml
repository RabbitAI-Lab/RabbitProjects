packages:
  # ── 白名单：显式列举 JS/TS 应用（不用 apps/*，理由见 INFRA-001 §2.2 规则 3）──
  - "apps/web"
  - "apps/admin"
  - "apps/space"
  - "apps/live"
  # ── 共享包统一纳入 ──
  - "packages/*"
  # ── 黑名单二次排除：非 JS 项目 ──
  - "!apps/api"
  - "!apps/api/**"
  - "!apps/proxy"
  - "!apps/proxy/**"
  # ── 黑名单：构建产物目录 ──
  - "!**/dist/**"
  - "!**/build/**"
  - "!**/storybook-static/**"
  - "!**/node_modules/**"

# ── 强制统一版本：Yjs 家族跨包同版本红线（tech-stack.md §4.1）──
overrides:
  yjs: "13.6.x"
  y-prosemirror: "1.3.x"
  y-protocols: "1.0.x"
  # GHSA-37ch-88jc-xwx2：ReDoS，patched 0.1.13（express 链传递依赖，父级钉 0.1.12）
  path-to-regexp: "0.1.13"
  # GHSA-p9ff-h696-f583 / GHSA-fx2h-pf6j-xcff：任意文件读/fs.deny 绕过，
  # patched 6.4.2/6.4.3（storybook 8 builder 链锁定残留 6.3.7，统一到 6.4.x）
  vite: "6.4.x"
  # GHSA-jqcg-44mw-7w3h：IPv4-mapped IPv6 信任子网编译错误 → X-Forwarded-For IP 伪造，
  # patched 2.0.8（express@4 钉 ~2.0.7）
  proxy-addr: "^2.0.8"
  # GHSA-5gmw-xhrv-c9v3 / GHSA-85c8-ppgw-ccpr：worker options 原型污染 → RCE，
  # patched 2.1.1/2.1.2（vitest@3 钉 ^1.1.1、oxfmt@0.65 钉 2.1.0，均超父级 semver 范围，
  # 只能 override；vitest 3.2.7 与 tinypool 2.1.2 兼容性已本地实证——见 20261010 每夜）
  tinypool: "^2.1.2"

# ── 允许执行构建脚本的包（pnpm 11 用 allowBuilds 对象形式；
#    文档 §4.2 的 onlyBuiltDependencies 为 pnpm 10 字段，登记为文档待回改项）──
allowBuilds:
  esbuild: true
  "@tailwindcss/oxide": true
  sharp: true
