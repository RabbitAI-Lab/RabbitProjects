<style>
/* ═════════ 设计 token · 与 sprint-0~4 冻结基线一致 ═════════ */
:root{

/* 组织树 */

<script>
"use strict";
/* ═════════════════════════════ 工具 ═════════════════════════════ */
const $=(s,el=document)=>el.querySelector(s), $$=(s,el=document)=>[...el.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg,type="info",ms=2600){const t=document.createElement("div");t.className=`toast ${type==="ok"?"toast-ok":type==="err"?"toast-err":type==="warn"?"toast-warn":""}`;t.innerHTML=msg;$("#toasts").appendChild(t);setTimeout(()=>t.remove(),ms)}
const AVA={zs:"#3f76ff",ls:"#10b981",ww:"#f59e0b",zl:"#8b5cf6",guest:"#6b7280"};
const ava=(n,sm)=>`<span class="avatar${sm?" avatar-sm":""}" style="background:${AVA[{张三:"zs",李四:"ls",王五:"ww",赵六:"zl","外包·周":"guest"}[n]]||"#6b7280"}">${n[0]}</span>`;

/* ═════════════════════════════ 演示数据 ═════════════════════════════ */

 const a=el.dataset.act;
 const nav=h=>{location.hash=h;if(S.route===h){S.route=h;render()}};
 switch(a){
  case "noop":break;
  case "nav":nav(el.dataset.h);break;

  case "org-sel":S.orgSel=el.dataset.id;render();break;

  case "modal-close":MODAL=null;S.auditExport=false;render();break;

  case "role-sel":S.rolesSel=el.dataset.id;S.editing=false;S.draft=new Set(ROLES.find(r=>r.id===el.dataset.id).perms);render();break;
  case "role-edit":S.editing=true;render();break;
  case "role-edit-cancel":S.editing=false;S.draft=new Set(ROLES.find(r=>r.id===S.rolesSel).perms);render();break;
  case "role-save":S.editing=false;ROLES.find(r=>r.id===S.rolesSel).perms=[...S.draft];toast("权限码已保存 · 6 名挂接者即时生效","ok");render();break;
  case "perm-toggle":if(!S.editing){toast("先点「编辑权限」","warn");break}
   {const c=el.dataset.code;S.draft.has(c)?S.draft.delete(c):S.draft.add(c);render()}break;
  case "domain-all":if(!S.editing)break;
   {const dom=CATALOG.find(d=>d.domain===el.dataset.dom);const all=dom.codes.every(c=>S.draft.has(c));
    dom.codes.forEach(c=>all?S.draft.delete(c):S.draft.add(c));render()}break;

  /* 审计 */
  case "audit-cat":S.auditCat=el.value;render();break;
  case "audit-detail":S.auditDetail=+el.dataset.i;render();break;
  case "audit-detail-close":S.auditDetail=null;render();break;
  case "audit-export":S.auditExport=true;render();break;
  /* 看板 */
  case "board-view":S.boardView=el.dataset.k;if(S.boardView!=="locked")toast("演示：切视图");render();break;
  case "board-fork":toast("已另存为个人副本「迭代评审（副本）」","ok");break;
  case "swim-toggle":S.swimlane=!!el.value;S.degraded=false;render();break;
  case "swim-degrade":S.swimlane=true;S.degraded=true;render();toast("聚合超时（>5s）→ 降级一维 + meta.degraded","warn");break;

    {cap:"当前视图 · 迭代评审 🔒★"},{label:"共享给全员 / 收回共享"},{label:"锁定为组织标准",disabled:true},{label:"设为项目默认（新成员订阅）",disabled:true},
    {sep:1},{label:"订阅到侧栏"},{label:"另存为我的副本"},{sep:1},{label:"删除（锁定视图不可删）",danger:true,disabled:true}]);break;
  /* SSO */
  case "sso-check":toast("干跑中：验签 + 取 claims…","info",1400);setTimeout(()=>{S.ssoPassed=true;toast("✓ 测试连接通过（issuer 匹配 · RS256 验签 OK）","ok");render()},1400);break;
  case "sso-toggle":S.ssoEnabled=el.checked;if(!S.ssoEnabled)S.enforced=false;render();break;
  case "sso-enforce":S.enforced=!S.enforced;toast(S.enforced?"已开启强制 SSO（全员 403 密码登录，逃生名单除外）":"已关闭强制 SSO",S.enforced?"warn":"ok");render();break;
  case "sso-enforce-demo":nav("#/settings/sso");S.enforced=!S.enforced;S.ssoPassed=true;S.ssoEnabled=true;render();toast(S.enforced?"强制 SSO 已开启（看顶栏徽标）":"已恢复","warn");break;
  /* 登录 */
  case "login-email":S.loginEmail=el.value;break;
  case "login-route-demo":nav("#/login");S.loginEmail="li4@acme.com";S.ssoRouted=true;render();toast("route 发现：该邮箱属强制 SSO 组织 → 蓝条直达","info");break;
  case "claim-demo":nav("#/login");S.claim=true;render();break;
  case "claim-ok":S.claim=false;toast("绑定完成，欢迎回来（sso_txn 已消费，不可重放）","ok");render();break;
  case "login-signin":toast("演示：普通密码登录");break;
 }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){MODAL=null;S.auditDetail=null;S.auditExport=false;render()}});
/* 菜单（基线同款） */
function menuAt(el,items){
 document.querySelectorAll(".menu").forEach(m=>m.remove());
 const r=el.getBoundingClientRect();
 const m=document.createElement("div");m.className="menu";
 m.style.left=Math.min(r.left,innerWidth-210)+"px";m.style.top=r.bottom+4+"px";
 m.innerHTML=items.map((it,i)=>it.sep?"<div class='menu-sep'></div>":it.cap?`<div class='menu-cap' style="font-size:11px;color:var(--ink-4);padding:5px 10px 3px">${esc(it.cap)}</div>`:
  `<button class="menu-item${it.danger?" danger":""}${it.disabled?" disabled":""}" ${it.disabled?"aria-disabled='true'":""}>${esc(it.label)}</button>`).join("");
 document.body.appendChild(m);
 setTimeout(()=>document.addEventListener("mousedown",function h(ev){if(!m.contains(ev.target)){m.remove();document.removeEventListener("mousedown",h)}}),0);
}
render();
</script>
