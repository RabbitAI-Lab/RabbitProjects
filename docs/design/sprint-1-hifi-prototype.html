/* @ 补全浮层（C.33） */
function detectMention(ed,issue){
  const sel=getSelection();
  if(!sel.rangeCount)return closeMention();
  const r0=sel.getRangeAt(0);
  const pre=document.createRange();pre.selectNodeContents(ed);pre.setEnd(r0.startContainer,r0.startOffset);
  const m=pre.toString().match(/@([A-Za-z0-9一-龥_]*)$/);
  if(!m)return closeMention();
  const q=m[1].toLowerCase();
  const items=MENTION_POOL.filter(u=>!q||u.name.toLowerCase().includes(q)||u.email.split('@')[0].toLowerCase().includes(q));
  let anchor=null;
  try{const fn=r0.startContainer,fo=r0.startOffset;
    if(fn.nodeType===3&&fo>=m[0].length)anchor={node:fn,off:fo-m[0].length}}catch(x){}
  mentionState={open:true,idx:0,items,trigger:m[1],anchor};
  const root=$('#mention-pop-root');
  root.innerHTML=items.length?'<div class="mention-pop" role="listbox" aria-label="提及成员" id="mention-list"><div class="mf">'+icon('search',12)+' 过滤：'+esc(m[1])+'</div>'+
    items.map((u,idx)=>'<button class="mopt'+(idx===0?' on':'')+'" role="option" id="mo-'+idx+'" aria-selected="'+(idx===0)+'" data-mi="'+idx+'">'+avatarEl(u.name,'avatar avatar-sm')+esc(u.name)+'<span class="em">'+esc(u.email)+'</span></button>').join('')+'</div>':
    '<div class="mention-pop"><div class="mf">'+icon('search',12)+' 过滤：'+esc(m[1])+'</div><div class="hint" style="padding:10px 12px">无成员</div></div>';
  root.querySelectorAll('[data-mi]').forEach(b=>b.addEventListener('mousedown',e=>{e.preventDefault();mentionState.idx=+b.dataset.mi;mentionPick()}));
}
function mentionMove(d){
  mentionState.idx=(mentionState.idx+d+mentionState.items.length)%mentionState.items.length;
  const list=$('#mention-list');if(!list)return;
  [...list.querySelectorAll('.mopt')].forEach((el,idx)=>{el.classList.toggle('on',idx===mentionState.idx);el.setAttribute('aria-selected',idx===mentionState.idx)});
  const act=list.querySelector('#mo-'+mentionState.idx);
  if(act){list.parentNode.setAttribute('aria-activedescendant','mo-'+mentionState.idx);act.scrollIntoView({block:'nearest'})}
}
function mentionPick(){
  const u=mentionState.items[mentionState.idx];if(!u)return closeMention();
  const ed=$('#ce-inp');if(!ed)return closeMention();
  ed.focus();
  const anc=mentionState.anchor;
  if(anc&&anc.node.isConnected){
    try{const sel2=getSelection();const rg=document.createRange();
      rg.setStart(anc.node,anc.off);
      rg.setEnd(sel2.focusNode,sel2.focusOffset);
      sel2.removeAllRanges();sel2.addRange(rg);
      document.execCommand('delete')}catch(x){}
  }
  document.execCommand('insertHTML',false,'<span class="mention" data-mention-id="u-'+u.email.split('@')[0]+'" title="'+esc(u.name+' · '+u.email)+'">@'+esc(u.name)+'</span>&nbsp;');
  closeMention();
}

  $$('[data-action="att-cancel"]').forEach(b=>b.addEventListener('click',()=>{S.attach[i.id].splice(+b.dataset.f,1);save();drawDrawer(i);toast('已取消上传，临时对象自动回收',{variant:'info'})}));
  $$('[data-action="att-rm"]').forEach(b=>b.addEventListener('click',()=>{S.attach[i.id].splice(+b.dataset.f,1);save();drawDrawer(i)}));
  $$('[data-action="att-retry"]').forEach(b=>b.addEventListener('click',()=>{const f=S.attach[i.id][+b.dataset.f];f.st='uploading';f.pct=0;save();drawDrawer(i);runUploadTimer(i)}));
  runUploadTimer(i);
}
function startUpload(i,name,ico,kb){
  S.attach[i.id]=S.attach[i.id]||[];
  /* C.31 前端预检：失败文件直接红行提示，不进队列 */
  const ext=name.split('.').pop().toLowerCase();
  const maxKb=25*1024;
  if(kb>maxKb){
    S.attach[i.id].push({name,ico,kb,by:S.user.name,mins:0,st:'failed',err:'超过 25MB 上限'});
    save();drawDrawer(i);
    toast(name+' 超过 25MB，已拒绝上传',{variant:'error'});
    announce(name+' 预检失败：超过 25MB');
    return;
  }
  /* 简易类型预检（演示）：超大 MIME 黑名单 */
  if(name.endsWith('.exe')||name.endsWith('.bat')||name.endsWith('.sh')){
    S.attach[i.id].push({name,ico,kb,by:S.user.name,mins:0,st:'failed',err:'禁止上传可执行文件'});
    save();drawDrawer(i);
    toast(name+' 类型不被允许',{variant:'error'});
    announce(name+' 预检失败：类型不允许');
    return;
  }
  /* C.31 并发与预检：3 并发上行 + 2 排队；超出排队上限直接拒绝并提示 */
  const list=S.attach[i.id];
  const upN=list.filter(f=>f.st==='uploading').length;
  const queueN=list.filter(f=>f.st==='queued').length;
  if(upN>=3){
    if(queueN>=2){
      toast('并发与队列已满（3 上行 + 2 排队），请稍候再试',{variant:'warning'});
      announce('上传并发已满');
      return;
    }
    list.push({name,ico,kb,by:S.user.name,mins:0,st:'queued',pct:0});
    save();drawDrawer(i);
    announce(name+' 已加入上传队列');
    return;
  }
  list.push({name,ico,kb,by:S.user.name,mins:0,st:'uploading',pct:0,speed:1.2});
  save();drawDrawer(i);runUploadTimer(i);
}
function runUploadTimer(i){
  clearInterval(uploadTimer);
  uploadTimer=setInterval(()=>{
    const list=S.attach[i.id]||[];
    const up=list.find(f=>f.st==='uploading');
    if(!up){
      /* 全部上行完成：从队列里顶上并发槽 */
      const q=list.find(f=>f.st==='queued');
      if(q){
        q.st='uploading';q.pct=0;q.speed=1.2;
        save();
        const el=$('#att-list');if(el&&drawerState.id===i.id){el.innerHTML=attachRows(i);wireAttach(i,true)}
      }else{
        clearInterval(uploadTimer);
      }
      return;
    }
    up.pct=Math.min(100,up.pct+rint(4,9));
    up.speed=+(0.8+Math.random()*0.9).toFixed(1);
    if(up.pct>=100){
      up.st='done';up.mins=0;
      const iss=issueById(i.id);if(iss)iss.att=(iss.att||0)+1;
      announce(up.name+' 上传完成');
      toast(up.name+' 上传完成',{variant:'info'});
      /* 完成 → 顶一个排队项上来 */
      const q=list.find(f=>f.st==='queued');
      if(q){q.st='uploading';q.pct=0;q.speed=1.2;announce(q.name+' 开始上传')}
    }
    save();
    const el=$('#att-list');
    if(el&&drawerState.id===i.id)el.innerHTML=attachRows(i),wireAttach(i,true);
    else if(up.pct>=100&&!list.some(f=>f.st==='queued')&&!list.some(f=>f.st==='uploading'))clearInterval(uploadTimer);
  },600);
}

      '<div class="field"><span class="label">开始 · 截止</span><div style="display:flex;gap:8px;align-items:center">'+

    '</div></form>'+
    '<div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="modal-close">取消</button><button class="btn btn-primary" id="ct-ok" '+(!type&&!noTypes?'disabled':'')+'>创建</button></div>','w920');
    $$('#ct-type [data-ct-type]').forEach(b=>b.addEventListener('click',()=>{type=b.dataset.ctType;closeAllMenus();draw()}));
    $$('#ct-pri [data-ct-pri]').forEach(b=>b.addEventListener('click',()=>{pri=b.dataset.ctPri;closeAllMenus();draw()}));
    $$('#ct-as [data-ct-as]').forEach(b=>b.addEventListener('click',()=>{assignee=b.dataset.ctAs||null;closeAllMenus();draw()}));
    $$('#ct-st [data-ct-st]').forEach(b=>b.addEventListener('click',()=>{state=b.dataset.ctSt;closeAllMenus();draw()}));
    $$('#ct-lbl [data-ct-lbl]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const id=b.dataset.ctLbl;
      if(labels.includes(id))labels=labels.filter(x=>x!==id);else labels.push(id);draw()}));
    $$('[data-ct-lbl-x]').forEach(b=>b.addEventListener('keydown',e=>{if(e.key==='Backspace'||e.key==='Enter'){e.preventDefault();labels=labels.filter(x=>x!==b.dataset.ctLblX);routeRender()}}));

    if(hx)$('[data-action="ct-hint-x"]').addEventListener('click',()=>{S.typeHintShown=true;save();hx.remove()});

      S.typeHintShown=true;save();closeModal();toast('已创建 '+issueKey(i));
      if(location.hash.includes('/board')||location.hash.includes('/list'))routeRender();
    });
    $('#ct-name').focus();
  };
  draw();

/* ═════════ 标签管理面板（C.26 · 720px） ═════════ */
let lblEdit=null,lblDrag=null;
const LBL_SW=['#EF4444','#F59E0B','#F97316','#10B981','#14B8A6','#3B82F6','#6366f1','#8B5CF6','#EC4899','#6B7280','#9CA3AF','#0EA5E9'];
function openLabelModal(){
  lblEdit=null;
  const render=()=>{
    const rowOf=(l,idx)=>{
      const editing=lblEdit&&lblEdit.idx===idx;
      let mid;
      if(editing){
        mid='<span style="display:flex;gap:8px;align-items:center;flex:1;flex-wrap:wrap">'+
        '<input class="input" id="le-name" style="width:130px;height:30px" value="'+esc(l.name)+'" placeholder="标签名称">'+
        '<span class="swatches">'+LBL_SW.map(c=>'<button type="button" class="swatch'+(lblEdit.color===c?' on':'')+'" style="background:'+c+'" data-le-color="'+c+'" aria-label="颜色 '+c+'"></button>').join('')+'</span>'+
        '<input class="input mono" id="le-hex" style="width:100px;height:30px" value="'+esc(lblEdit.color)+'" placeholder="#RRGGBB">'+
        '<span class="dot" style="background:'+esc(lblEdit.color)+';width:14px;height:14px" aria-hidden="true"></span>'+
        '<button class="btn btn-primary btn-sm" data-action="le-save" data-idx="'+idx+'">保存</button>'+
        '<button class="btn btn-ghost btn-sm" data-action="le-cancel">取消</button></span>';
      }else{
        mid='<span class="lname">'+esc(l.name)+'</span><span class="lhex">'+esc(l.color)+'</span>'+
        '<span class="lcnt">'+(l.active?'被 '+l.count+' 个任务使用':'已停用 · 被 '+l.count+' 个任务引用')+'</span>';
        if(l.active){
          mid+='<button class="icon-btn" style="width:26px;height:26px" data-action="le-edit" data-idx="'+idx+'" aria-label="编辑标签 '+esc(l.name)+'">'+icon('edit',13)+'</button>'+
          '<button class="icon-btn" style="width:26px;height:26px" data-action="le-del" data-idx="'+idx+'" aria-label="删除标签 '+esc(l.name)+'">'+icon('trash',13)+'</button>';
        }else{
          mid+='<button class="btn btn-ghost btn-sm" data-action="le-restore" data-idx="'+idx+'">'+icon('undo',12)+'恢复</button>'+
          '<button class="btn btn-ghost btn-sm" style="color:#dc2626" data-action="le-force" data-idx="'+idx+'">强制删除</button>';
        }
      }
      return '<div class="lrow'+(l.active?'':' inactive')+'" '+(l.active?'draggable="true"':'')+' data-lrow="'+idx+'">'+
      (l.active?'<span class="grip" data-grip="'+idx+'" title="拖拽排序">'+icon('grip',14)+'</span>':'<span style="width:20px"></span>')+
      '<span class="dot" style="background:'+l.color+';width:10px;height:10px"></span>'+mid+'</div>';
    };
    const rows=S.labels.map(rowOf);
    openModal(
    '<div class="modal-head"><div class="modal-title">项目标签</div><div style="display:flex;gap:10px"><button class="btn btn-primary btn-sm" data-action="le-new">'+icon('plus',13)+'新建标签</button>'+
    '<button class="icon-btn" data-action="modal-close" aria-label="关闭">'+icon('x',16)+'</button></div></div>'+
    '<div id="lbl-rows">'+(rows.length?rows.join(''):'<div class="empty" style="padding:26px 0">'+icon('tag',44)+'<div class="empty-title" style="font-size:13px">还没有标签</div></div>')+'</div>'+
    '<div id="lbl-newform"></div>'+
    '<div class="hint" style="margin-top:14px">被引用的标签删除后先「停用」（可恢复）；强制删除会从全部任务摘除该标签；行可拖拽排序。</div>','w720');
    wireLabelModal();
  };
  const wireLabelModal=()=>{
    $$('[data-action="le-edit"]').forEach(b=>b.addEventListener('click',()=>{const l=S.labels[+b.dataset.idx];lblEdit={idx:+b.dataset.idx,color:l.color};render()}));
    $$('[data-action="le-cancel"]').forEach(b=>b.addEventListener('click',()=>{lblEdit=null;render()}));
    $$('[data-action="le-restore"]').forEach(b=>b.addEventListener('click',()=>{S.labels[+b.dataset.idx].active=true;save();toast('标签已恢复');render()}));
    $$('[data-action="le-del"]').forEach(b=>b.addEventListener('click',()=>{const idx=+b.dataset.idx;const l=S.labels[idx];
      if(l.count>0){
        openModal('<div class="modal-head"><div class="modal-title">停用标签</div><button class="icon-btn" data-action="modal-close" aria-label="关闭">'+icon('x',16)+'</button></div>'+
        '<div role="alertdialog" aria-label="停用标签确认"><div style="font-size:14px;margin-bottom:12px">标签 <b>'+esc(l.name)+'</b> 正被 <b>'+l.count+'</b> 个任务使用，删除将先<b>停用</b>（可恢复）。</div>'+
        '<div class="modal-foot"><button class="btn btn-ghost" data-action="modal-close">取消</button><button class="btn btn-danger" id="ld-ok">停用标签</button></div></div>');
        $('#ld-ok').addEventListener('click',()=>{l.active=false;save();closeModal();toast('标签已停用，可恢复或强制删除');openLabelModal();render()});
      }else{l.active=false;S.labels.splice(idx,1);save();toast('标签已删除');render()}}));
    $$('[data-action="le-force"]').forEach(b=>b.addEventListener('click',()=>{const l=S.labels[+b.dataset.idx];
      const needName=l.count>50;
      openModal('<div class="modal-head"><div class="modal-title">强制删除标签</div><button class="icon-btn" data-action="modal-close" aria-label="关闭">'+icon('x',16)+'</button></div>'+
      '<div role="alertdialog" aria-label="强制删除标签"><div class="alert alert-soft">'+icon('alert',14)+'将从 '+l.count+' 个任务摘除该标签，不可恢复。</div>'+
      (needName?'<div class="field"><span class="label">输入标签名以确认：'+esc(l.name)+'</span><input class="input" id="lf-name" placeholder="'+esc(l.name)+'" autocomplete="off"></div>':'')+
      '<div class="modal-foot"><button class="btn btn-ghost" data-action="modal-close">取消</button><button class="btn btn-danger" id="lf-ok" '+(needName?'disabled':'')+'>强制删除</button></div></div>');
      if(needName){const inp=$('#lf-name');inp.addEventListener('input',()=>$('#lf-ok').disabled=inp.value.trim()!==l.name)}
      $('#lf-ok').addEventListener('click',()=>{
        S.labels=S.labels.filter(x=>x.id!==l.id);
        S.issues.forEach(i=>i.labels=i.labels.filter(id=>id!==l.id));
        save();closeModal();toast('已强制删除标签 '+l.name+'（已从任务摘除）');openLabelModal();render();});}));
    $$('[data-le-color]').forEach(b=>b.addEventListener('click',()=>{lblEdit.color=b.dataset.leColor;const h=$('#le-hex');if(h)h.value=b.dataset.leColor;
      $$('.swatch').forEach(sw=>sw.classList.toggle('on',sw.dataset.leColor===b.dataset.leColor));
      const pv=b.closest('.swatches').nextElementSibling;if(pv&&pv.tagName==='INPUT'){/* hex */}}));
    const hex=$('#le-hex');
    if(hex)hex.addEventListener('input',()=>{if(/^#[0-9A-Fa-f]{6}$/.test(hex.value)){lblEdit.color=hex.value.toUpperCase();hex.classList.remove('invalid')}});
    $$('[data-action="le-save"]').forEach(b=>b.addEventListener('click',()=>{
      const l=S.labels[+b.dataset.idx];const nm=$('#le-name').value.trim();
      if(!nm){$('#le-name').classList.add('invalid');return}
      if(!/^#[0-9A-Fa-f]{6}$/.test(lblEdit.color)){const h=$('#le-hex');h.classList.add('invalid');h.focus();return}
      l.name=nm;l.color=lblEdit.color;save();toast('标签已保存');lblEdit=null;render();}));
    $$('[data-action="le-new"]').forEach(b=>b.addEventListener('click',()=>{
      S.labels.push({id:'l'+Date.now(),name:'新标签',color:'#3B82F6',count:0,active:true});
      lblEdit={idx:S.labels.length-1,color:'#3B82F6'};save();render();}));
    $$('[data-grip]').forEach(g=>{const row=g.closest('.lrow');
      row.addEventListener('dragstart',e=>{lblDrag=+g.dataset.grip;row.classList.add('dragging');e.dataTransfer.effectAllowed='move'});
      row.addEventListener('dragend',()=>row.classList.remove('dragging'));});
    $$('[data-lrow]').forEach((row,idx)=>row.addEventListener('dragover',e=>{
      if(lblDrag==null||!S.labels[lblDrag].active)return;e.preventDefault();
      const r=row.getBoundingClientRect();
      const after=e.clientY>r.top+r.height/2;
      const moved=S.labels.splice(lblDrag,1)[0];
      const at=idx+(after?1:0)-(lblDrag<idx?1:0);
      S.labels.splice(at,0,moved);lblDrag=at;save();render();}));
  };
  render();
}

function avatarBigEl(){
  const pr=S.profile;
  if(pr.avatarUrl){
    /* C.10 头像加载失败：渲染 <img> + onerror 回退默认 SVG（avatar_url 不回写）
       仅对 URL 中的 & 和 " 转义——保留 < > 字符以支持 data:image/svg+xml,utf8,... */
    const safeUrl=String(pr.avatarUrl).replace(/&/g,'&amp;').replace(/"/g,'&quot;');

  }
  return '<span class="bav" style="background:'+hashColor(pr.nick)+'">'+esc(pr.nick.slice(0,1))+'</span>';

function profileHTML(){
  const ds=S.demoState;
  if(ds==='error')return '<div class="set-card"><div class="err-block" style="padding:30px 0">'+icon('alert',40)+'<div class="empty-title">加载失败</div><div class="empty-sub">网络异常，请稍后重试</div><button class="btn btn-ghost" data-action="home-retry">重试</button></div></div>';

function wireProfile(){
  const nick=$('#pf-nick'),first=$('#pf-first'),last=$('#pf-last'),bio=$('#pf-bio');
  if(!nick)return;
  const dirty=()=>nick.value.trim()!==S.profile.nick||first.value!==S.profile.first||last.value!==S.profile.last||bio.value!==S.profile.bio;
  const upd=()=>{
    const ok=dirty()&&nick.value.trim()!=='';
    $('#pf-save').disabled=!ok;
    const c=$('#pf-cnt');c.textContent=bio.value.length+' / 500';
    c.style.color=bio.value.length>480?'#d97706':'';
  };
  [nick,first,last,bio].forEach(el=>el.addEventListener('input',upd));
  nick.addEventListener('blur',()=>{
    if(!nick.value.trim()){const e=$('#pf-nick-err');e.textContent=ERROR_TEXTS.REQUIRED;e.hidden=false;nick.classList.add('invalid');nick.setAttribute('aria-invalid','true')}
    else{$('#pf-nick-err').hidden=true;nick.classList.remove('invalid');nick.removeAttribute('aria-invalid')}});
  $('#pf-save').addEventListener('click',()=>{
    S.profile={...S.profile,nick:nick.value.trim(),first:first.value.trim(),last:last.value.trim(),bio:bio.value};
    S.user.name=S.profile.nick;save();
    const b=$('#pf-save');b.textContent='✓ 已保存';
    toast('资料已保存');
    setTimeout(()=>{render()},2000);});
  $('[data-action="pf-reset"]').addEventListener('click',render);
  $('[data-action="pf-avatar"]').addEventListener('click',()=>$('#av-file').click());
  const file=$('#av-file');
  file.addEventListener('change',()=>{
    const f=file.files&&file.files[0];
    if(!f)return;
    if(!['image/png','image/jpeg','image/webp'].includes(f.type)){toast('该格式不支持，仅 png / jpeg / webp',{variant:'warning'});file.value='';return}
    if(f.size>2*1024*1024){toast('文件超过 2MB 上限，请换更小的图片',{variant:'warning'});file.value='';return}
    startAvatarUpload();
  });
  const bigav=$('#bigav');
  bigav.addEventListener('dragover',e=>{e.preventDefault();bigav.classList.add('dragover')});
  bigav.addEventListener('dragleave',()=>bigav.classList.remove('dragover'));
  bigav.addEventListener('drop',e=>{e.preventDefault();bigav.classList.remove('dragover');startAvatarUpload()});
  const rst=$('[data-action="pf-av-reset"]');
  if(rst)rst.addEventListener('click',e=>popconfirm(e.currentTarget,'恢复为系统默认头像？','恢复',()=>{
    S.profile.avatarUrl=null;save();render();announce('已恢复默认头像');}));
  /* C.10 头像加载失败：onError 回退默认 SVG（avatar_url 不回写 —— 仅替换节点，不动 S.profile.avatarUrl） */
  const avImg=$('#bigav img.avatar-img');
  if(avImg){
    avImg.onerror=function(){
      const fb='<span class="bav" style="background:'+hashColor(S.profile.nick)+'">'+esc(S.profile.nick.slice(0,1))+'</span>';
      this.outerHTML=fb;
      announce('头像加载失败，已回退默认头像');
    };
  }
}
function startAvatarUpload(){
  avUploading=0;render();
  const iv=setInterval(()=>{
    avUploading=Math.min(100,avUploading+rint(8,18));
    const ring=$('#av-ring');
    if(!ring){clearInterval(iv);avUploading=null;return}
    ring.setAttribute('stroke-dashoffset',String(113-113*avUploading/100));
    ring.setAttribute('role','progressbar');
    ring.setAttribute('aria-valuenow',avUploading);
    const t=$('#av-rtxt');if(t)t.textContent=avUploading+'%';
    const wrap=ring.closest('.ring-wrap');if(wrap){wrap.setAttribute('role','progressbar');wrap.setAttribute('aria-valuetext','上传进度 '+avUploading+'%')}
    if(avUploading>=100){clearInterval(iv);
      /* 上传完成：用 data URL 写入 avatarUrl（原型无真实端点，用 SVG 表示「成功后的头像」） */
      const ch=S.profile.nick.slice(0,1);
      const svg='<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160"><defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#3f76ff"/></linearGradient></defs><circle cx="80" cy="80" r="80" fill="url(#g)"/><text x="80" y="108" text-anchor="middle" fill="#fff" font-size="80" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-weight="600">'+ch+'</text></svg>';
      S.profile.avatarUrl='data:image/svg+xml;utf8,'+encodeURIComponent(svg);
      save();avUploading=null;
      setTimeout(()=>{render();toast('头像已更新',{variant:'info'})},350)}
  },420);
}

  openModal('<div class="modal-head"><div class="modal-title">放弃当前内容？</div><button class="icon-btn" data-action="modal-close" aria-label="关闭">'+icon('x',16)+'</button></div>'+
  '<div style="font-size:14px;margin-bottom:8px">'+msg+'</div>'+
  '<div class="modal-foot"><button class="btn btn-ghost" data-action="modal-close">继续编辑</button><button class="btn btn-danger" id="cd-ok">放弃</button></div>');
  $('#cd-ok').addEventListener('click',()=>{closeModal();onOk()});
}

/* ═════════ 全局事件 ═════════ */
const findIssueByNotif=n=>n.task?issueById(n.task):null;
document.addEventListener('click',e=>{

  if(e.target.closest('[data-action="toast-act"]')){const a=tk&&tk._act;if(a&&a.fn)a.fn();if(tk)tk._kill();return}

    case 'go-login':nav('#/login');break;

    case 'open-team-modal':openTeamModal();break;
    case 'go-profile':nav('#/settings/profile');break;
    case 'open-notif':openNotifDrawer();break;

    case 'notif-open':{const n=S.notifs.find(x=>x.id===act.dataset.id)||S.notifsMore.find(x=>x.id===act.dataset.id);

    case 'sync-refresh':S.truncatedTip=false;save();toast('权限已同步');render();break;
    case 'home-stat':homeTab=act.dataset.tab;render();break;
    case 'home-refresh':{act.innerHTML='<span class="spinner" style="display:inline-flex">'+icon('rotate',16)+'</span>';announce('stats + 列表 + 通知已刷新');setTimeout(render,700);break}
    case 'home-retry':S.demoState='default';save();render();break;

    case 'open-proj-modal':openProjModal();break;
    case 'accept-sug':{$('#pj-id').value=act.dataset.sug;$('#pj-id-err').hidden=true;$('#pj-id').classList.remove('invalid');$('#pj-preview').textContent=act.dataset.sug+'-1';idDirty=true;break}

    case 'proj-status':projStatus=act.dataset.v;render();break;
    case 'proj-arch':projShowArch=act.dataset.v;render();break;

    case 'star-proj':{const p=projById(act.dataset.id);p.starred=!p.starred;p.starredAt=Date.now();save();render();break}
    case 'proj-settings':closeAllMenus();nav('#/p/'+act.dataset.id+'/settings');break;
    case 'proj-archive':{const p=projById(act.dataset.id);p.archived=!p.archived;save();closeAllMenus();toast(p.archived?'项目已归档，仅可查看':'已取消归档');render();break}
    case 'settings-save':{const p=projById(act.dataset.id);p.name=$('#st-name').value.trim()||p.name;p.desc=$('#st-desc').value;save();toast('已保存');break}
    case 'proj-delete':closeAllMenus();{const p=projById(act.dataset.id);if(p)openDeleteProj(p)}break;
    case 'open-invite':openInviteModal();break;
    case 'invite-close':{if($('#inv-send')&&invTags.length&&!invSending){confirmDiscard('已输入的邮箱将丢失',closeModal)}else closeModal();break}
    case 'invite-again':invTags=[];renderInviteModal();break;
    case 'inv-del':invTags.splice(+act.dataset.i,1);{const inp=$('#inv-inp');if(inp){inp.value='';}renderInviteModal();const n=$('#inv-inp');if(n)n.focus();break}
    case 'copy-invlink':copyText('https://rabbit.dev/invite/'+Math.random().toString(36).slice(2,10),'已复制邀请链接');break;

    case 'pm-clear':pmQ='';render();break;
    case 'pm-rolef':pmRoleF=act.dataset.v;render();break;
    case 'pm-role':{const p=projById(parseHash().seg[1]);const m=(S.pmembers[p.id]||[]).find(x=>x.name===act.dataset.name);
      if(!m)break;
      if(m.role==='admin'&&act.dataset.v!=='admin'){toast('无权调整同级管理员的角色（后端 403 · 已回滚）',{variant:'warning'});closeAllMenus();break}
      m.role=act.dataset.v;save();closeAllMenus();toast('已将 '+m.name+' 调整为 '+PROLES[act.dataset.v].n);render();break}
    case 'pm-remove':{const p=projById(parseHash().seg[1]);const m=(S.pmembers[p.id]||[]).find(x=>x.name===act.dataset.name);closeAllMenus();if(m)openRemoveProjMember(p,m);break}
    case 'mem-clear':memQ='';memShow=8;render();break;

    case 'mem-more':memShow=999;render();break;
    case 'pending-toggle':pendingOpen=!pendingOpen;render();break;
    case 'invite-resend':toast('邀请邮件已重发（7 天内有效）');break;
    case 'invite-revoke':{const iv=S.pendingInvites[+act.dataset.i];popconfirm(act,'撤销对 '+iv.masked+' 的邀请？','撤销',()=>{S.pendingInvites.splice(+act.dataset.i,1);save();toast('已撤销邀请');render()});break}
    case 'open-transfer':openTransferModal();break;
    case 'ws-role':{const m=wsMembers().find(x=>x.name===act.dataset.name);if(m){m.role=act.dataset.role;save();toast('已将 '+m.name+' 调整为 '+WSROLES[act.dataset.role].n)}closeAllMenus();render();break}
    case 'ws-adjust':{closeAllMenus();const row=act.closest('tr');const btn=row&&row.querySelector('[data-menu-btn]');if(btn)btn.click();break}
    case 'ws-remove':{closeAllMenus();const m=wsMembers().find(x=>x.name===act.dataset.name);if(m)openRemoveWsModal(m);break}
    case 'fset':{const f=filtersNow();const k=act.dataset.k,v=act.dataset.v;
      if(k==='due'){f.due=f.due===v?'':v}
      else{if(f[k].includes(v))f[k]=f[k].filter(x=>x!==v);else f[k].push(v)}
      writeFilters(f);closeAllMenus();break}
    case 'f-onlyme':{const f=filtersNow();f.as=f.as.includes('me')?f.as.filter(x=>x!=='me'):['me'];writeFilters(f);closeAllMenus();break}
    case 'f-sort':{const f=filtersNow();f.sort=act.dataset.v;writeFilters(f);closeAllMenus();break}
    case 'f-due-custom':{const f=filtersNow();const av=$('#due-a').value,bv=$('#due-b').value;
      if(av&&bv){f.due=[av,bv].sort().join('..');writeFilters(f);closeAllMenus()}break}
    case 'f-clearq':{const f=filtersNow();f.q='';writeFilters(f);break}
    case 'f-clearall':writeFilters({q:'',st:[],ty:[],pr:[],lb:[],as:[],cr:[],due:'',sort:'seq:asc'});break;
    case 'chip-x':{const f=filtersNow();const k=act.dataset.k,vals=act.dataset.v.split(',');
      if(k==='due')f.due='';else f[k]=f[k].filter(x=>!vals.includes(x));
      writeFilters(f);break}
    case 'sort':{const f=filtersNow();const col=act.dataset.col;const[cur,dir]=f.sort.split(':');
      let next=e.shiftKey?'desc':act.dataset.next;
      if(e.shiftKey&&cur===col&&dir==='desc')next='asc';
      f.sort=col+':'+next;writeFilters(f);break}
    case 'list-more':listShown+=30;render();break;
    case 'col-more':colShown[act.dataset.col]=(colShown[act.dataset.col]||10)+25;render();break;
    case 'col-add':wireColAdd(act);break;
    case 'guide-close':guideDismissed=true;render();break;

    case 'open-labels':closeAllMenus();openLabelModal();break;
    case 'open-issue':if(!stop&&!e.target.closest('.menu'))openDrawer(act.dataset.id);break;

    case 'drawer-close':closeAllMenus();closeDrawer();break;
    case 'dw-tab':drawerState.tab=act.dataset.tab;{const i=issueById(drawerState.id);if(i)drawDrawer(i)}break;
    case 'sub-toggle':{const sub=issueById(act.dataset.id);if(sub){sub.state=sub.state==='completed'?'unstarted':'completed';sub.updMin=0;

      save();const cur=issueById(drawerState.id);if(cur)drawDrawer(cur)}break}
    case 'open-sub':openDrawer(act.dataset.id);break;
    case 'sub-del':{closeAllMenus();const sub=issueById(act.dataset.id);if(sub){S.issues=S.issues.filter(x=>x.id!==sub.id);
      const parent=issueById(sub.parent);if(parent)parent.subN=S.issues.filter(x=>x.parent===parent.id).length;
      save();toast('已删除子任务');const cur=issueById(drawerState.id);if(cur)drawDrawer(cur)}break}
    case 'act-more':{actShown[parseHash2id()]=(actShown[parseHash2id()]||5)+5;const i=issueById(drawerState.id);if(i)drawDrawer(i);break}
    case 'att-add':{const i=issueById(drawerState.id);if(i)startUpload(i,'选择文件-'+rint(1,99)+'.pdf','fileText',rint(500,15000));break}
    case 'role-set':setRole(act.dataset.v);break;
    case 'state-set':setDemoState(act.dataset.v);break;
    case 'demo-error':toast('服务器开小差了，请稍后重试',{variant:'error',requestId:REQ_ID_FULL,feedback:true});break;
    case 'demo-429':toast('请求过于频繁，请在 23 秒后重试',{variant:'warning'});break;
    case 'demo-info':toast('已保存',{variant:'info'});break;
    case 'smtp-toggle':S.smtpDegraded=!S.smtpDegraded;save();renderDockState();toast('SMTP 降级已'+(S.smtpDegraded?'开启：invited 条目将出现「复制邀请链接」':'关闭'),{variant:'info'});break;
    case 'trunc-toggle':S.truncatedTip=!S.truncatedTip;save();render();if(S.truncatedTip)toast('已显示权限截断提示条（meta.truncated=true）',{variant:'info'});break;
    case 'toggle-fail':{simFail=!simFail;renderDockState();toast(simFail?'拖拽失败模拟已开启（下次松手即失败）':'拖拽失败模拟已关闭');break}
    /* 清单对齐演示（验收用） */
    case 'av-broken':{
      S.avBroken=!S.avBroken;save();
      if(S.avBroken){S.profile.avatarUrl='broken:invalid-url-'+Date.now();}
      else if(S.profile.avatarUrl&&S.profile.avatarUrl.startsWith('broken:')){S.profile.avatarUrl=null;}
      save();render();renderDockState();
      toast(S.avBroken?'头像 URL 已置为失效（请进入「个人资料」查看 onError 回退）':'头像 URL 已恢复',{variant:'info'});
      break;
    }
    case 'ws-implicit':{
      S.wsImplicitAdmin=!S.wsImplicitAdmin;save();
      S.pmembers.rbt=S.pmembers.rbt||[];
      if(S.wsImplicitAdmin){
        S.pmembers.rbt=S.pmembers.rbt.filter(m=>m.name!=='张三');
      }else{
        if(!S.pmembers.rbt.find(m=>m.name==='张三'))S.pmembers.rbt.unshift({name:'张三',role:'admin',joined:'09-01 10:00'});
      }
      save();render();renderDockState();
      break;
    }
    case 'act-empty':{
      S.activityEmpty=!S.activityEmpty;save();render();renderDockState();break;
    }
    case 'mention-removed':{
      S.mentionedRemoved=!S.mentionedRemoved;save();
      if(!S.mentionedRemoved){
        /* 关闭时清除已渲染的 tooltip，让下次进入抽屉时按当前态判定 */
        document.querySelectorAll('.mention[data-removed-mention]').forEach(el=>{el.removeAttribute('title');el.removeAttribute('data-removed-mention')});
      }
      render();renderDockState();
      toast(S.mentionedRemoved?'@梁工 已标记为「已移出」（请到任务抽屉·评论 Tab hover @梁工 查看）':'已恢复 @-锚点',{variant:'info'});
      break;
    }
    case 'gate-load':{
      /* C.14 Gate 加载骨架：渲染 → 等宽等高骨架（aria-busy）→ 解析为无权（aria-live 播报一次） */
      S.permLoading=true;S.permState='allowed';save();render();
      setTimeout(()=>{
        S.permLoading=false;S.permState='denied';save();render();
        announce('权限加载完成，当前角色无权创建任务');
      },450);
      break;
    }
    case 'perm-refresh':{
      /* C.14 403 后权限刷新：拦截器触发静默重拉，按钮显隐收敛，无感（无 toast） */
      S.permLoading=true;S.permState='denied';save();render();
      setTimeout(()=>{
        S.permLoading=false;S.permState='allowed';save();render();
        announce('权限已刷新');
      },400);
      break;
    }
    case 'reset-demo':try{localStorage.removeItem(LS_KEY)}catch(x){}location.hash='';location.reload();break;
    case 'dock-toggle':{const p=$('#dock-panel');p.hidden=!p.hidden;break}
    case 'modal-close':closeModal();break;
    default:closeAllMenus();
  }
  if(['open-issue','copy-key','delete-issue','fset','chip-x','sort','star-proj','open-project','ws-role','pm-role','sub-toggle','open-sub'].includes(a))return;
  if(!mb)closeAllMenus();
});
const actShown={};
const parseHash2id=()=>drawerState.id||'x';
document.addEventListener('keydown',e=>{
  /* Esc 分层：@浮层 → Popconfirm → 菜单 → Modal → 通知抽屉 → Peek → 任务抽屉 → 搜索框 */
  if(e.key==='Escape'){
    if(mentionState.open){closeMention();return}
    if($('#pop')){closePop();return}
    const m=document.querySelector('.menu:not([hidden])');
    if(m){m.hidden=true;return}
    if($('#modal-root').innerHTML){closeModal();return}
    if($('#notif-root').innerHTML){closeNotif();return}
    if($('#peek')){hidePeek();return}
    if(drawerState.id){closeDrawer();return}
    const si=$('#f-search');
    if(si&&si===document.activeElement){if(si.value){const f=filtersNow();f.q='';writeFilters(f)}else si.blur();return}
  }
  /* / 聚焦搜索（列表/看板，输入态除外） */
  if(e.key==='/'&&$('#f-search')&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&!document.activeElement.isContentEditable){
    e.preventDefault();$('#f-search').focus();return}
  /* div[role=button|option|link] 的 Enter / Space 激活（键盘可达） */
  {
    const da=e.target.closest&&e.target.closest('[data-action]');
    const tn=e.target.tagName;
    if((e.key==='Enter'||e.key===' ')&&da&&!['BUTTON','A','INPUT','TEXTAREA','LABEL','TR'].includes(da.tagName)&&!da.isContentEditable){
      e.preventDefault();da.click();return}
  }
  /* 列表行方向键导航 + Enter 打开（C.28） */
  const tr=e.target.closest&&e.target.closest('#task-table tr[data-action]');
  if(tr&&(e.key==='ArrowDown'||e.key==='ArrowUp')){
    e.preventDefault();
    const rows=[...document.querySelectorAll('#task-table tbody tr')];
    const idx=rows.indexOf(tr);
    const nx=rows[(idx+(e.key==='ArrowDown'?1:rows.length-1))%rows.length];
    if(nx)nx.focus();return}
  if(tr&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openDrawer(tr.dataset.id);return}
  /* F2 聚焦 Peek（C.30） */
  if(e.key==='F2'&&$('#peek')){e.preventDefault();$('#peek').focus();return}
  /* ⌘S 保存（C.10） */
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){const b=$('#pf-save');if(b&&!b.disabled){e.preventDefault();b.click();return}}
  /* 添加成员 listbox 键盘（C.21） */
  if($('#am-list')&&document.activeElement&&($('#am-q')===document.activeElement||document.activeElement.closest('.cand-list'))){
    const p=projById(amPid);
    const inProj=new Set((S.pmembers[amPid]||[]).map(m2=>m2.name));
    const cands=wsMembers().filter(m2=>!inProj.has(m2.name)).filter(m2=>!amQ||((m2.name+m2.email).toLowerCase().includes(amQ.toLowerCase())));
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();amActive=Math.max(0,Math.min(cands.length-1,amActive+(e.key==='ArrowDown'?1:-1)));openAddMemModal(amPid,true);return}
    if(e.key===' '){e.preventDefault();const m2=cands[amActive];if(m2){if(amSel.includes(m2.name))amSel=amSel.filter(x=>x!==m2.name);else amSel.push(m2.name);openAddMemModal(amPid,true)}return}
    if(e.key==='Enter'){e.preventDefault();const ok=$('#am-ok');if(ok&&!ok.disabled)ok.click();return}
  }
});
document.addEventListener('mousedown',e=>{ /* Peek 内部进入时保持 */
  const pk=$('#peek');
  if(pk&&!e.target.closest('#peek')&&!e.target.closest('.bcard'))hidePeek();
},true);
/* ═════════ 启动 ═════════ */
buildDock();
if(!location.hash)location.hash='#/login';
render();
