name: security-gate

# QA-001 §4.3 四源扫描 + BR-06 判定（Critical 零容忍 / High 凭豁免单）。
# 触发：PR + 每日 03:00 定期（新披露 CVE 不等下次改动）。
on:
  pull_request:
    paths: ["apps/api/**", "packages/**", "apps/*/package.json", "pnpm-lock.yaml", "security/**", "ci/**"]
  schedule:
    - cron: "0 19 * * *"   # UTC 19:00 = 本地 03:00（每日错峰）

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # gitleaks 全历史扫描

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - uses: actions/setup-node@v4
        with: { node-version: "22.14.0" }

      - run: corepack enable && corepack prepare pnpm@11.0.0 --activate

      # ① Python 依赖（apps/api 锁定环境）
      - name: pip-audit
        run: |
          pip install pip-audit
          cd apps/api && pip-audit --strict --format json --output ../pip-audit.json || true
      # ② 前端依赖（pnpm workspace 全量）
      - name: pnpm audit
        run: pnpm install --frozen-lockfile --ignore-scripts || true
        # audit 不需要 node_modules 完整装好——install 失败不阻断扫描
      - name: pnpm audit (json)
        run: |
          pnpm audit --json > npm-audit.json || true
      # ③ 密钥入仓扫描（全历史）
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz
          # 2026-09-10 修正扫描序：原 `--no-git || 全历史` 在工作树干净后永远不会扫
          # git 历史（fetch-depth: 0 形同虚设）。改为历史优先，无 git 场景才回退树扫描。
          # 虚构固件豁免见 .gitleaks.toml（BR-06：真实凭据零容忍，verdict 终审）。
          ./gitleaks detect --source . --report-format json --report-path gitleaks.json || \
          ./gitleaks detect --source . --report-format json --report-path gitleaks.json --no-git
      # ④ 镜像扫描（api 镜像；pull 失败回退 fs 扫描——本地无镜像源时不断流）
      - name: trivy image / fs
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.63.0
          trivy image --severity CRITICAL,HIGH --format json --output trivy.json rabbitprojects/api:latest \
            || trivy fs --severity CRITICAL,HIGH --format json --output trivy.json apps/api/pyproject.toml || true
      # ⑤ 判定（BR-06：Critical 零容忍 / High 凭 security/exemptions.yml 且未过期）
      - name: verdict
        run: python ci/security_verdict.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: "*-audit*.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports-2
          path: "trivy.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports-3
          path: "gitleaks.json"
